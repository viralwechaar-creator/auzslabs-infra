# 1. Replace agents.example.com with your real address (e.g. agents.auzslab.in).
# 2. Save as /etc/nginx/sites-available/agents-office and link it into sites-enabled.
# 3. Run: certbot --nginx -d <your address>
#    certbot then adds the HTTPS listener, the certificate and the http->https redirect to this same block.

limit_req_zone $binary_remote_addr zone=office_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agents.example.com;

    client_max_body_size 128k;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Slow down password guessing (the app also locks out after 5 wrong tries)
    location = /api/login {
        limit_req zone=office_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # set, never append: visitors cannot fake their address
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
