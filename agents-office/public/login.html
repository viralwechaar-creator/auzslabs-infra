<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171717">
<title>__BUSINESS__ Agents Office</title>
<style nonce="__NONCE__">
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#f5f4f2;color:#171717;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:380px}
h1{font-size:26px;margin:0 0 4px}
p{margin:0 0 20px;color:#6b6560}
form{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;font-size:17px;min-height:50px;padding:0 14px;border:1.5px solid #d9d4ce;border-radius:12px;background:#fff;color:inherit}
input:focus{outline:3px solid #80002033;border-color:#800020}
button{margin-top:14px;width:100%;min-height:52px;font:inherit;font-weight:600;border:0;border-radius:14px;background:#800020;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#b00020;min-height:22px;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Agents Office</h1>
  <p>__BUSINESS__ — owner login</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Open the office</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script nonce="__NONCE__">
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json', 'x-office': '1' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.replace('/'); return; }
    err.textContent = j.error || 'Could not log in.';
  } catch { err.textContent = 'No connection. Try again.'; }
  go.disabled = false;
});
</script>
</body>
</html>
