<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AUZsStyle customer display</title>
<meta name="theme-color" content="#161618">
<style>
  :root{--ink:#161618;--accent:#800020;--bg:#f5f4f2;--muted:#8a8a86}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:#fff;font:16px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw}
  .logo{max-width:40vw;max-height:16vh;margin-bottom:4vh;border-radius:14px}
  .store{font-size:clamp(20px,5vw,34px);font-weight:700;letter-spacing:-.01em}
  .idle-sub{color:#b9b8b5;margin-top:10px;font-size:clamp(13px,2.6vw,16px)}
  #qr{display:none;background:#fff;color:var(--ink);border-radius:22px;padding:5vw 6vw;width:min(92vw,520px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  #qr img{width:min(70vw,340px);height:auto;display:block;margin:0 auto 16px}
  #qr .amt{font-size:clamp(28px,8vw,52px);font-weight:800;letter-spacing:-.02em}
  #qr .sub{color:var(--muted);margin-top:6px;font-size:clamp(13px,2.6vw,16px)}
  #qr .store2{margin-top:14px;font-weight:700}
  #paid{display:none}
  #paid .tick{width:88px;height:88px;border-radius:50%;background:#1f8a4c;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  #paid .tick svg{width:46px;height:46px}
  #paid .amt{font-size:clamp(24px,6vw,40px);font-weight:800}
  #paid .sub{color:#b9b8b5;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
  <div id="idle"><img id="idleLogo" class="logo" alt="" style="display:none"><div class="store" id="idleStore">AUZslab</div><div class="idle-sub">Ready for your next customer</div></div>
  <div id="qr"><img id="qrImg" alt="UPI QR"><div class="amt" id="qrAmt"></div><div class="sub">Scan with any UPI app to pay</div><div class="store2" id="qrStore"></div></div>
  <div id="paid"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="amt" id="paidAmt"></div><div class="sub">Payment received</div></div>
</div>
<script>
(function () {
  'use strict';
  var chName = new URLSearchParams(location.search).get('ch') || 'auz-sty-cust-x';
  var idle = document.getElementById('idle'), qr = document.getElementById('qr'), paid = document.getElementById('paid');
  var idleLogo = document.getElementById('idleLogo'), idleStore = document.getElementById('idleStore');
  var qrImg = document.getElementById('qrImg'), qrAmt = document.getElementById('qrAmt'), qrStore = document.getElementById('qrStore');
  var paidAmt = document.getElementById('paidAmt');
  var paidTimer = null;
  function showIdle() {
    clearTimeout(paidTimer);
    idle.style.display = 'block'; qr.style.display = 'none'; paid.style.display = 'none';
  }
  function showQr(m) {
    clearTimeout(paidTimer);
    idle.style.display = 'none'; paid.style.display = 'none'; qr.style.display = 'block';
    qrImg.src = m.img || '';
    qrAmt.textContent = '₹' + Number(m.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    qrStore.textContent = m.store || '';
  }
  function showPaid(m) {
    idle.style.display = 'none'; qr.style.display = 'none'; paid.style.display = 'block';
    paidAmt.textContent = '₹' + Number(m.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    clearTimeout(paidTimer); paidTimer = setTimeout(showIdle, 4000);
  }
  try {
    var chan = new BroadcastChannel(chName);
    chan.onmessage = function (e) {
      var m = e.data || {};
      if (m.type === 'qr') showQr(m);
      else if (m.type === 'paid') showPaid(m);
      else if (m.type === 'idle') {
        if (m.store) idleStore.textContent = m.store;
        if (m.logoUrl) { idleLogo.src = m.logoUrl; idleLogo.style.display = ''; }
        showIdle();
      }
    };
    // ask the till (same browser, other window/tab) to resend its current state --
    // covers the display reconnecting mid-bill (power cycle, cable unplugged, etc.)
    chan.postMessage({ type: 'hello' });
  } catch (e) {
    idleStore.textContent = 'This browser cannot run the customer display';
  }
})();
</script>
</body>
</html>
