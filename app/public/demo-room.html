<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demo room</title>
<style>
  :root{--bg:#f5f4f2;--ink:#171717;--accent:#800020;--line:#e2dcd4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif}
  .shell{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
  header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button,a.b{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tabs{display:flex;gap:6px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;min-width:0;display:none;flex-direction:column;border-right:1px solid var(--line)}
  .pane.on{display:flex}
  .pane h2{margin:0;padding:6px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7a756d;background:#fff;border-bottom:1px solid var(--line)}
  iframe{flex:1;border:0;width:100%;background:#fff}
  .tip{padding:6px 12px;font-size:13px;color:#7a756d;background:#fff;border-bottom:1px solid var(--line)}
  @media(min-width:1000px){.tabs{display:none}.pane{display:flex}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <b id="ttl">Demo room</b>
    <div class="tabs"><button id="tSite" class="on">Website</button><button id="tPos">POS</button></div>
    <a class="b" href="/salesman.html#trials">Back to team</a>
  </header>
  <div class="tip">Order on the website (left) and watch it arrive in the POS (right). Same business, same data — no switching.</div>
  <main>
    <section class="pane on" id="pSite"><h2>Website &amp; ordering</h2><iframe id="fSite" title="Website"></iframe></section>
    <section class="pane" id="pPos"><h2>POS &amp; kitchen</h2><iframe id="fPos" title="POS"></iframe></section>
  </main>
</div>
<script src="/config.js"></script>
<script src="/sb-client.js"></script>
<script>
// sb-client.js has already taken the session from the #auz_gt fragment into localStorage, so the POS frame below is signed in.
var q = new URLSearchParams(location.search);
document.getElementById('ttl').textContent = q.get('n') || 'Demo room';
var t = q.get('t');
document.getElementById('fSite').src = '/site.html' + (t ? '?t=' + encodeURIComponent(t) : '');
document.getElementById('fPos').src = '/index.html';
function show(w){
  document.getElementById('pSite').classList.toggle('on', w === 'site');
  document.getElementById('pPos').classList.toggle('on', w === 'pos');
  document.getElementById('tSite').classList.toggle('on', w === 'site');
  document.getElementById('tPos').classList.toggle('on', w === 'pos');
}
document.getElementById('tSite').onclick = function(){ show('site'); };
document.getElementById('tPos').onclick = function(){ show('pos'); };
</script>
</body>
</html>
