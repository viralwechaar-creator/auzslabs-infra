<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AUZlabs — New Client</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:8vh auto;padding:0 16px;color:#161513}
label{display:block;margin-top:14px;font-size:14px;color:#444}
input,select{width:100%;padding:8px;margin-top:4px;font-size:15px;box-sizing:border-box}
button{margin-top:20px;padding:10px 16px;font-size:15px;cursor:pointer}
.err{color:#b00020;margin-top:10px}
.ok{background:#eef7ee;border:1px solid #bfe3bf;padding:12px;margin-top:16px;border-radius:6px}
.ok a{word-break:break-all}
</style>
</head><body>
<style>
#leads table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
#leads th,#leads td{text-align:left;padding:6px 8px;border-bottom:1px solid #ddd;vertical-align:top}
#leads button{margin:0 4px 4px 0;padding:4px 8px;font-size:12px}
</style>
<h2>Onboard a new client</h2>
<div id=login>
 <label>Your AUZlabs admin email<input id=email type=email></label>
 <label>Password<input id=password type=password></label>
 <button id=signin>Sign in</button>
 <div id=loginErr class=err></div>
</div>

<form id=form style="display:none">
 <label>Business name<input id=name required placeholder="OG Book Cafe"></label>
 <label>Subdomain<input id=slug required placeholder="ogbookcafe" pattern="[a-z0-9-]+"></label>
 <label>Niche<select id=niche>
   <option value=cafe>Cafe / Restaurant</option>
   <option value=salon>Salon</option>
   <option value=gym>Gym</option>
   <option value=retail>Retail</option>
   <option value=general>General</option>
 </select></label>
 <label>Owner's email (their first login)<input id=ownerEmail type=email required></label>
 <button type=submit>Create client</button>
 <div id=formErr class=err></div>
</form>

<div id=result></div>

<div id=leads style="display:none">
 <h2>Leads</h2>
 <div id=leadsList>Loading…</div>
</div>

<script src=/sb-client.js></script>
<script src=/config.js></script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('form').style.display = 'block';
    document.getElementById('leads').style.display = 'block';
    loadLeads();
  }
}
checkSession();

const STATUS_NEXT = { new: 'contacted', contacted: 'converted' };

async function loadLeads() {
  const listEl = document.getElementById('leadsList');
  const { data, error } = await sb.from('leads').select('*').order('created_at');
  if (error) { listEl.textContent = error.message; return; }
  if (!data || !data.length) { listEl.textContent = 'No leads yet.'; return; }
  const rows = data.slice().reverse().map((l) => `
    <tr data-id="${l.id}">
      <td><b>${esc(l.name)}</b>${l.business ? '<br>' + esc(l.business) : ''}</td>
      <td>${esc(l.contact)}</td>
      <td>${esc(l.niche || '—')}</td>
      <td>${esc(l.message || '')}</td>
      <td>${esc(l.status)}</td>
      <td>
        <button data-use>Use for onboarding</button>
        ${STATUS_NEXT[l.status] ? `<button data-advance="${STATUS_NEXT[l.status]}">Mark ${STATUS_NEXT[l.status]}</button>` : ''}
      </td>
    </tr>`).join('');
  listEl.innerHTML = `<table><tr><th>Name</th><th>Contact</th><th>Niche</th><th>Message</th><th>Status</th><th></th></tr>${rows}</table>`;

  listEl.querySelectorAll('tr[data-id]').forEach((tr) => {
    const id = tr.dataset.id;
    const lead = data.find((l) => l.id === id);
    const useBtn = tr.querySelector('[data-use]');
    if (useBtn) useBtn.onclick = () => {
      document.getElementById('name').value = lead.business || lead.name;
      document.getElementById('niche').value = lead.niche || 'general';
      document.getElementById('ownerEmail').value = lead.contact.includes('@') ? lead.contact : '';
      document.getElementById('form').scrollIntoView({ behavior: 'smooth' });
    };
    const advBtn = tr.querySelector('[data-advance]');
    if (advBtn) advBtn.onclick = async () => {
      await sb.from('leads').update({ status: advBtn.dataset.advance }).eq('id', id);
      loadLeads();
    };
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('signin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginErr').textContent = error.message;
    return;
  }
  checkSession();
};

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const slug = document.getElementById('slug').value.trim().toLowerCase();
  const niche = document.getElementById('niche').value;
  const ownerEmail = document.getElementById('ownerEmail').value.trim();
  const errEl = document.getElementById('formErr');
  const resultEl = document.getElementById('result');
  errEl.textContent = '';
  resultEl.innerHTML = 'Creating tenant…';

  const { data: tenantId, error: rpcErr } = await sb.rpc('provision_tenant', {
    p_name: name, p_slug: slug, p_niche: niche
  });
  if (rpcErr) {
    errEl.textContent = rpcErr.message;
    resultEl.innerHTML = '';
    return;
  }

  resultEl.innerHTML = 'Tenant created — creating owner login…';
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(CFG.url + '/admin/provision-owner', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token
    },
    body: JSON.stringify({ tenant_id: tenantId, email: ownerEmail, name })
  });
  const body = await res.json();
  if (!res.ok) {
    errEl.textContent = body.error || 'owner creation failed';
    resultEl.innerHTML = `Tenant "${esc(name)}" was created (slug: ${esc(slug)}), but the owner login failed — you can retry just that step, or create the login directly with a POST to /admin/provision-owner.`;
    return;
  }

  resultEl.innerHTML = `
    <div class=ok>
      <b>${esc(name)}</b> is live at <b>${esc(slug)}.auzslab.in</b><br><br>
      Share these with the owner directly (e.g. over WhatsApp) so they can sign in and change it:<br>
      Email: <b>${esc(ownerEmail)}</b><br>
      Temporary password: <b>${esc(body.temp_password)}</b>
    </div>`;
  e.target.reset();
};
</script>
</body></html>
