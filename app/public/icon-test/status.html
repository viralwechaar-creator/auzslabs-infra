<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icon check</title><meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/app-icon/512.png?v=5">
<style>body{font:15px -apple-system,sans-serif;padding:16px;background:#fff;color:#000}.r{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}.r img{width:64px;height:64px;border:1px solid #ccc;background:#eee;object-fit:contain}.ok{color:#080}.bad{color:#c00}small{display:block;color:#555;word-break:break-all}</style></head><body>
<h2>Icon check</h2><p>Screenshot this whole page and send it to Claude.</p><div id="out"></div>
<script>
var list=['/icon-pos-180.png','/radz/icon-180.png','/radz/icon-512.png','/app-icon/180.png','/app-icon/512.png?v=5'];
var out=document.getElementById('out');
list.forEach(function(u){
  var d=document.createElement('div');d.className='r';
  var im=new Image();im.width=64;im.height=64;
  var t=document.createElement('div');t.innerHTML='<b>'+u+'</b><small>checking...</small>';
  d.appendChild(im);d.appendChild(t);out.appendChild(d);
  var info={};
  im.onload=function(){info.draw='drawn '+im.naturalWidth+'x'+im.naturalHeight;show()};
  im.onerror=function(){info.draw='CANNOT DRAW';show()};
  im.src=u;
  fetch(u,{cache:'no-store'}).then(function(r){return r.blob().then(function(b){info.net=r.status+' '+(r.headers.get('content-type')||'?')+' '+b.size+' bytes';show()})}).catch(function(e){info.net='FETCH FAILED '+e;show()});
  function show(){var ok=info.draw&&info.draw.indexOf('drawn')==0&&info.net&&info.net.indexOf('200 image')==0;t.innerHTML='<b>'+u+'</b> <span class="'+(ok?'ok':'bad')+'">'+(ok?'OK':'check')+'</span><small>'+(info.net||'...')+' | '+(info.draw||'...')+'</small>'}
});
var p=document.createElement('p');p.innerHTML='Browser: '+navigator.userAgent+'<br>Page: '+location.href;out.appendChild(p);
</script></body></html>
