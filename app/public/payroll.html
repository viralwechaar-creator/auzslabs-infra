:root{--ink:#171717;--ink-dim:#4d4d4d;--ink-faint:#8c8c8c;--accent:#800020;--g:var(--accent);--l:rgba(23,23,23,.14);--bg-raised:#dedede;--radius-sm:14px;--radius-md:18px;--radius-lg:26px;--shadow-sm:0 1px 2px rgba(23,23,23,.06),0 6px 20px -10px rgba(23,23,23,.14);--shadow-md:0 4px 12px rgba(23,23,23,.08),0 20px 44px -16px rgba(23,23,23,.22);--ease:cubic-bezier(.4,0,.2,1)}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg-raised);color:var(--ink);-webkit-tap-highlight-color:transparent}

<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script>
const C=window.CFG||{},sb=supabase.createClient(C.url,C.key),S={tab:'employees',cur:null},R={},V={};let busy=0,syncErr=0;
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),r2=n=>Math.round(n*100)/100,inr=n=>'₹'+r2(n).toLocaleString('en-IN');
const today=()=>new Date().toLocaleDateString('en-CA');
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){const v=a[x];if(v==null||v===false)continue;x.startsWith('on')?e[x]=v:x=='class'?e.className=v:e.setAttribute(x,v)}e.append(...k.flat().filter(x=>x!=null&&x!==false));return e};
const L=k=>Object.values(R).filter(r=>r.kind==k&&!r.deleted).map(r=>r.data);
const idb=new Promise(r=>{const q=indexedDB.open('hr1',1);q.onupgradeneeded=()=>['rec','out','meta'].forEach(s=>q.result.createObjectStore(s,{keyPath:s=='meta'?'k':'id'}));q.onsuccess=()=>r(q.result)});
const tx=async(s,m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),clr=s=>tx(s,'readwrite',o=>o.clear());
async function save(kind,data,id=data.id||uid(),deleted=false){data.id=id;const base=(R[id]&&R[id].srv)||null,r={id,kind,data,deleted,updated_at:now(),srv:(R[id]&&R[id].srv)};R[id]=r;await put('rec',r);await put('out',{id,kind,data,deleted,updated_at:r.updated_at,base});sync();return r}
async function doSync(){if(busy||!navigator.onLine||!S.user)return;busy=1;
 try{
 const{data:{session}}=await sb.auth.getSession();if(!session){busy=0;return forceRelogin('Your session ended. Please sign in again.')}
 for(const r of await all('out')){try{
  const{data:res,error}=await sb.rpc('push_record',{rid:r.id,rkind:r.kind,rdata:r.data,rdeleted:r.deleted,base:r.base||null,force:false});
  if(error){if(/JWT|expired|401|invalid/i.test(error.message||'')){busy=0;return forceRelogin('Your session ended. Please sign in again.')}throw error}
  let sv=res.server_updated_at;
  if(res.conflict){const{data:res2,error:e2}=await sb.rpc('push_record',{rid:r.id,rkind:r.kind,rdata:r.data,rdeleted:r.deleted,base:null,force:true});if(e2)throw e2;sv=res2.server_updated_at}
  if(R[r.id])R[r.id].srv=sv;
  const c=await get('out',r.id);if(c&&c.updated_at==r.updated_at)await del('out',r.id)
 }catch(e){syncErr++;console.warn('sync item',r.id,e)}}
 const since=((await get('meta','since'))||{}).v||'1970-01-01T00:00:00Z',{data,error}=await sb.from('records').select('id,kind,data,deleted,updated_at').gte('updated_at',since).order('updated_at').limit(1000);if(error)throw error;let ch=0;
 for(const row of data){if(!row.kind.startsWith('hr_'))continue;if(await get('out',row.id)||(R[row.id]&&R[row.id].updated_at==row.updated_at))continue;const r={...row,srv:row.updated_at};R[row.id]=r;await put('rec',r);ch++}
 if(data.length)await put('meta',{k:'since',v:data[data.length-1].updated_at});if(ch&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render();if(data.length>=1000)setTimeout(sync,500)
}catch(e){syncErr++;console.warn('sync',e)}busy=0}
function sync(){if(navigator.locks)navigator.locks.request('hr-sync',{ifAvailable:true},lock=>lock?doSync():null);else doSync()}
function forceRelogin(msg){S.user=null;localStorage.removeItem('hru');login(msg)}
function modal(...k){const o=h('div',{class:'ov',onclick:e=>e.target==o&&o.remove()},h('div',{class:'md'},...k));document.body.append(o);return()=>o.remove()}
function drawer(...k){const o=h('div',{class:'drawer-ov',onclick:e=>e.target==o&&o.remove()},h('div',{class:'drawer'},...k));document.body.append(o);return()=>o.remove()}
const ICONS={
 menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>',
 megaphone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 001 1h2l4 4V5L6 9H4a1 1 0 00-1 1z"/><path d="M14 8a4 4 0 010 8"/></svg>',
 calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
 leave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-6 4-10 8-11-1 5-4 8-8 9"/><path d="M12 21c0-6-4-10-8-11 1 5 4 8 8 9"/><line x1="12" y1="21" x2="12" y2="10"/></svg>',

};
const icon=(name,cls)=>{const s=h('span',{class:'ic'+(cls?' '+cls:'')});s.innerHTML=ICONS[name]||'';return s};

const isHR=()=>S.role=='owner'||S.role=='manager';
const myEmployee=()=>L('hr_employee').find(e=>e.authUserId==S.user.id);
const hrSettings=()=>({companyName:'',pf:12,esic:0.75,pt:200,tds:0,...(R.hr_settings&&R.hr_settings.data)});

function shiftFor(emp){return L('hr_shift').find(s=>s.id==emp.shiftId)}
function statusFor(att,emp){
 if(att.leaveType)return 'leave';
 if(!att.in)return 'absent';
 if(!att.out)return 'missing';
 const sh=shiftFor(emp);
 const mins=(new Date(att.out)-new Date(att.in))/60000;
 if(sh){
  const shiftMins=(()=>{const[sh1,sm1]=sh.start.split(':').map(Number),[sh2,sm2]=sh.end.split(':').map(Number);let a=sh1*60+sm1,b=sh2*60+sm2;if(sh.overnight||b<a)b+=1440;return b-a})();
  if(mins<shiftMins*0.55)return 'half';
  const inTime=new Date(att.in),sched=new Date(inTime);const[sh1,sm1]=sh.start.split(':').map(Number);sched.setHours(sh1,sm1,0,0);
  if(inTime-sched>15*60000)return 'late';
  if(mins>shiftMins+30)return 'present';
 }
 return 'present';
}
function overtimeHours(att,emp){const sh=shiftFor(emp);if(!sh||!att.in||!att.out)return 0;
 const shiftMins=(()=>{const[sh1,sm1]=sh.start.split(':').map(Number),[sh2,sm2]=sh.end.split(':').map(Number);let a=sh1*60+sm1,b=sh2*60+sm2;if(sh.overnight||b<a)b+=1440;return b-a})();

}

function advanceOutstanding(empId){return r2(L('hr_advance').filter(a=>a.empId==empId).reduce((s,a)=>s+a.amount,0)-L('hr_payslip').filter(p=>p.empId==empId).reduce((s,p)=>s+(p.advanceDeduction||0),0))}

function runPayroll(emp,ym){
 const[y,m]=ym.split('-').map(Number),mStart=new Date(y,m-1,1),mEnd=new Date(y,m,1),days=(mEnd-mStart)/86400000;
 const att=L('hr_attendance').filter(a=>a.empId==emp.id&&a.date>=ym+'-01'&&a.date<ym+'-32');
 let present=0,absent=0,half=0,leave=0,ot=0;
 for(let d=1;d<=days;d++){const ds=ym+'-'+String(d).padStart(2,'0'),row=att.find(a=>a.date==ds);
  if(!row){absent++;continue}
  const st=statusFor(row,emp);
  if(st=='half')half++;else if(st=='leave')leave++;else present++;
  ot+=overtimeHours(row,emp);
 }
 const ss=emp.salaryStructure||{},perDay=r2((ss.basic||0)/days);
 const paidDays=present+half*0.5+leave;
 const basicPaid=r2(perDay*paidDays),otPay=r2(ot*(ss.otRate||0));
 const gross=r2(basicPaid+(ss.hra||0)+(ss.allowances||0)+otPay);
 const rates=hrSettings();
 const pf=r2(gross*(rates.pf||0)/100),esic=r2(gross*(rates.esic||0)/100),pt=rates.pt||0,tds=r2(gross*(rates.tds||0)/100);
 const outstanding=advanceOutstanding(emp.id),advanceDeduction=Math.min(outstanding,gross);
 const net=r2(gross-pf-esic-pt-tds-advanceDeduction);
 return{present,absent,half,leave,ot,basicPaid,hra:ss.hra||0,allowances:ss.allowances||0,otPay,gross,pf,esic,pt,tds,advanceDeduction,net};
}
function printPayslip(p,emp){const w=window.open('','_blank');
 w.document.write(`<style>body{font-family:Inter,sans-serif;max-width:480px;margin:40px auto;color:#171717}h2{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,system-ui,sans-serif}table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:6px 0;border-bottom:1px solid #eee}td:last-child{text-align:right}.tot{font-weight:700;border-top:2px solid #171717}</style>
 <h2>${(hrSettings().companyName)||'AUZslab'} — Payslip</h2><p>${emp.name} · ${p.month}</p>
 <table>
 <tr><td>Present days</td><td>${p.present}</td></tr><tr><td>Half days</td><td>${p.half}</td></tr><tr><td>Absent</td><td>${p.absent}</td></tr><tr><td>Overtime hours</td><td>${p.ot}</td></tr>
 <tr><td>Basic (attendance-adjusted)</td><td>${inr(p.basicPaid)}</td></tr><tr><td>HRA</td><td>${inr(p.hra)}</td></tr><tr><td>Allowances</td><td>${inr(p.allowances)}</td></tr><tr><td>Overtime pay</td><td>${inr(p.otPay)}</td></tr>
 <tr><td><b>Gross</b></td><td><b>${inr(p.gross)}</b></td></tr>
 <tr><td>PF</td><td>-${inr(p.pf)}</td></tr><tr><td>ESIC</td><td>-${inr(p.esic)}</td></tr><tr><td>Professional tax</td><td>-${inr(p.pt)}</td></tr><tr><td>TDS</td><td>-${inr(p.tds)}</td></tr><tr><td>Advance deduction</td><td>-${inr(p.advanceDeduction)}</td></tr>
 <tr class=tot><td>Net salary</td><td>${inr(p.net)}</td></tr>
 </table><p style="font-size:11px;color:#8c8c8c;margin-top:20px">PF/ESIC/PT/TDS here use the rates set in Payroll → Settings — this is not filed government compliance software.</p>`);
 w.document.close();w.print()}

function login(msg){const e=h('input',{type:'email',placeholder:'Email'}),p=h('input',{type:'password',placeholder:'Password'}),m=h('div',{},msg||'');
 $('#app').replaceChildren(h('div',{class:'md'},h('h2',{},'Payroll sign in'),h('p',{class:'note'},'Same login as your AUZslab account.'),e,p,m,
  h('button',{class:'p',onclick:async()=>{const{error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});error?m.textContent=error.message:boot()}},'Sign in')))}
async function boot(){
 let c=JSON.parse(localStorage.hru||'null'),ses=null;try{ses=(await sb.auth.getSession()).data.session}catch{}
 const uid=ses?ses.user.id:(c&&c.id);
 if(uid){const meta=await get('meta','lastUser');if(meta&&meta.v&&meta.v!==uid){await clr('rec');await clr('out');await del('meta','since')}await put('meta',{k:'lastUser',v:uid})}
 (await all('rec')).forEach(r=>R[r.id]=r);
 if(ses){S.user=ses.user;try{const{data}=await sb.from('profiles').select('role').eq('id',ses.user.id).single();if(data)localStorage.hru=JSON.stringify(c={id:ses.user.id,role:data.role})}catch{}}else if(c)S.user={id:c.id};
 if(!S.user)return login();
 S.role=(c&&c.role)||'cashier';
 $('#app').textContent='Loading…';
 addEventListener('online',sync);
 sb.channel('hr').on('postgres_changes',{event:'*',schema:'public',table:'records'},()=>sync()).subscribe();setInterval(sync,30000);
 await new Promise(r=>{const check=async()=>{await doSync();r()};check()});
 render();
}
boot();
