<body>
<noscript><div style="padding:24px;text-align:center;font-family:sans-serif;background:#F3E6C8;color:#391D21">This site needs JavaScript to show the treatment menu. Please enable JavaScript, or contact us directly to see prices.</div></noscript>
<a class="skip" href="#main">Skip to content</a>

<header class="hdr" id="hdr">
  <div class="scroll-progress"><div class="scroll-progress-bar" id="scrollProgress"></div></div>
  <div class="wrap hdr-in">
    <a class="brand" href="/salon/" aria-label="Showoff Salon, home">
      <img src="/salon/assets/logo-plum.png" alt="" width="40" height="40">
      <span id="brandName"></span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navOverlay">
      <span>Menu</span>
      <span class="menu-btn-ico" id="menuBtnIco" aria-hidden="true"></span>
    </button>
  </div>
</header>

<div class="nav-overlay" id="navOverlay" aria-hidden="true">
  <button class="nav-overlay-close" id="navOverlayClose" aria-label="Close menu"></button>
  <div class="wrap nav-overlay-in">
    <nav class="nav-links" id="nav" aria-label="Main">
      <a href="/salon/#services">Services</a>
      <a href="/salon/menu/">Menu</a>
      <a href="/salon/#gallery">Gallery</a>
      <a href="/salon/#stylists">Our hairstylists</a>
      <a href="/salon/#about">About us</a>
      <a href="/salon/#book">Book appointment</a>
    </nav>
    <div class="nav-overlay-foot">
      <div class="nav-overlay-contact">
        <p id="navAddress"></p>
        <a class="link" id="navEmail" href=""></a>
      </div>
      <div class="nav-overlay-meta">
        <span id="navCopyright"></span>
        <a id="navInsta" href="" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
</div>

<main id="main">
  <!-- Treatment menu -->
  <section class="sec sec-tint" id="menu">
    <div class="wrap">
      <div class="sec-head">
        <h1>Treatment menu</h1>
        <p id="menuText"></p>
      </div>
      <div class="menu-bar">
        <div class="seg" role="group" aria-label="Show menu for">
          <button data-g="all" aria-pressed="true">Everything</button>
          <button data-g="female" aria-pressed="false">Women</button>
          <button data-g="male" aria-pressed="false">Men</button>
        </div>
        <div class="menu-nav">
          <span class="count" id="menuCount" aria-live="polite"></span>
          <button class="sq" id="prevSlide" aria-label="Previous menu page"></button>
          <button class="sq" id="nextSlide" aria-label="Next menu page"></button>
        </div>
      </div>
      <div class="tabs" id="menuTabs" role="tablist" aria-label="Menu pages"></div>
      <div class="slider" id="slider" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Treatment menu"></div>
      <p class="legend"><span id="legendStar"></span> Most popular</p>
    </div>
  </section>

  <!-- Book CTA -->
  <section class="sec menu-book-cta">
    <div class="wrap">
      <p class="lead">Ready when you are.</p>
      <a class="btn" href="/salon/#book">Book appointment</a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-grid">
    <div>
      <img src="/salon/assets/logo-cream.png" alt="Showoff Salon" width="72" height="72">
    </div>
    <div id="footContact"></div>
    <div id="footHours"></div>
    <div class="foot-end"><a href="/salon/admin/">Staff login</a></div>
  </div>
</footer>

<script src="/salon/assets/dom.js"></script>
<script src="/salon/assets/feedback.js"></script>
<script src="/salon/assets/menu-page.js"></script>
</body>
</html>
