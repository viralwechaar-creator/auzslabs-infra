   return h('label',{},label,inp,prev);
  }
  const el=h('input',{type:type=='number'?'number':'text',value:b.props[key]||''});inputs[key]=()=>type=='number'?+el.value:el.value;return h('label',{},label,el);
 });
 const close=modal(
  h('h3',{},'Edit '+def.label),
  ...fieldEls,
  h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:8px'},
   h('button',{class:'warn',onclick:()=>{page.blocks.splice(idx,1);save('sitepage',page,page.slug);close()}},'Delete block'),
   h('button',{class:'p',onclick:()=>{for(const k in inputs)b.props[k]=inputs[k]();save('sitepage',page,page.slug);close()}},'Save')
  )
 );
}
async function uploadImage(file,prefix){
 const blob=await compressImage(file,1600,.8);
 const path=prefix+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
 const{error}=await sb.storage.from('site').upload(path,blob,{contentType:'image/jpeg'});
 if(error)throw error;
 return sb.storage.from('site').getPublicUrl(path).data.publicUrl;
}
function compressImage(file,maxW,quality){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,maxW/img.width),w=Math.round(img.width*scale),ht=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=ht;c.getContext('2d').drawImage(img,0,0,w,ht);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('Could not process that image'))},'image/jpeg',quality)};img.onerror=()=>rej(new Error('Could not read that image'));img.src=url})}

function reorder(page,from,to){if(from===to)return;const [b]=page.blocks.splice(from,1);page.blocks.splice(to,0,b);save('sitepage',page,page.slug)}

function blockCard(page,b,idx){
 const def=BLOCK_DEFS[b.type]||{label:b.type,preview:()=>''};
 const card=h('div',{class:'block-card',draggable:'true',
  ondragstart:e=>{S.drag=idx;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'},
  ondragend:()=>{card.classList.remove('dragging');S.drag=null},
  ondragover:e=>{e.preventDefault()},
  ondrop:e=>{e.preventDefault();if(S.drag!=null)reorder(page,S.drag,idx)},
  onclick:()=>editBlock(page,idx)
 },
  h('span',{class:'drag-handle'},'⠿'),
  h('div',{class:'block-body'},h('div',{class:'block-type'},def.label),h('div',{class:'block-preview'},def.preview(b.props||{})||'—')),
  h('div',{class:'block-actions'},h('button',{onclick:e=>{e.stopPropagation();editBlock(page,idx)}},'Edit'),h('button',{class:'warn',onclick:e=>{e.stopPropagation();if(!confirm('Delete this block?'))return;page.blocks.splice(idx,1);save('sitepage',page,page.slug)}},'✕'))
 );
 return card;
}

async function publish(page){
 page.publishedBlocks=JSON.parse(JSON.stringify(page.blocks));
 page.publishedAt=now();
 const r=await save('sitepage',page,page.slug);
 // save() queues this for sync() in the background (fire-and-forget,
 // see doSync()'s own comment) -- Preview opens a brand new tab that
 // reads the page straight from the server via public_page(), so
 // without an explicit, awaited push here, a quick tap on Preview
 // right after Publish can land before the server actually has the
 // new publishedBlocks, showing "not published yet" even though it
 // clearly just was. force:true because this IS the latest state --
 // no conflict check needed, it should just win.
 try{
  const{data:res,error}=await sb.rpc('push_record',{rid:r.id,rkind:r.kind,rdata:r.data,rdeleted:r.deleted,base:null,force:true});
  if(!error&&res){r.srv=res.server_updated_at;await put('rec',r);await del('out',r.id)}
 }catch(e){console.warn('publish sync',e)}
 alert('Published. Live at '+liveUrl(page));
}

// visitors only ever see /w.html?page=<slug> (see w.html + the
// public_page RPC) -- your subdomain's own root is the staff POS app,
// not this site, so that URL is the one thing worth making impossible
// to miss on this screen.
function liveUrl(page){return location.origin+'/w.html?page='+page.slug}

function editorView(){
 const page=R[S.curSlug]&&R[S.curSlug].data;
 if(!page)return h('div',{class:'g'},h('p',{},'Pick a page from the menu, or create a new one.'));
 const url=liveUrl(page);
 return h('div',{class:'g'},
  h('div',{class:'card'},h('b',{},page.title),h('div',{class:'note'},'/'+page.slug)),
  h('div',{class:'card',style:'display:flex;align-items:center;gap:10px'},
   h('div',{style:'flex:1;min-width:0'},
    h('div',{class:'note'},'Your live site'),
    h('div',{style:'font-family:\'Space Mono\',monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},url)
   ),
   h('button',{onclick:async()=>{try{await navigator.clipboard.writeText(url);alert('Link copied')}catch{alert(url)}}},'Copy')
  ),
  h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
   h('button',{class:'p',onclick:()=>addBlock(page)},'+ Add block'),
   h('button',{onclick:()=>window.open(url,'_blank')},'Preview'),
   h('button',{class:'on',onclick:()=>publish(page)},page.publishedBlocks?'Publish changes':'Publish')
  ),
  page.publishedAt?h('div',{class:'note'},'Last published '+new Date(page.publishedAt).toLocaleString()):h('div',{class:'note'},'Not published yet — visitors won’t see this page until you publish.'),
  h('div',{style:'display:grid;gap:8px'},...(page.blocks.length?page.blocks.map((b,i)=>blockCard(page,b,i)):[h('p',{class:'note'},'No blocks yet. Add one to start building this page.')]))
 );
}

function drawer(){
 const pages=L('sitepage').sort((a,b)=>(a.title||'').localeCompare(b.title||''));
 return h('div',{class:'g',style:'padding-top:14px'},
  ...pages.map(p=>h('button',{class:'page-btn'+(S.curSlug==p.slug?' on':''),style:'width:100%;text-align:left;display:flex;justify-content:space-between;margin-bottom:4px',onclick:()=>{S.curSlug=p.slug;render()}},h('span',{},p.title),p.publishedAt?h('span',{class:'pill'},'live'):h('span',{class:'pill'},'draft'))),
  h('button',{class:'p',onclick:newPage},'+ New page')
 );
}

function render(){
 if(!S.user)return;
 $('#app').replaceChildren(
  h('div',{class:'top-bar'},h('h1',{},'Website Builder'),S.user?h('button',{class:'btn',style:'margin-left:auto',onclick:()=>auzPlan.open(sb)},'Plan'):null,S.user?h('button',{class:'btn',onclick:()=>auzHelp.open(sb)},'Help'):null,S.user?h('button',{class:'btn',onclick:()=>auzMyData(sb)},'My data'):null),
  h('div',{class:'g',style:'padding-top:0'},h('div',{class:'card'},drawer())),
  editorView(),
  h('div',{class:'powered'},'Powered by ',h('a',{href:'https://auzslab.in',target:'_blank',rel:'noopener'},'AUZslab'))
 );
}

function login(msg){
 const e=h('input',{type:'email',placeholder:'Email'}),p=h('input',{type:'password',placeholder:'Password'}),m=h('div',{class:'note'},msg||'');
 $('#app').replaceChildren(h('div',{class:'md',style:'margin:12vh auto'},h('h2',{},'Sign in'),e,p,m,h('button',{class:'p',onclick:async()=>{let r=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});r=await auz2fa.resolve(sb,r);r.error?m.textContent=r.error.message:boot()}},'Sign in')));
}

function notEntitled(){
 $('#app').replaceChildren(h('div',{class:'upgrade-card card'},h('h2',{},'Website Builder isn’t on your plan yet'),h('p',{class:'note',style:'margin-top:10px'},'Ask AUZslab to add it to your subscription, then come back here.'),h('button',{class:'p',style:'margin-top:14px',onclick:()=>location.href='https://auzslab.in/products.html'},'See products')));
}

async function boot(){
 let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch{}
 if(!ses)return login();
 S.user=ses.user;
 let features={},dash=null;
 try{const r=await sb.rpc('my_dashboard');dash=r.data;if(dash)features=dash.features||{}}catch{}
 // see index.html's boot() for why: login is global, not scoped to a
 // subdomain, so this account could belong to a different business
 // than the one this URL says.
 if(dash&&window.TENANT_SLUG&&dash.tenant&&dash.tenant.slug!==window.TENANT_SLUG){
  await sb.auth.signOut();S.user=null;
  return login('This login belongs to a different business ('+dash.tenant.slug+'.auzslab.in) — please sign in at your own business’s link instead.');
 }
 if(!(features.website_builder===true)){S.user=null;return notEntitled()}
 (await all('rec')).forEach(r=>R[r.id]=r);
 await doSync();
 if(!S.curSlug){const pages=L('sitepage');if(pages.length)S.curSlug=pages.sort((a,b)=>(a.title||'').localeCompare(b.title||''))[0].slug}
 render();
 setInterval(sync,15000);
 window.addEventListener('online',sync);
}
if(navigator.standalone===false&&!sessionStorage.getItem('auz_standalone_hint_dismissed')){
 const bar=document.createElement('div');
 bar.style.cssText='background:#171717;color:#fff;font-size:12.5px;padding:10px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between';
 bar.innerHTML='<span>You\'re viewing this in Safari, not your saved app icon — for the full-screen app, open it from the icon on your Home Screen instead.</span>';
 const x=document.createElement('button');
 x.textContent='×';x.setAttribute('aria-label','Dismiss');
 x.style.cssText='background:none;border:none;color:#fff;font-size:20px;line-height:1;flex-shrink:0;cursor:pointer;padding:0 4px';
 x.onclick=()=>{bar.remove();try{sessionStorage.setItem('auz_standalone_hint_dismissed','1')}catch{}};
 bar.appendChild(x);document.body.prepend(bar);
}
boot();
</script>
