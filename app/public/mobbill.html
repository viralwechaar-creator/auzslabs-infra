<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Receipt</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/icon-mob.svg">
<style>
:root{--bg:#f5f4f2;--muted:#6b7280}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161618;--muted:#9aa1ab}}
:root[data-theme="dark"]{--bg:#161618;--muted:#9aa1ab}
body{margin:0;padding:16px;background:var(--bg);display:grid;justify-items:center;font-family:Arial,Helvetica,sans-serif;min-height:100vh;box-sizing:border-box}
.bar{display:flex;gap:10px;margin-top:16px}
.bar button{background:#111;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px Arial,sans-serif;cursor:pointer}
.msg{color:var(--muted);text-align:center;max-width:320px;font-size:14px}
.skel{width:360px;max-width:100%;height:420px;border-radius:14px;background:linear-gradient(90deg,#e8e8e8,#f2f2f2,#e8e8e8);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media print{body{padding:0;background:#fff}.bar{display:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="skel"></div></main>
<script src="/config.js"></script>
<script src="/mob/receipt-templates.js?v=1"></script>
<script src="/mob/receiptpage.js?v=2"></script>
</body>
</html>
