<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>body{margin:0;font:15px Inter,system-ui,sans-serif;background:#dedede;color:#4d4d4d;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body>
<div>Loading…</div>
<script src="/sb-client.js?v=4"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script src="/tenant.js?v=2"></script>
<script>
/*
 The Caddyfile's root fallback (a request to a path that isn't a real
 static file -- in practice, almost always the bare subdomain root,
 e.g. https://showoffsalon.auzslab.in/) lands here instead of going
 straight to index.html (the staff POS) the way it used to. This
 file's only job is picking the right front door for THIS tenant's
 niche and redirecting to it -- a request for a real file (index.html,
 booking.html, backoffice.html, ...) never reaches this page at all,
 since Caddy serves those directly. New niche with its own
 customer-facing page later -> just add its bizType here, nothing
 else (this file, not the Caddyfile) is the one place that mapping lives.
*/
const LANDING = { salon: '/salon/', custom: '/custom.html' };
(async () => {
 // Shared addresses are decided from the address itself (not from tenant.js, which a browser may still have cached):
 // app.auzslab.in = every app; auzspos / auzsmob / auzspay / auzsledger open their own app (the sign-in screen finds the user's business).
 const HOME = { app: '/start.html', auzspos: '/index.html', auzsmob: '/mob.html', auzspay: '/payroll.html', auzsledger: '/accounts.html' };
 const first = location.hostname.split('.')[0];
 if (HOME[first]) return location.replace(HOME[first]);
 if (!TENANT_SLUG) return location.replace('/index.html');
 const sb = supabase.createClient(CFG.url, CFG.key);
 let bizType = 'restaurant';
 try {
  const { data } = await sb.rpc('public_menu', { tenant_slug: TENANT_SLUG });
  bizType = (data && data.cfg && data.cfg.bizType) || bizType;
 } catch (e) { /* unknown tenant, or offline -- fall through to the POS/login default below */ }
 location.replace((LANDING[bizType] || '/index.html') + location.search);
})();
</script>
</body></html>
