<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>body{margin:0;font:15px Inter,system-ui,sans-serif;background:#dedede;color:#4d4d4d;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body>
<div>Loading…</div>
<script src="/sb-client.js?v=11"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script src="/tenant.js?v=4"></script>
<script>
/*
 The Caddyfile's root fallback (a request to a path that isn't a real
 static file -- in practice, almost always the bare subdomain root,
 e.g. https://showoffsalon.auzslab.in/) lands here instead of going
 straight to index.html (the staff POS) the way it used to. This
 file's only job is picking the right front door for THIS tenant's
 niche and redirecting to it -- a request for a real file (index.html,
 booking.html, backoffice.html, ...) never reaches this page at all,
 since Caddy serves those directly. New niche with its own
 customer-facing page later -> just add its bizType here, nothing
 else (this file, not the Caddyfile) is the one place that mapping lives.
*/
const LANDING = { salon: '/salon/', custom: '/custom.html' };
(async () => {
 // Shared addresses are decided from the address itself (not from tenant.js, which a browser may still have cached):
 // app.auzslab.in = every app; auzspos / auzsmob / auzspay / auzsledger open their own app (the sign-in screen finds the user's business).
 // auzspos/auzspay/auzsscan/auzsfinance were retired (their apps were deleted) -- removed from
 // this map rather than left pointing at files that no longer exist.
 const HOME = { auzsmob: '/mob.html', auzsledger: '/accounts.html', auzsstyle: '/style.html' };
 const first = location.hostname.split('.')[0];
 // app.auzslab.in (the old hub) never actually reaches this file -- the Caddyfile's own @a_hub block
 // redirects it before land.html would ever be served -- but if it ever did, send it to the real
 // sign-in page rather than the start.html hub this file used to open, which no longer exists.
 if (first === 'app') return location.replace('https://' + location.hostname.split('.').slice(-2).join('.') + '/signup.html');
 if (HOME[first]) return location.replace(HOME[first] + location.search);
 // Stopgap: AUZsPOS (the old default front door for a restaurant/cafe/retail/general tenant with
 // no other niche-specific landing page) was retired and nothing replaces it yet -- that tenant
 // has no product left to open here. Until the owner decides what these tenants should land on,
 // send them to sign-in rather than a 404.
 const FALLBACK = 'https://' + location.hostname.split('.').slice(-2).join('.') + '/signup.html';
 if (!TENANT_SLUG) return location.replace(FALLBACK);
 const sb = supabase.createClient(CFG.url, CFG.key);
 let bizType = 'restaurant';
 try {
  const { data } = await sb.rpc('public_menu', { tenant_slug: TENANT_SLUG });
  bizType = (data && data.cfg && data.cfg.bizType) || bizType;
 } catch (e) { /* unknown tenant, or offline -- fall through to the default below */ }
 location.replace((LANDING[bizType] || FALLBACK) + (LANDING[bizType] ? location.search : ''));
})();
</script>
</body></html>
