<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel=stylesheet>
<style>
:root{--paper:#f5f2ea;--ink:#161513;--line:rgba(22,21,19,.14);--mute:#6b675e}
*{box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color:var(--ink);margin:0;background:var(--paper);-webkit-font-smoothing:antialiased}
.bar{display:flex;justify-content:flex-end;padding:22px 24px 0;max-width:640px;margin:0 auto}
.bar button{font:13px/1 Inter,sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:11px 18px;border-radius:2px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.bar button:hover{background:var(--ink);color:var(--paper)}
.wrap{max-width:640px;margin:0 auto;padding:18px 24px 70px;position:relative}
.hd{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:26px}
.mark{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mark img{max-height:40px;display:block}
.meta-r{text-align:right;font-size:13px;color:var(--mute);line-height:1.6}
.meta-r b{color:var(--ink);font-weight:600}
hr{border:none;border-top:1px solid var(--line);margin:0}
.billto{padding:22px 0;font-size:14px;line-height:1.7}
.billto b{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
table{width:100%;border-collapse:collapse;margin:0}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:16px 0 10px}
td{padding:13px 0;font-size:14px;border-top:1px solid var(--line)}
th.c,td.c{text-align:center}th.r,td.r{text-align:right}
.tot{display:flex;justify-content:flex-end;padding:22px 0 0}
.tot table{width:auto;min-width:240px}
.tot td{border-top:none;padding:5px 0;font-size:14px}
.tot td:first-child{color:var(--mute);padding-right:32px}
.tot td:last-child{text-align:right}
.tot .big td{border-top:1px solid var(--ink);padding-top:12px;margin-top:6px;font-size:19px;font-weight:700}
.thanks{font-size:16px;font-weight:500;padding:34px 0 0}
.ft{display:flex;justify-content:space-between;gap:20px;padding:28px 0 0;font-size:13px;line-height:1.7}
.ft b{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sig{text-align:right}.sig b:first-child{font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:2px}
.dup{display:inline-block;border:1px solid var(--ink);padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:22px}
.powered{text-align:center;padding-top:36px;font-size:11px;color:var(--mute)}
.powered a{color:var(--mute)}
.err{padding:80px 20px;text-align:center;font-size:15px;color:var(--mute)}
.fb{margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
.fb h4{font-size:15px;font-weight:700;margin:0 0 12px}
.stars{display:flex;gap:8px}
.stars button{font-size:34px;line-height:1;background:none;border:none;padding:4px;cursor:pointer;color:#d8d4c8;min-width:44px;min-height:44px}
.stars button.on{color:#e0a72a}
.fb textarea{width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:6px;font:14px Inter,sans-serif;min-height:70px;box-sizing:border-box}
.fb .submit{margin-top:12px;width:100%;padding:15px;font:14px/1 Inter,sans-serif;font-weight:700;background:var(--ink);color:var(--paper);border:none;border-radius:4px;cursor:pointer}
.fb .submit:disabled{opacity:.5}
.fb .thanks-msg{font-size:14px;color:var(--mute)}
@media print{.bar{display:none}.fb{display:none}body{background:#fff}}
</style></head><body>
<div class=bar><button onclick="print()">Print / Download</button></div>
<div class=wrap id=a>Loading…</div>
<script src=/sb-client.js?v=4></script><script src=/config.js></script><script>
const sb=supabase.createClient(CFG.url,CFG.key),A=document.getElementById('a'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),r2=n=>Math.round(n*100)/100,inr=n=>'₹'+r2(n).toLocaleString('en-IN');
const id=new URLSearchParams(location.search).get('o');
(async()=>{
 if(!id)return A.innerHTML='<div class=err>Invoice not found.</div>';
 const{data,error}=await sb.rpc('public_invoice',{oid:id});
 if(error||!data||!data.order)return A.innerHTML='<div class=err>Invoice not found.</div>';
 const o=data.order,s=data.cfg||{},t=o.t,b=s.brand||null,logo=s.logo||'/logo.png';
 // A tenant's own brand (colours/font/doodle, the same settings.brand
 // object booking.html reads) re-themes this same invoice markup instead
 // of a second, separately-maintained invoice template -- one structure,
 // per-tenant CSS variables. Gated on `brand` specifically (not the
 // pre-existing, widely-set `col`) so every tenant who already had a
 // brand colour configured for their site's accent doesn't suddenly get
 // a different-looking invoice they never asked for -- only a tenant who
 // opts into the new extended palette sees this.
 if(b){
  const root=document.documentElement.style;
  if(b.plum||s.col)root.setProperty('--ink',b.plum||s.col);
  if(b.tint)root.setProperty('--paper',b.tint);
  if(b.muted)root.setProperty('--mute',b.muted);
  if(b.line)root.setProperty('--line',b.line);
  if(b.fontUrl){const l=document.createElement('link');l.rel='stylesheet';l.href=b.fontUrl;document.head.appendChild(l)}
  if(b.font)document.body.style.fontFamily='"'+b.font+'",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif';
 }
 const rows=o.lines.map(l=>`<tr><td>${esc(l.name)}${l.size?' ('+esc(l.size)+')':''}${l.note?'<br><small style="color:var(--mute)">'+esc(l.note)+'</small>':''}</td><td class=c>${l.qty}</td><td class=r>${inr(l.price)}</td><td class=r>${inr(l.price*l.qty)}</td></tr>`).join('');
 const taxRows=(t.rates&&Object.keys(t.rates).some(r=>+r>0&&t.rates[r].tax>0)?Object.entries(t.rates).filter(([r,x])=>+r>0&&x.tax>0).flatMap(([r,x])=>[['CGST '+(+r/2)+'%',x.tax/2],['SGST '+(+r/2)+'%',x.tax/2]]):[['CGST',t.tax/2],['SGST',t.tax/2]]);
 const feedbackHtml=`<div class=fb id=fb><h4>How was your experience at ${esc(s.name)}?</h4>
<div class=stars id=stars>${[1,2,3,4,5].map(n=>`<button type=button data-v=${n}>★</button>`).join('')}</div>
<textarea id=fbComment placeholder="Anything you'd like to tell us? (optional)" maxlength=1000></textarea>
<button class=submit id=fbSubmit disabled>Submit feedback</button>
</div>`;
 // A fully bespoke, one-off invoice page exists for a specific tenant
 // (app/public/chapterone/invoice.html, the "postage-stamp" design) but
 // that page is only ever reached from that tenant's own bespoke
 // website -- a real bill shared from the POS over WhatsApp always goes
 // through THIS one shared page, regardless of tenant, so it never
 // showed that design. public_invoice() now also returns the tenant's
 // own slug (db/124) so this one page can render a bespoke layout for
 // one specific tenant without a second, separately-maintained invoice
 // template or a new settings field -- every other tenant's generic/
 // brand-driven render below is completely unchanged.
 if(data.slug==='chapterone'){
  document.getElementById('coFont')||document.head.insertAdjacentHTML('beforeend','<link id=coFont rel=stylesheet href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap">');
  document.head.insertAdjacentHTML('beforeend',`<style>
  body{background:#faedcd}
  .wrap{max-width:420px;padding:40px 16px}
  .co-r{background:#ffffff;box-shadow:0 2px 4px rgba(42,41,24,.08),0 24px 48px -18px rgba(42,41,24,.3);position:relative;padding:40px 30px 34px;font-family:"DM Sans",Arial,sans-serif;color:#3c423c}
  .co-r::before{content:"";position:absolute;top:-10px;left:0;right:0;height:20px;background:radial-gradient(circle at 10px 10px,transparent 10px,#faedcd 10.5px) 0 -10px/20px 20px repeat-x}
  .co-stamp{text-align:center;margin-bottom:22px}
  .co-stamp img{height:46px;margin-bottom:10px}
  .co-stamp b{display:block;font:500 13px/1 "DM Sans",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#e59898}
  .co-meta{display:flex;justify-content:space-between;margin:24px 0 18px;font-size:12px}
  .co-meta div b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a8f89;margin-bottom:3px;font-weight:600}
  .co-block{margin-bottom:16px;font-size:13.5px}
  .co-block b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a8f89;margin-bottom:3px}
  .co-r table{width:100%;border-collapse:collapse;margin-top:18px}
  .co-r th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a8f89;border-bottom:1px solid rgba(42,41,24,.18);padding-bottom:8px;font-weight:600}
  .co-r th:last-child,.co-r td:last-child{text-align:right}
  .co-r td{padding:9px 0;border-bottom:1px solid rgba(42,41,24,.18);font-size:13.5px}
  .co-totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
  .co-totals .grand{border-top:1px solid #798478;margin-top:6px;padding-top:12px;font:600 17px "Fraunces",Georgia,serif}
  .co-thanks{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-end}
  .co-invno{font-size:11px;color:#8a8f89;line-height:1.8}
  .co-seal{width:76px;height:76px;border:1.4px dashed #e59898;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#e59898;font:600 9.5px/1.3 "DM Sans",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-8deg);flex-shrink:0}
  .co-r .fb{margin-top:34px;padding-top:28px;border-top:1px solid rgba(42,41,24,.18)}
  .co-r .fb h4{font-size:15px;font-weight:700;margin:0 0 12px;font-family:"DM Sans",Arial,sans-serif}
  .co-r .submit{background:#798478;color:#ffffff}
  @media print{.co-r{box-shadow:none}}
  </style>`);
  A.innerHTML=`<div class=co-r>
  <div class=co-stamp><img src="/chapterone/logo-full.png" alt="Chapter One"><b>Invoice</b></div>
  <div class=co-meta><div><b>Billed to</b>${esc((o.cust||{}).name)||'Guest'}<br>${esc((o.cust||{}).phone)}</div><div style="text-align:right"><b>Invoice No.</b>${esc(o.no)}<br>${new Date(o.paidAt||o.created).toLocaleDateString()}</div></div>
  <table><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>
  <div class=co-totals>
  <div><span>Subtotal</span><span>${inr(t.sub)}</span></div>
  ${t.d?`<div><span>Discount</span><span>-${inr(t.d)}</span></div>`:''}
  ${t.svc?`<div><span>Service charge</span><span>${inr(t.svc)}</span></div>`:''}${t.pack?`<div><span>Packing</span><span>${inr(t.pack)}</span></div>`:''}${t.deliv?`<div><span>Delivery</span><span>${inr(t.deliv)}</span></div>`:''}
  ${taxRows.map(([a,v])=>`<div><span>${a}</span><span>${inr(v)}</span></div>`).join('')}
  ${t.round?`<div><span>Round off</span><span>${t.round>=0?'+':'-'}${inr(Math.abs(t.round))}</span></div>`:''}
  <div class=grand><span>Total</span><span>${inr(t.total)}</span></div>
  ${(o.refunds||[]).length?`<div><span>Refunded</span><span>-${inr(o.refunds.reduce((a,r)=>a+(+r.amt||0),0))}</span></div>`:''}
  </div>
  <div class=co-thanks><div class=co-invno>PAID VIA<br>${(o.pays||[]).map(p=>({cash:'Cash',upi:'UPI',card:'Card',giftcard:'Gift card',other:'Other'}[p.m]||p.m.toUpperCase())+' — '+inr(p.amt)).join('<br>')||'—'}</div><div class=co-seal>Thank<br>You</div></div>
  ${feedbackHtml}
  </div>`;
  wireFeedback();
  return;
 }
 A.innerHTML=`<div class=hd><div class=mark>${(s.logo||b)?'<img src="'+esc(logo)+'">':'Invoice'}</div><div class=meta-r><b>Invoice No.</b> ${esc(o.no)}<br>${new Date(o.paidAt||o.created).toLocaleDateString()}</div></div>
 ${b&&b.doodle?'<img src="'+esc(b.doodle)+'" style="position:absolute;right:18px;bottom:120px;width:90px;opacity:.5;pointer-events:none">':''}
<hr>
<div class=billto><b>Billed to</b>${esc((o.cust||{}).name)}<br>${esc((o.cust||{}).phone)}${(o.cust||{}).gst?'<br>GSTIN '+esc(o.cust.gst):''}</div>
<hr>
<table><thead><tr><th>Item</th><th class=c>Qty</th><th class=r>Unit price</th><th class=r>Amount</th></tr></thead><tbody>${rows}</tbody></table>
<div class=tot><table>
<tr><td>Subtotal</td><td>${inr(t.sub)}</td></tr>
${t.d?`<tr><td>Discount</td><td>-${inr(t.d)}</td></tr>`:''}
${t.svc?`<tr><td>Service charge</td><td>${inr(t.svc)}</td></tr>`:''}${t.pack?`<tr><td>Packing</td><td>${inr(t.pack)}</td></tr>`:''}${t.deliv?`<tr><td>Delivery</td><td>${inr(t.deliv)}</td></tr>`:''}
${taxRows.map(([a,v])=>`<tr><td>${a}</td><td>${inr(v)}</td></tr>`).join('')}
${t.round?`<tr><td>Round off</td><td>${t.round>=0?'+':'-'}${inr(Math.abs(t.round))}</td></tr>`:''}
<tr class=big><td>Total</td><td>${inr(t.total)}</td></tr>
${(o.refunds||[]).length?`<tr><td>Refunded</td><td>-${inr(o.refunds.reduce((a,r)=>a+(+r.amt||0),0))}</td></tr>`:''}
</table></div>
<p class=thanks>${esc(s.ftr||'Thank you!')}</p>
<hr style="margin-top:24px">
<div class=ft><div><b>Paid via</b>${(o.pays||[]).map(p=>({cash:'Cash',upi:'UPI',card:'Card',giftcard:'Gift card',other:'Other'}[p.m]||p.m.toUpperCase())+' — '+inr(p.amt)).join('<br>')||'—'}</div><div class=sig><b>${esc(s.name)}</b><br>${esc(s.addr)}${s.gstin?'<br>GSTIN '+esc(s.gstin):''}</div></div>
${feedbackHtml}
<div class=powered>Powered by <a href="https://auzslab.in" target=_blank rel=noopener>AUZslab</a></div>`;
 if(s.logo){const im=A.querySelector('.mark img');if(im)im.onerror=()=>im.replaceWith(document.createTextNode('Invoice'))}
 wireFeedback();
 function wireFeedback(){
 let rating=0;const starsEl=document.getElementById('stars'),submitBtn=document.getElementById('fbSubmit');
 starsEl.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
  rating=+btn.dataset.v;submitBtn.disabled=false;
  starsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=rating));
 });
 const fbErr=document.createElement('p');fbErr.style.cssText='color:#b23;font-size:13px;margin:8px 0 0';document.getElementById('fb').appendChild(fbErr);
 submitBtn.onclick=async()=>{
  if(!rating)return;submitBtn.disabled=true;submitBtn.textContent='Submitting…';fbErr.textContent='';
  const{error}=await sb.rpc('submit_feedback',{oid:id,rating,comment:document.getElementById('fbComment').value.trim()});
  if(error){fbErr.textContent='Could not submit right now — please try again.';submitBtn.disabled=false;submitBtn.textContent='Submit feedback'}
  else document.getElementById('fb').innerHTML='<p class=thanks-msg>Thank you for your feedback!</p>';
 };
 }
})();
</script></body></html>
