<!doctype html>
<html lang="en">
<head>
<script src="/ds/launch-hub.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AUZslab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest-start.json">
<link rel="icon" type="image/png" href="/icon-hub-180.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-hub-180.png?v=2">
<link rel="stylesheet" href="/ds/auz.css?v=5">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg,#f5f4f2);color:var(--label,#171717);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
/* The backdrop: a big centred mark behind the sheet (its own page, per the reference -- not a tucked-away
   top-left brand row). Stays visible in the space above whatever height the sheet below is using. */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;min-height:0}
/* The exact retro pixel wordmark (same art as the launch animation), not a system-font
   substitute -- shown large as the backdrop's own "logo text". Inverted in dark mode since
   the source art is black-on-transparent. */
.stage img{width:min(78vw,360px);height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stage img{filter:invert(1)}}
:root[data-theme=dark] .stage img{filter:invert(1)}
/* The sheet: fixed to the screen's own bottom edge, rises on every screen change (set() in start.js
   re-triggers .up each time) -- the "popup from the footer" the owner asked for, not an inline card. */
.sheet-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.sheet{pointer-events:auto;width:100%;max-width:440px;max-height:82vh;overflow-y:auto;background:var(--card,#fff);border-radius:26px 26px 0 0;box-shadow:0 -16px 50px rgba(0,0,0,.16);padding:26px 24px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .42s cubic-bezier(.22,.9,.28,1)}
.sheet.up{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.greet{margin:0 0 6px;color:var(--label2,#6a625b);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.back{display:flex;align-items:center;gap:6px;margin:0 0 16px;padding:0;border:0;background:none;color:var(--label2,#6a625b);font:500 14px inherit;cursor:pointer}
.greet + h1{font-size:27px;margin-top:2px}
h1{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
p.sub{margin:0 0 20px;color:var(--label2,#6a625b);font-size:14px;line-height:1.5;font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--fill,#eceae6);border-radius:13px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:transparent;color:inherit;font:500 13.5px inherit;min-height:40px;border-radius:11px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--card,#fff);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.input{width:100%;min-height:46px;padding:0 15px;border:1px solid var(--sep,#d8d4cf);border-radius:13px;background:var(--card,#fff);color:inherit;font:14.5px inherit;transition:border-color .15s ease}
.input:focus{outline:none;border-color:var(--accent,#800020)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:13px;border:1px solid var(--sep,#d8d4cf);background:var(--fill,#eceae6);color:inherit;font:600 14.5px inherit;cursor:pointer;text-decoration:none;width:100%;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn.fill{background:var(--accent,#800020);border-color:transparent;color:#fff}
.grid{display:grid;gap:9px}
.sep{display:flex;align-items:center;gap:10px;color:var(--label2,#6a625b);font-size:12px;margin:5px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--sep,#ddd)}
.msg{min-height:18px;font-size:13px;color:#c2183f}
.tiles{display:grid;gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;border:1px solid var(--sep,#e4dfda);border-radius:16px;background:var(--card,#fff);color:inherit;text-decoration:none}
.tile b{font-size:15.5px;font-weight:600}.tile span{font-size:12.5px;color:var(--label2,#6a625b)}
.tile{position:relative;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile:after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-5px;border-top:2px solid var(--label2,#6a625b);border-right:2px solid var(--label2,#6a625b);transform:rotate(45deg);opacity:.45;transition:transform .2s ease,opacity .2s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--accent,#800020)}
.tile:hover:after{transform:translateX(4px) rotate(45deg);opacity:1}
.tile:active{transform:scale(.985)}
html.auz-wait .sheet{transition:none!important}
.links{display:flex;justify-content:space-between;margin:16px 4px 0;font-size:13px}
.links a,.links button{color:inherit;background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="stage"><img src="/logo.png" alt="AUZslab"></div>
<div class="sheet-wrap"><div class="sheet" id="sheet"><div id="box"><p class="sub">Loading…</p></div><div class="links" id="foot"></div></div></div>
<script src="/config.js"></script>
<script src="/sb-client.js?v=6"></script>
<script src="/ds/staffpin.js?v=1"></script>
<script src="/ds/gsignin.js?v=2"></script>
<script src="/ds/twofa.js?v=1"></script>
<script src="/ds/nativepush.js?v=5"></script>
<script src="/ds/appshell.js?v=4"></script>
<script src="/start.js?v=17"></script>
</body>
</html>
