<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin console</title>
<link rel="manifest" href="/manifest-backoffice.json">
<meta name="theme-color" content="#800020">
<!-- The old Back Office was merged into the admin console (/dashboard.html). This page only forwards old links,
     bookmarks and home-screen icons to the matching console page. -->
<script>
(function () {
  var MAP = { rep: 'rep/sales', staff: 'team/users', inv: 'inv/stock', crm: 'crm/customers', mem: 'crm/membership', help: 'crm/support',
    task: 'team/tasks', vendor: 'inv/purchase', menu: 'menu/items', set: 'mgmt/config' };
  var tab = '';
  try { tab = new URLSearchParams(location.search).get('tab') || ''; } catch (e) { /* ignore */ }
  location.replace('/dashboard.html' + (MAP[tab] ? '#' + MAP[tab] : ''));
})();
</script>
</head><body style="margin:0;font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;color:#555">
<noscript><a href="/dashboard.html">Open the admin console</a></noscript>
</body></html>
