<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/icon-accounts.svg">
<link rel="stylesheet" href="/accounts/accounts.css?v=1">
<style>
body{padding:16px;display:grid;justify-items:center}
.bill{width:min(820px,100%);background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:24px;display:grid;gap:14px;font-size:15px}
.bill h1{font-size:22px}.bill table{width:100%;border-collapse:collapse}.bill th,.bill td{padding:8px 6px;border-bottom:.5px solid var(--sep);text-align:left;font-size:14px}.bill .r{text-align:right}
.bill .row2{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bar{display:flex;gap:10px;margin-top:6px}
@media print{body{padding:0}.bill{box-shadow:none;padding:0}.bar{display:none}}
</style>
</head>
<body>
<main id="app" class="bill" aria-live="polite"><div class="skel" style="height:200px"></div></main>
<script src="/config.js"></script>
<script src="/accounts/bill.js?v=1"></script>
</body>
</html>
