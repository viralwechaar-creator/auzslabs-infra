<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUZslab SalesOS</title>
<link rel="icon" href="/icon-auzslab-192.png">
<link rel="manifest" href="/manifest-salesos.json">
<script src="/config.js"></script>
<script src="/sb-client.js?v=8"></script>
<style>
:root{--bg:#f5f4f2;--card:#fff;--ink:#171717;--muted:#6b6b6b;--accent:#800020;--sep:#e3e1dd;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:var(--radius);padding:28px;max-width:360px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card img{height:32px;margin-bottom:16px}
.card h1{font-size:20px;margin:0 0 4px}
.muted{color:var(--muted);font-size:13px}
.input{width:100%;padding:11px 12px;border:1px solid var(--sep);border-radius:10px;font-size:15px;margin-top:10px}
.btn{display:block;width:100%;min-height:44px;border-radius:10px;border:none;font-weight:600;font-size:15px;cursor:pointer;margin-top:12px}
.btn.fill{background:var(--accent);color:#fff}
.btn.plain{background:transparent;color:var(--accent)}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:14px 0}
.shell{min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--sep)}
.topbar b{font-size:15px}
main{flex:1;padding:18px;max-width:720px;margin:0 auto;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--muted);font-size:12px}
.notice{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.notice b{display:block;margin-bottom:4px}
.spin{width:24px;height:24px;border:3px solid var(--sep);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#b00020;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="spin"></div></div></div>
<script src="/ds/gsignin.js?v=1"></script>
<script>
'use strict';
var CFG = window.CFG || {};
var sb = window.supabase.createClient(CFG.url, CFG.key);
function h(tag, props) {
  var e = document.createElement(tag);
  var kids = [].slice.call(arguments, 2);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.indexOf('on') === 0 && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.forEach(function (c) { if (c != null && c !== false) e.appendChild(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }
var app = document.getElementById('app');

async function api(fn, args) {
  var r = await sb.rpc(fn, args || {});
  if (r.error) { var e = new Error(r.error.message || 'Something went wrong'); e.status = r.error.status; throw e; }
  return r.data;
}
async function token() { var s = (await sb.auth.getSession()).data.session; return s && s.access_token; }
async function uploadExpenseReceipt(expenseId, file) {
  var t = await token();
  var res = await fetch(CFG.url.replace(/\/$/, '') + '/storage/sos-expense-receipt/' + expenseId, { method: 'POST', body: file, headers: { Authorization: 'Bearer ' + t } });
  if (!res.ok) { var m = res.statusText; try { m = (await res.json()).error || m; } catch (e2) {} throw new Error(m); }
}

function showLogin(msg) {
  var email = h('input', { class: 'input', type: 'email', placeholder: 'Email', autocomplete: 'username' });
  var pass = h('input', { class: 'input', type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  var err = h('div', { class: 'err' }, msg || '');
  var signInBtn = h('button', { class: 'btn fill', type: 'button' }, 'Sign in');
  signInBtn.onclick = async function () {
    err.textContent = ''; signInBtn.disabled = true;
    var r = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    signInBtn.disabled = false;
    if (r.error) { err.textContent = r.error.message; return; }
    boot();
  };
  var googleHost = h('div');
  var card = h('div', { class: 'card' },
    h('img', { src: '/icon-auzslab-192.png', alt: '' }),
    h('h1', null, 'AUZslab SalesOS'),
    h('p', { class: 'muted' }, 'Sign in with the email you applied with.'),
    email, pass, err, signInBtn,
    h('div', { class: 'divider' }, 'or'),
    googleHost);
  clear(app).appendChild(h('div', { class: 'login' }, card));
  if (CFG.googleClientId) auzGoogleLink(googleHost, 'salesos');
}

function blocked(title, text) {
  var btn = h('button', { class: 'btn plain', type: 'button' }, 'Sign out');
  btn.onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); };
  clear(app).appendChild(h('div', { class: 'login' }, h('div', { class: 'card' },
    h('h1', null, title), h('p', { class: 'muted' }, text), btn)));
}

async function boot() {
  clear(app).appendChild(h('div', { class: 'login' }, h('div', { class: 'spin' })));
  var sess = await sb.auth.getSession();
  if (!sess.data.session) return showLogin();
  var dash;
  try { dash = await api('my_dashboard'); }
  catch (e) {
    if (e.status === 401) return showLogin('Your session ended. Please sign in again.');
    return blocked('Could not load', e.message);
  }
  if (!(dash.features || {}).salesos) {
    return blocked('Not a SalesOS account', 'This login is not part of the AUZslab SalesOS team. If you applied and were approved, make sure you are signing in with the same email.');
  }
  renderDashboard(dash);
}

var watchId = null;
function stopWatch() { if (watchId != null && navigator.geolocation) { navigator.geolocation.clearWatch(watchId); watchId = null; } }
function startWatch(sessionId, statusEl) {
  if (!navigator.geolocation) { statusEl.textContent = 'This device has no location support.'; return; }
  watchId = navigator.geolocation.watchPosition(function (pos) {
    api('sos_location_batch', { p_session: sessionId, p_points: [{ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, at: new Date().toISOString() }] })
      .then(function () { statusEl.textContent = 'Tracking · last update ' + new Date().toLocaleTimeString(); })
      .catch(function () { statusEl.textContent = 'Could not send your location. Will retry.'; });
  }, function (err) { statusEl.textContent = 'Location permission needed to track a field session: ' + err.message; },
  { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}

async function renderDashboard(dash) {
  var signOutBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;margin:0;padding:8px 14px' }, 'Sign out');
  signOutBtn.onclick = function () { stopWatch(); sb.auth.signOut().then(function () { location.reload(); }); };
  var topbar = h('div', { class: 'topbar' },
    h('b', null, 'AUZslab SalesOS'),
    h('div', null, h('span', { class: 'muted' }, dash.my_role + ' · ' + dash.my_email + ' '), signOutBtn));

  var fieldStatus = h('p', { class: 'muted' }, 'No open field session.');
  var fieldActions = h('div');
  var canField = dash.my_role === 'Sales Executive' || dash.my_role === 'owner';
  var fieldCard = h('div', { class: 'notice' }, h('b', null, 'Field session'), fieldStatus, fieldActions);

  async function paintField() {
    var cur;
    try { cur = await api('sos_field_session_current'); } catch (e) { fieldStatus.textContent = e.message; return; }
    clear(fieldActions);
    if (!cur) {
      fieldStatus.textContent = 'No open field session.';
      var startBtn = h('button', { class: 'btn fill', type: 'button', style: 'margin-top:10px' }, 'Start field session');
      startBtn.onclick = async function () {
        startBtn.disabled = true;
        try { var r = await api('sos_field_session_start'); startWatch(r.id, fieldStatus); await paintField(); }
        catch (e) { fieldStatus.textContent = e.message; startBtn.disabled = false; }
      };
      fieldActions.appendChild(startBtn);
      return;
    }
    fieldStatus.textContent = (cur.status === 'active' ? 'Tracking active' : 'Paused') + ' · since ' + new Date(cur.startedAt).toLocaleTimeString();
    if (cur.status === 'active') startWatch(cur.id, fieldStatus); else stopWatch();
    var pauseBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;margin:6px 8px 0 0;padding:8px 14px' }, cur.status === 'active' ? 'Pause' : 'Resume');
    var endBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;margin-top:6px;padding:8px 14px;color:#b00020' }, 'End session');
    pauseBtn.onclick = async function () { stopWatch(); await api('sos_field_session_set', { p_id: cur.id, p_status: cur.status === 'active' ? 'paused' : 'active' }); await paintField(); };
    endBtn.onclick = async function () { stopWatch(); await api('sos_field_session_set', { p_id: cur.id, p_status: 'ended' }); await paintField(); };
    fieldActions.appendChild(pauseBtn); fieldActions.appendChild(endBtn);
  }

  var visitsList = h('div');
  var visitError = h('p', { class: 'err' });
  async function paintVisits() {
    var rows;
    try { rows = await api('sos_my_visits'); } catch (e) { visitError.textContent = e.message; return; }
    clear(visitsList);
    if (!rows.length) { visitsList.appendChild(h('p', { class: 'muted' }, 'No visits yet.')); return; }
    rows.forEach(function (v) {
      var row = h('div', { style: 'padding:8px 0;border-top:1px solid var(--sep)' },
        h('b', null, v.businessName), h('span', { class: 'muted' }, '  · ' + v.status + (v.outcome ? ' · ' + v.outcome : '')));
      if (v.status === 'checked_in') {
        var outcomeSel = h('select', { class: 'input', style: 'margin-top:6px' },
          h('option', { value: '' }, 'Outcome…'), h('option', { value: 'interested' }, 'Interested'),
          h('option', { value: 'not_interested' }, 'Not interested'), h('option', { value: 'follow_up' }, 'Needs follow-up'));
        var completeBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:6px 12px;margin-top:4px' }, 'Check out');
        completeBtn.onclick = async function () {
          completeBtn.disabled = true;
          try { await api('sos_visit_complete', { p_id: v.id, p: { outcome: outcomeSel.value || 'no_outcome' } }); await paintVisits(); }
          catch (e) { completeBtn.disabled = false; }
        };
        var surveyBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:6px 12px;margin-top:4px;margin-left:6px' }, 'Survey');
        surveyBtn.onclick = function () { runSurveyFlow(v.businessId); };
        row.appendChild(outcomeSel); row.appendChild(completeBtn); row.appendChild(surveyBtn);
      }
      visitsList.appendChild(row);
    });
  }
  function newVisitFlow() {
    var nameInput = h('input', { class: 'input', placeholder: 'Business name' });
    var cityInput = h('input', { class: 'input', placeholder: 'City (optional)' });
    var err = h('div', { class: 'err' });
    var goBtn = h('button', { class: 'btn fill', type: 'button' }, 'Check in');
    goBtn.onclick = async function () {
      if (!nameInput.value.trim()) { err.textContent = 'Enter a business name'; return; }
      goBtn.disabled = true;
      try {
        var biz = await api('sos_business_save', { p: { name: nameInput.value.trim(), city: cityInput.value.trim() } });
        var pos = null;
        try { pos = await new Promise(function (res) { navigator.geolocation.getCurrentPosition(function (p) { res(p); }, function () { res(null); }, { timeout: 8000 }); }); } catch (e) {}
        await api('sos_visit_start', { p_business: biz.id, p_lat: pos ? pos.coords.latitude : null, p_lng: pos ? pos.coords.longitude : null });
        wrap.remove();
        await paintVisits();
      } catch (e) { err.textContent = e.message; goBtn.disabled = false; }
    };
    var wrap = h('div', { class: 'notice' }, h('b', null, 'New visit'), nameInput, cityInput, err, goBtn);
    visitsCard.insertBefore(wrap, visitsList);
  }
  var newVisitBtn = h('button', { class: 'btn fill', type: 'button', style: 'width:auto;padding:8px 14px' }, '+ New visit');
  newVisitBtn.onclick = newVisitFlow;
  var visitsCard = h('div', { class: 'notice' }, h('div', { style: 'display:flex;justify-content:space-between;align-items:center' }, h('b', null, 'My visits'), newVisitBtn), visitError, visitsList);

  async function runSurveyFlow(businessId) {
    var templates;
    try { templates = await api('sos_survey_templates_list'); } catch (e) { alert(e.message); return; }
    if (!templates.length) { alert('No survey templates yet. Ask a manager to create one.'); return; }
    var pick = templates.length === 1 ? 0 : (parseInt(prompt('Which survey?\n' + templates.map(function (t, i) { return (i + 1) + '. ' + t.name; }).join('\n') + '\n\nEnter a number:'), 10) - 1);
    if (!(pick >= 0 && pick < templates.length)) return;
    var tmpl = templates[pick];
    var answers = {};
    for (var i = 0; i < tmpl.questions.length; i++) {
      var q = tmpl.questions[i];
      var hint = q.options && q.options.length ? ' (' + q.options.join(' / ') + ')' : (q.kind === 'yes_no' ? ' (yes/no)' : '');
      var ans = prompt(q.label + hint + (q.required ? ' *' : ''));
      if (ans) answers[q.id] = ans;
    }
    try { await api('sos_survey_submit', { p_template: tmpl.id, p_business: businessId, p_visit: null, p_answers: answers }); alert('Survey saved.'); }
    catch (e) { alert(e.message); }
  }

  var LEAD_STAGES = ['new_prospect', 'contacted', 'qualified', 'interested', 'demo_scheduled', 'demo_completed', 'trial_activated', 'negotiation', 'won', 'lost'];
  var leadsList = h('div');
  var leadsError = h('p', { class: 'err' });
  async function paintLeads() {
    var rows;
    try { rows = await api('sos_my_leads'); } catch (e) { leadsError.textContent = e.message; return; }
    clear(leadsList);
    if (!rows.length) { leadsList.appendChild(h('p', { class: 'muted' }, 'No leads yet. Create one from a visited business below.')); return; }
    rows.forEach(function (l) {
      var sel = h('select', { class: 'input', style: 'margin-top:4px;width:auto;display:inline-block' },
        LEAD_STAGES.map(function (s) { return h('option', { value: s, selected: s === l.stage ? true : false }, s.replace(/_/g, ' ')); }));
      sel.onchange = async function () { try { await api('sos_lead_update', { p_id: l.id, p: { stage: sel.value } }); } catch (e) { alert(e.message); } };
      var demoBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:4px 10px;margin-left:6px' }, 'Schedule demo');
      demoBtn.onclick = async function () {
        var when = prompt('Demo date/time (e.g. 2026-12-01 15:00)');
        if (!when) return;
        try { await api('sos_demo_create', { p_lead: l.id, p_date: new Date(when).toISOString() }); await paintLeads(); alert('Demo scheduled.'); }
        catch (e) { alert(e.message); }
      };
      var trialBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:4px 10px;margin-left:6px' }, 'Start trial');
      trialBtn.onclick = async function () {
        try { await api('sos_trial_start', { p_lead: l.id }); await paintLeads(); alert('Trial started (14 days).'); }
        catch (e) { alert(e.message); }
      };
      leadsList.appendChild(h('div', { style: 'padding:8px 0;border-top:1px solid var(--sep)' },
        h('b', null, l.businessName), l.product ? h('span', { class: 'muted' }, '  · ' + l.product) : null, h('br'), sel, demoBtn, trialBtn));
    });
  }
  async function createLeadFlow() {
    var rows;
    try { rows = await api('sos_my_visits'); } catch (e) { alert(e.message); return; }
    if (!rows.length) { alert('Visit a business first, then create a lead for it.'); return; }
    var options = rows.map(function (v) { return v.businessName + '|' + v.businessId; });
    var pick = prompt('Which business?\n' + options.map(function (o, i) { return (i + 1) + '. ' + o.split('|')[0]; }).join('\n') + '\n\nEnter a number:');
    var idx = parseInt(pick, 10) - 1;
    if (!(idx >= 0 && idx < rows.length)) return;
    var product = prompt('Product (e.g. AUZsPOS), optional:') || null;
    try { await api('sos_lead_create', { p_business: rows[idx].businessId, p_product: product }); await paintLeads(); } catch (e) { alert(e.message); }
  }
  var newLeadBtn = h('button', { class: 'btn fill', type: 'button', style: 'width:auto;padding:8px 14px' }, '+ New lead');
  newLeadBtn.onclick = createLeadFlow;
  var leadsCard = h('div', { class: 'notice' }, h('div', { style: 'display:flex;justify-content:space-between;align-items:center' }, h('b', null, 'My leads'), newLeadBtn), leadsError, leadsList);

  var expensesList = h('div', null);
  var expensesError = h('div', { class: 'err' });
  async function paintExpenses() {
    clear(expensesList);
    var rows;
    try { rows = await api('sos_my_expenses'); } catch (e) { expensesError.textContent = e.message; return; }
    if (!rows.length) { expensesList.appendChild(h('p', { class: 'muted' }, 'No expenses filed yet.')); return; }
    rows.forEach(function (x) {
      var fileInput = h('input', { type: 'file', accept: 'image/*,.pdf', style: 'display:none' });
      var attachBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:4px 10px' }, x.receiptFile ? 'Replace receipt' : 'Attach receipt');
      if (x.status !== 'pending') attachBtn.disabled = true;
      attachBtn.onclick = function () { fileInput.click(); };
      fileInput.onchange = async function () {
        if (!fileInput.files[0]) return;
        try { await uploadExpenseReceipt(x.id, fileInput.files[0]); await paintExpenses(); }
        catch (e) { alert(e.message); }
      };
      expensesList.appendChild(h('div', { style: 'padding:8px 0;border-top:1px solid var(--sep)' },
        h('b', null, '₹' + x.amount + ' · ' + x.category), h('span', { class: 'muted' }, '  (' + x.status + ')'), h('br'),
        x.purpose ? h('span', { class: 'muted' }, x.purpose) : null, h('br'), attachBtn, fileInput));
    });
  }
  var newExpenseBtn = h('button', { class: 'btn fill', type: 'button', style: 'width:auto;padding:8px 14px' }, '+ New expense');
  newExpenseBtn.onclick = async function () {
    var category = prompt('Category: fuel, travel, transportation, food, accommodation, other', 'fuel');
    if (!category) return;
    var amount = prompt('Amount (₹):');
    if (!amount) return;
    var purpose = prompt('Purpose, optional:') || '';
    try { await api('sos_expense_submit', { p: { category: category, amount: parseFloat(amount), purpose: purpose } }); await paintExpenses(); }
    catch (e) { alert(e.message); }
  };
  var expensesCard = h('div', { class: 'notice' }, h('div', { style: 'display:flex;justify-content:space-between;align-items:center' }, h('b', null, 'My expenses'), newExpenseBtn), expensesError, expensesList);

  var canManage = dash.my_role === 'Sales Manager' || dash.my_role === 'Admin' || dash.my_role === 'owner';
  var teamCard = h('div', { class: 'notice' });
  async function paintTeam() {
    clear(teamCard).appendChild(h('b', null, 'Team overview'));
    var live, leads, visits;
    try { [live, leads, visits] = await Promise.all([api('sos_live_field'), api('sos_all_leads'), api('sos_all_visits')]); }
    catch (e) { teamCard.appendChild(h('p', { class: 'err' }, e.message)); return; }
    teamCard.appendChild(h('p', { class: 'muted' }, live.length ? live.length + ' in an active field session' : 'No one is in an active field session right now.'));
    live.forEach(function (s) {
      var mapLink = s.lastSample ? h('a', { href: 'https://maps.google.com/?q=' + s.lastSample.lat + ',' + s.lastSample.lng, target: '_blank', rel: 'noopener' }, 'map') : null;
      teamCard.appendChild(h('div', null, s.name + ' — ' + s.status, s.lastSample ? ' · ' : null, mapLink));
    });
    teamCard.appendChild(h('b', { style: 'display:block;margin-top:14px' }, 'All leads (' + leads.length + ')'));
    leads.slice(0, 20).forEach(function (l) {
      teamCard.appendChild(h('div', { class: 'muted', style: 'padding:4px 0' }, l.businessName + ' · ' + l.stage + ' · ' + (l.ownerName || 'unassigned')));
    });
    teamCard.appendChild(h('b', { style: 'display:block;margin-top:14px' }, 'All visits (' + visits.length + ')'));
    visits.slice(0, 20).forEach(function (v) {
      teamCard.appendChild(h('div', { class: 'muted', style: 'padding:4px 0' }, v.businessName + ' · ' + v.staffName + ' · ' + v.status + (v.outcome ? ' · ' + v.outcome : '')));
    });
    var intel;
    try { intel = await api('sos_market_intel'); } catch (e) { intel = null; }
    if (intel) {
      teamCard.appendChild(h('b', { style: 'display:block;margin-top:14px' }, 'Market intelligence (' + intel.totalResponses + ' survey responses, employee-reported)'));
      intel.byCategory.forEach(function (c) { teamCard.appendChild(h('div', { class: 'muted', style: 'padding:4px 0' }, c.category + ': ' + c.count)); });
    }
    var expenses;
    try { expenses = await api('sos_all_expenses', { p_status: 'pending' }); } catch (e) { expenses = []; }
    teamCard.appendChild(h('b', { style: 'display:block;margin-top:14px' }, 'Pending expenses (' + expenses.length + ')'));
    expenses.forEach(function (x) {
      var approveBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:4px 10px' }, 'Approve');
      var rejectBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:4px 10px' }, 'Reject');
      approveBtn.onclick = async function () { try { await api('sos_expense_review', { p_id: x.id, p_decision: 'approved' }); await paintTeam(); } catch (e) { alert(e.message); } };
      rejectBtn.onclick = async function () {
        var reason = prompt('Reason for rejecting:') || '';
        try { await api('sos_expense_review', { p_id: x.id, p_decision: 'rejected', p_reject_reason: reason }); await paintTeam(); } catch (e) { alert(e.message); }
      };
      teamCard.appendChild(h('div', { class: 'muted', style: 'padding:4px 0' },
        x.staffName + ' · ₹' + x.amount + ' · ' + x.category + (x.hasReceipt ? ' · has receipt' : ''), h('br'), approveBtn, rejectBtn));
    });
    var newTemplateBtn = h('button', { class: 'btn plain', type: 'button', style: 'width:auto;padding:6px 12px;margin-top:10px' }, '+ New survey template');
    newTemplateBtn.onclick = async function () {
      var name = prompt('Survey template name:'); if (!name) return;
      var category = prompt('Category (e.g. clothing, grocery, cafe), optional:') || '';
      var questions = [];
      while (true) {
        var label = prompt('Question ' + (questions.length + 1) + ' (leave blank to finish):');
        if (!label) break;
        var kind = prompt('Type for this question: text, number, yes_no, single_choice, multiple_choice, dropdown, date', 'text') || 'text';
        var required = confirm('Is this question required?');
        questions.push({ label: label, kind: kind, required: required });
      }
      if (!questions.length) { alert('Add at least one question.'); return; }
      try { await api('sos_survey_template_save', { p: { name: name, category: category, questions: questions } }); alert('Template saved.'); }
      catch (e) { alert(e.message); }
    };
    teamCard.appendChild(newTemplateBtn);
  }

  var kpis = h('div', { class: 'kpis' },
    h('div', { class: 'kpi' }, h('b', null, dash.my_role), h('span', null, 'Your post')),
    h('div', { class: 'kpi' }, h('b', null, dash.tenant && dash.tenant.name || 'AUZslab'), h('span', null, 'Team')));
  async function paintPerf() {
    if (!canField) return;
    var perf, report;
    try { [perf, report] = await Promise.all([api('sos_my_performance'), api('sos_daily_report')]); } catch (e) { return; }
    kpis.appendChild(h('div', { class: 'kpi' }, h('b', null, perf.visitsDone + (perf.visitsTarget ? '/' + perf.visitsTarget : '')), h('span', null, 'Visits this month')));
    kpis.appendChild(h('div', { class: 'kpi' }, h('b', null, perf.leadsDone + (perf.leadsTarget ? '/' + perf.leadsTarget : '')), h('span', null, 'Leads this month')));
    kpis.appendChild(h('div', { class: 'kpi' }, h('b', null, perf.dealsWon), h('span', null, 'Deals won this month')));
    kpis.appendChild(h('div', { class: 'kpi' }, h('b', null, report.followUpsDue), h('span', null, 'Follow-ups due today')));
  }

  var main = h('main', null, kpis,
    canField ? fieldCard : null,
    canField ? visitsCard : null,
    canField ? leadsCard : null,
    canField ? expensesCard : null,
    canManage ? teamCard : null,
    h('div', { class: 'notice' }, h('b', null, 'Welcome.'),
      h('p', { class: 'muted' }, 'Notifications and the survey engine are being built next. This page will grow into your daily workspace.')));
  clear(app).appendChild(h('div', { class: 'shell' }, topbar, main));
  if (canField) { paintField(); paintVisits(); paintLeads(); paintExpenses(); paintPerf(); }
  if (canManage) paintTeam();
}

boot();
</script>
</body>
</html>
