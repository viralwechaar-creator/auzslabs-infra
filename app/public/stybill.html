<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#2a2a2a;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 28px}
main{max-width:794px;margin:0 auto}
.sheet{background:#000;padding:clamp(18px,5.6vw,44px) clamp(16px,5.6vw,44px) clamp(16px,4vw,28px);font-size:clamp(10px,2.6vw,12px);line-height:1.35;font-weight:500;letter-spacing:-.1px}
.brand{font-size:clamp(34px,13.5vw,100px);line-height:.92;font-weight:700;letter-spacing:-.05em;margin:0;text-transform:uppercase;word-break:break-word}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-items:end;margin-top:clamp(22px,7vw,52px);padding-bottom:12px}
.meta .m{font-size:clamp(12px,3.4vw,16px);line-height:1.15;font-weight:600;letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere}
.h1{grid-column:1/-1;font-size:clamp(30px,9.5vw,44px);line-height:.9;font-weight:700;letter-spacing:-.05em;margin:4px 0 0;text-align:right}
@media(min-width:600px){.meta{grid-template-columns:1fr 1fr auto}.h1{grid-column:auto;margin:0}}
hr{border:0;border-top:1px solid #fff;margin:0}
.th,.ln{display:grid;grid-template-columns:1fr 34px 72px 64px 82px;gap:6px;align-items:start}
.th{padding:8px 0 5px;font-size:.78em;color:#9b9b9b;letter-spacing:.04em}
.ln{padding:9px 0 4px;font-weight:600;font-size:1.08em;line-height:1.2}
.ln small{display:block;font-weight:500;color:#bdbdbd;font-size:.86em;padding-left:clamp(10px,4vw,34px);margin-top:2px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.nodisc .th>:nth-child(4),.nodisc .ln>:nth-child(4){display:none}.nodisc .th,.nodisc .ln{grid-template-columns:1fr 34px 76px 86px}
@media(max-width:420px){.th,.ln{grid-template-columns:1fr 26px 62px 56px 70px}.nodisc .th,.nodisc .ln{grid-template-columns:1fr 26px 66px 74px}}
.tots{margin:clamp(34px,10vw,90px) 0 0 auto;width:min(100%,330px);font-weight:700;font-size:1.05em}
.tr{display:flex;justify-content:space-between;gap:12px;line-height:1.3}
.tr.big{font-size:1.3em;margin-top:6px}.tr.sp{margin-top:9px}
.pay{margin-top:clamp(18px,5vw,30px);border-top:1px solid #fff;padding-top:14px;display:grid;gap:18px}
@media(min-width:600px){.pay{grid-template-columns:1fr 1.15fr}}
.pay h2{margin:0;font-size:clamp(32px,10vw,42px);line-height:.9;font-weight:700;letter-spacing:-.05em;display:inline}
.pay .ref{display:inline-block;vertical-align:top;margin-left:9px;font-size:.82em;line-height:1.25;font-weight:600}
.pay .info{margin-top:11px;font-size:.9em;line-height:1.5}
.qr{background:#fff;padding:3px;width:84px;height:84px;margin-top:10px}.qr img{width:100%;height:100%;display:block}
.scan{font-size:.82em;font-weight:700;margin-top:6px}
.terms{font-size:.72em;line-height:1.4;color:#e6e6e6}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;border-top:1px solid #fff;margin-top:18px;padding-top:8px;font-size:.78em;line-height:1.3;font-weight:600;text-transform:uppercase}
@media(min-width:600px){.foot{grid-template-columns:repeat(4,1fr)}}
.tag{display:inline-block;border:1px solid #fff;padding:3px 10px;margin:12px 0 0;font-weight:700;font-size:1em;letter-spacing:.04em}
.bar{display:flex;justify-content:center;gap:10px;margin-top:16px}
.bar button{border:1.5px solid #fff;border-radius:999px;padding:12px 22px;font:600 14px "Helvetica Neue",Arial,sans-serif;background:#000;color:#fff;cursor:pointer}
.msg{text-align:center;color:#bbb;max-width:320px;margin:60px auto 0;padding:0 16px}
.skel{height:420px;background:linear-gradient(90deg,#000,#1d1d1d,#000);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@page{size:A4;margin:0}
@media print{html,body{background:#000}body{padding:0}.bar{display:none}.sheet{min-height:1123px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="skel"></div></main>
<script src="/config.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/stybill.js?v=2"></script>
</body>
</html>
