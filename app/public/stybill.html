<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#efece8;--card:#fff;--ink:#171717;--mut:#74706b;--line:#e5e1dc}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1c;--card:#2b2a28;--ink:#f2f2f0;--mut:#a09b94;--line:#3b3936}}
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 40px;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;justify-items:center}
main{width:100%;max-width:400px}
.bill{background:var(--card);border-radius:22px;padding:22px 20px;box-shadow:0 0 0 .5px var(--line)}
.hd{text-align:center;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.hd img{width:54px;height:54px;object-fit:contain;border-radius:12px;margin-bottom:8px}
.hd h1{font-size:19px;margin:0 0 3px;letter-spacing:-.01em}
.hd div{color:var(--mut);font-size:12.5px}
.meta{display:flex;justify-content:space-between;gap:10px;padding:12px 0;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600}
.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ln small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.ln .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.sum{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut);font-size:13.5px;font-variant-numeric:tabular-nums}
.sum .t{color:var(--ink);font-size:18px;font-weight:700;padding-top:8px}
.sum .due{color:#c2410c;font-weight:600}
.tag{display:inline-block;margin:0 auto 10px;padding:4px 12px;border-radius:12px;background:#fee2e2;color:#b91c1c;font-size:12.5px;font-weight:600}
.ft{text-align:center;color:var(--mut);font-size:12.5px;margin-top:16px;line-height:1.5}
.bar{display:flex;justify-content:center;gap:10px;margin-top:16px}
.bar button{border:0;border-radius:14px;padding:12px 22px;font:600 14px -apple-system,Arial,sans-serif;background:var(--ink);color:var(--bg);cursor:pointer}
.msg{text-align:center;color:var(--mut);max-width:320px;margin:60px auto 0}
.skel{height:380px;border-radius:22px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media print{body{background:#fff;padding:0}.bill{box-shadow:none;border-radius:0}.bar{display:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="skel"></div></main>
<script src="/config.js"></script>
<script src="/stybill.js?v=1"></script>
</body>
</html>
