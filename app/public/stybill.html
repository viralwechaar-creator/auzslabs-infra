<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#ececec;color:#111;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 28px}
main{max-width:794px;margin:0 auto}
.sheet{background:#fff;padding:clamp(16px,5vw,40px);font-size:clamp(11px,2.9vw,13px);line-height:1.4}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px}
.shop{display:flex;gap:12px;align-items:flex-start;min-width:0}
.shop img{width:54px;height:54px;object-fit:contain;border-radius:8px;flex:none}
.shop h1{margin:0;font-size:clamp(18px,5vw,24px);line-height:1.1;letter-spacing:-.02em}
.shop div{color:#444;margin-top:2px;overflow-wrap:anywhere}
.doc{text-align:right;flex:none}
.doc b{display:block;font-size:clamp(14px,4vw,18px);letter-spacing:.06em}
.doc span{display:block;color:#444;margin-top:2px}
.tag{display:inline-block;border:1.5px solid #b3261e;color:#b3261e;padding:2px 9px;margin-top:8px;font-weight:700;letter-spacing:.05em}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #ddd}
.info small{display:block;color:#777;font-size:.82em;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{font-size:.8em;color:#555;text-align:right;text-transform:uppercase;letter-spacing:.04em;padding:7px 4px;border-bottom:1px solid #111}
td{padding:8px 4px;border-bottom:1px solid #eee;text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{color:#777;width:22px}
td small{display:block;color:#666}
.sum{display:grid;gap:16px;margin-top:14px}
@media(min-width:600px){.sum{grid-template-columns:1.1fr 1fr}}
.tr{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.tr.big{font-size:1.25em;font-weight:700;border-top:2px solid #111;margin-top:6px;padding-top:7px}
.tr.due{color:#b3261e;font-weight:700}.tr.ok{color:#1b7a3a;font-weight:700}
.muted{color:#666}
.pay{display:flex;gap:12px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:10px}
.qr{background:#fff;width:92px;height:92px;flex:none}.qr img{width:100%;height:100%;display:block}
.terms{margin-top:14px;font-size:.88em;color:#555;border-top:1px solid #ddd;padding-top:10px}
.foot{text-align:center;margin-top:14px;font-weight:600}
.bar{display:flex;justify-content:center;margin-top:16px}
.bar button{border:0;border-radius:999px;padding:12px 24px;font:600 14px -apple-system,Arial,sans-serif;background:#111;color:#fff;cursor:pointer}
.msg{text-align:center;color:#555;max-width:320px;margin:60px auto 0;padding:0 16px}
.skel{height:420px;background:#fff}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff}body{padding:0}.bar{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="skel"></div></main>
<script src="/config.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/stybill.js?v=3"></script>
</body>
</html>
