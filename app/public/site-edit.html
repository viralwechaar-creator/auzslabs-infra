<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Edit website</title>
<link rel="stylesheet" href="/ds/auz.css?v=5"><script src="/ds/brand.js?v=2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--label)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--sep);flex-wrap:wrap}
.bar h1{font-size:18px;margin:0;flex:1;min-width:140px}
.bar .st{font-size:13px;color:var(--label2);max-width:260px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--fill2);color:var(--label);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
button.p{background:var(--accent);color:#fff}button:disabled{opacity:.5}
.steps{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--label2)}.steps span{display:flex;align-items:center;gap:8px}.steps b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.ed{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(320px,32vw);gap:14px;padding:14px;width:100%;align-items:start}
.nav{display:grid;gap:6px;position:sticky;top:76px}
.nav button{justify-content:space-between;text-align:left;background:var(--card);border:1px solid var(--sep);padding:12px 14px;width:100%}
.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.nav button span{font-size:12px;opacity:.75;font-weight:500}
.panel{background:var(--card);border:1px solid var(--sep);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{margin:0;font-size:20px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.f{display:grid;gap:6px;align-content:start;padding:12px;border:1px solid var(--sep);border-radius:14px;background:var(--bg);min-width:0}
.f.wide{grid-column:1/-1}.f label{font-size:14px;font-weight:700}
.f .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.f .row a{font-size:13px;color:var(--accent-text);cursor:pointer;font-weight:600}
input[type=text],textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--sep);border-radius:12px;background:var(--card);color:var(--label)}textarea{min-height:96px;resize:vertical}
.im{display:grid;gap:10px}.im img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--fill2)}.im .acts{display:flex;gap:8px;flex-wrap:wrap}.im .acts button{flex:1}
.pv{position:sticky;top:76px;display:grid;gap:8px}.pv iframe{width:100%;height:calc(100vh - 150px);min-height:420px;border:1px solid var(--sep);border-radius:16px;background:#fff}
.pv .pvh{display:flex;justify-content:space-between;align-items:center;font-weight:700}.pv small{color:var(--label2)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:24px;display:grid;gap:12px}
.note{font-size:13px;color:var(--label2)}
@media (max-width:1100px){.ed{grid-template-columns:200px minmax(0,1fr)}.pv{display:none}}
@media (max-width:720px){.ed{grid-template-columns:minmax(0,1fr);padding:10px}.nav{position:static;display:flex;overflow-x:auto;gap:8px;padding-bottom:4px}.nav button{width:auto;flex:none}.nav button span{display:none}.fg{grid-template-columns:minmax(0,1fr)}}
</style></head><body><div id="app"></div>
<script src="/config.js"></script><script src="/sb-client.js?v=6"></script><script src="/ds/twofa.js?v=1"></script><script src="/tenant.js?v=3"></script><script src="/site-schemas.js?v=1"></script>
<script>
const $=s=>document.querySelector(s);
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x.startsWith('on'))e[x]=v;else if(v!=null)e.setAttribute(x,v)}k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});return e}
const sb=supabase.createClient((window.CFG||{}).url,(window.CFG||{}).key),root=$('#app');let SLUG='',REC=null,DATA={},FIELDS=[],dirty=false;
function login(msg){const e=h('input',{type:'text',placeholder:'Email',autocomplete:'username'}),p=h('input',{type:'password',placeholder:'Password',autocomplete:'current-password',style:'font:inherit;width:100%;padding:10px 12px;border:1px solid var(--sep);border-radius:12px;background:var(--bg);color:var(--label)'}),m=h('div',{class:'note'},msg||'');
 root.replaceChildren(h('div',{class:'login'},h('h2',{style:'margin:0'},'Website login'),h('div',{class:'note'},'Sign in with the same email and password you use for your business.'),e,p,m,h('button',{class:'p',onclick:async()=>{let r=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});r=await auz2fa.resolve(sb,r);r.error?m.textContent=r.error.message:boot()}},'Sign in')))}
function siteBase(){const parts=location.hostname.split('.');return location.protocol+'//'+SLUG+'.'+parts.slice(-2).join('.')}
async function boot(){
 let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch{}
 if(!ses)return login();
 let dash=null;try{dash=(await sb.rpc('my_dashboard')).data}catch{}
 if(!dash||!dash.tenant)return login('This login has no business.');
 if(window.TENANT_SLUG&&dash.tenant.slug!==window.TENANT_SLUG){await sb.auth.signOut();return login('This login belongs to a different business ('+dash.tenant.slug+'). Open your own website link.')}
 let role='';try{role=((await sb.from('profiles').select('role').eq('id',ses.user.id).single()).data||{}).role}catch{}
 if(role!=='owner')return root.replaceChildren(h('div',{class:'login'},h('h2',{style:'margin:0'},'Owner only'),h('div',{class:'note'},'Only the business owner can edit the website.'),h('button',{onclick:async()=>{await sb.auth.signOut();login()}},'Sign out')));
 SLUG=dash.tenant.slug;
 const{data}=await sb.from('records').select('id,data,updated_at').eq('kind','settings').eq('id','settings').limit(1);
 REC=data&&data[0];if(!REC)return root.replaceChildren(h('div',{class:'login'},'Settings not found.'));
 DATA=Object.assign({},(REC.data||{}).siteData||{});
 const design=(REC.data||{}).siteTemplate||'classic',sc=(window.SITE_SCHEMAS||{})[design];
 if(!sc)return root.replaceChildren(topBar(),h('div',{class:'wrap'},h('div',{class:'login',style:'margin:0 auto;max-width:520px'},h('h2',{style:'margin:0'},'This design is edited in the Admin console'),h('div',{class:'note'},'Open Admin console, then Tables & ordering, Website & Booking.'),h('a',{class:'btn p',href:'/dashboard.html#mgmt/website'},'Open Admin console'))));
 const html=await (await fetch(sc.file+'?'+Date.now())).text(),doc=new DOMParser().parseFromString(html,'text/html');
 FIELDS=[...doc.querySelectorAll('[data-ed],[data-ed-img]')].map(el=>{const pg=el.closest('.page'),img=el.hasAttribute('data-ed-img'),k=el.getAttribute(img?'data-ed-img':'data-ed');return{k,img,hash:pg?pg.id.replace('page-',''):'home',label:el.getAttribute('data-ed-label')||k,group:el.getAttribute('data-ed-group')||'Other',type:img?'image':(el.getAttribute('data-ed-type')||'text'),def:img?(el.getAttribute('src')||''):el.innerText===undefined?el.textContent.trim():el.textContent.replace(/\s+/g,' ').trim()}});
 draw(sc);
}
function topBar(){return h('div',{class:'bar'},h('h1',{},'Edit website'),h('button',{onclick:async()=>{await sb.auth.signOut();login()}},'Sign out'))}
async function shrink(file){const bm=await createImageBitmap(file),sc=Math.min(1,1600/bm.width),w=Math.round(bm.width*sc),ht=Math.round(bm.height*sc),c=document.createElement('canvas');c.width=w;c.height=ht;c.getContext('2d').drawImage(bm,0,0,w,ht);
 for(const[t,q,ext]of[['image/webp',.8,'webp'],['image/jpeg',.8,'jpg']]){const b=await new Promise(r=>c.toBlob(r,t,q));if(b&&b.type===t)return{b,ext,t}}throw new Error('Could not process that image')}
async function upload(file){const o=await shrink(file),name='site-edit/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+o.ext,{error}=await sb.storage.from('site').upload(name,o.b,{contentType:o.t});if(error)throw error;return sb.storage.from('site').getPublicUrl(name).data.publicUrl}
let CUR=0,GROUPS=[],SC=null;
function draw(sc){
 SC=sc;GROUPS=[];FIELDS.forEach(f=>{let g=GROUPS.find(x=>x.n===f.group);if(!g)GROUPS.push(g={n:f.group,f:[],hash:f.hash});g.f.push(f)});
 const bar=h('div',{class:'bar'},h('h1',{},'Edit your website'),h('span',{class:'st',id:'msg'}),h('a',{class:'btn',href:siteBase()+'/site.html',target:'_blank',rel:'noopener'},'Open site'),h('button',{class:'p',onclick:doSave},'Save changes'),h('button',{onclick:async()=>{await sb.auth.signOut();login()}},'Sign out'));
 root.replaceChildren(bar,h('div',{class:'ed',id:'ed'}));paint()}
function paint(){
 const g=GROUPS[CUR],ed=document.getElementById('ed');
 const nav=h('nav',{class:'nav'},...GROUPS.map((x,i)=>h('button',{class:i===CUR?'on':'',onclick:()=>{CUR=i;paint()}},x.n,h('span',{},x.f.length+(x.f.length===1?' item':' items')))));
 const panel=h('section',{class:'panel'},h('div',{class:'steps'},h('span',{},h('b',{},'1'),'Pick a page'),h('span',{},h('b',{},'2'),'Change text or photos'),h('span',{},h('b',{},'3'),'Press Save changes')),h('h2',{},g.n),h('div',{class:'fg'},...g.f.map(field)),h('div',{class:'note'},'Leave a box empty to keep the original. Photos are made smaller automatically. Menu, prices and address are changed in the Admin console.'));
 const fr=h('iframe',{id:'pvf',title:'Preview',src:SC.file+'?pv='+Date.now()+'#'+(g.hash||'home')});
 const pv=h('aside',{class:'pv'},h('div',{class:'pvh'},'Preview',h('small',{},'Updates when you save')),fr);
 ed.replaceChildren(nav,panel,pv)}
function field(f){
 const wrap=h('div',{class:'f'+((f.type==='long'||f.img)?'':'')});
 if(f.img){const im=h('img',{src:DATA[f.k]||f.def,alt:''}),file=h('input',{type:'file',accept:'image/*',style:'display:none',onchange:async e=>{const x=e.target.files[0];if(!x)return;msg('Uploading photo…');try{DATA[f.k]=await upload(x);im.src=DATA[f.k];dirty=true;msg('Photo ready. Press Save changes.')}catch(err){msg(err.message)}}});
  wrap.append(h('label',{},f.label),h('div',{class:'im'},im,h('div',{class:'acts'},h('button',{onclick:()=>file.click()},'Choose photo'),h('button',{onclick:()=>{delete DATA[f.k];im.src=f.def;dirty=true}},'Use original')),file));return wrap}
 if(f.type==='long')wrap.classList.add('wide');
 const inp=f.type==='long'?h('textarea',{placeholder:f.def}):h('input',{type:'text',placeholder:f.def});inp.value=DATA[f.k]!=null?DATA[f.k]:'';
 inp.oninput=()=>{if(inp.value.trim())DATA[f.k]=inp.value;else delete DATA[f.k];dirty=true};
 wrap.append(h('div',{class:'row'},h('label',{},f.label),h('a',{onclick:()=>{inp.value='';delete DATA[f.k];dirty=true;msg('Back to the original text')}},'Reset')),inp);return wrap}
function msg(t){const m=document.getElementById('msg');if(m)m.textContent=t}
async function doSave(){msg('Saving…');
 try{const{data}=await sb.from('records').select('id,data,updated_at').eq('kind','settings').eq('id','settings').limit(1),cur=data&&data[0];if(!cur)throw new Error('Settings not found');
  const nd=Object.assign({},cur.data,{siteData:DATA});
  let{data:r,error}=await sb.rpc('push_record',{rid:'settings',rkind:'settings',rdata:nd,rdeleted:false,base:cur.updated_at,force:false});
  if(error)throw error;
  if(r&&r.conflict){({error}=await sb.rpc('push_record',{rid:'settings',rkind:'settings',rdata:nd,rdeleted:false,base:null,force:true}));if(error)throw error}
  dirty=false;msg('Saved. Your website is updated.');const pf=document.getElementById('pvf');if(pf)pf.src=SC.file+'?pv='+Date.now()+'#'+(GROUPS[CUR].hash||'home')}catch(e){msg('Not saved: '+(e.message||e))}}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
boot();
</script></body></html>
