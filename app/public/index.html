/* ---- Same design tokens/typography as auzslab.in (site/theme.css):
   ink/accent palette, Fraunces+Inter+Space Mono. A 2px-ink-border-on-
   every-element pass (the previous version of this comment/reskin)
   read as "boxy" in a dense screen with dozens of buttons on it at
   once -- borders on every row action, every category pill, every nav
   tab. Minimal-premium instead: borders/shadow reserved for the few
   things that are genuinely containers (.card, .md modal, item

   else (buttons, nav, row actions) is a plain or soft-filled shape

:root{--ink:#171717;--ink-dim:#4d4d4d;--ink-faint:#8c8c8c;--accent:#800020;--g:var(--accent);--l:rgba(23,23,23,.16);--bg-raised:#dedede;--radius-sm:12px;--radius-md:16px;--radius-lg:20px;--shadow-sm:0 2px 8px -4px rgba(23,23,23,.16);--shadow-md:0 12px 28px -12px rgba(23,23,23,.2)}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg-raised);color:var(--ink)}

button:hover{background:var(--l)}

button:disabled{opacity:.4;background:none}
input,select,textarea{font:inherit;padding:9px 14px;border:1.5px solid var(--l);border-radius:var(--radius-sm);background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

.g{display:grid;grid-template-columns:1fr 340px;gap:10px;padding:10px}@media(max-width:800px){.g{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.items button{text-align:left;min-height:64px;border-radius:12px;background:#fff;border:1.5px solid var(--l);color:var(--ink)}
.items button:hover{border-color:var(--ink-faint);background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.row:last-child{border-bottom:none}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:10px}
.md{background:#fff;border-radius:var(--radius-lg);padding:18px;width:420px;max-width:100%;max-height:90vh;overflow:auto;display:grid;gap:8px;box-shadow:var(--shadow-md)}.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:10px}
table{width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid var(--l);text-align:left}
.powered{text-align:center;padding:14px 10px 24px;font-size:11px;color:var(--ink-faint);font-family:'Space Mono',monospace}.powered a{color:var(--ink-faint)}
#notifCount:not(:empty){background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px;font-size:10px;margin-left:3px}
/* ---- tabbar: a segmented control for switching panes within one
   screen (currently Settings' Business/Tables/Website) instead of
   stacking every section as its own long card, one under the next. ---- */
.tabbar{display:flex;gap:2px;padding:4px;background:var(--bg-raised);border-radius:999px;margin-bottom:10px}
.tabbar button{flex:1;padding:8px 12px;border-radius:999px;font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);text-align:center}
