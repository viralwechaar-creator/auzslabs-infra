<style>

/* clean header: logo + home, no half-cut menu */
.shell{display:block!important}
.shell>.content{margin:0!important;width:100%}
.shell>.topbar{display:flex!important;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;padding:10px 24px}
.shell>.topbar .topbar-nav,.shell>.topbar .topbar-nav.tbn-fixed{display:none!important}
.shell>.topbar .topbar-logo{order:0!important;display:block}
.shell>.topbar .topbar-logo img{max-width:112px;height:auto;display:block}
body.has-tbn main.content{padding-top:0!important}
.pay-wrap{margin-left:auto;margin-right:auto;padding-left:20px;padding-right:20px}
.pay-hero{padding-top:30px!important;padding-bottom:6px!important}
.pay-hero .h-1{font-size:clamp(28px,4vw,40px);margin:6px 0 8px}
.pay-hero .lede{margin:0 0 4px;max-width:640px}
.state-card{text-align:center;padding:30px 22px}
.state-ico{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:26px;font-weight:700}
.state-ico.ok{background:#1f7a4d}.state-ico.bad{background:var(--accent)}
.state-card h2{margin:0 0 6px;font-size:20px}
.state-card p{margin:0 auto 14px;max-width:420px;color:var(--ink-faint);font-size:14px}
.help-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.err{color:var(--accent);font-size:12.5px;margin-top:10px}
.pay-wrap{max-width:720px}
.pay-grid{display:block}
.pay-grid>section{margin:0}
.pay-col{display:grid;gap:16px;align-content:start}
.next-list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:13.5px}
.next-list li{display:flex;gap:10px;align-items:flex-start}
.next-list b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
@media(min-width:1000px){
  .pay-wrap{max-width:1240px!important;width:100%}
  .pay-wrap>section.section:first-child{padding-bottom:6px}
  .pay-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .pay-grid .pay-side{position:sticky;top:76px}
}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.steps span{font-size:12px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-faint);white-space:nowrap}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps span.done{border-color:var(--ink);color:var(--ink)}
.bill-t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.bill-t th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:6px 6px;border-bottom:1.5px solid var(--ink)}
.bill-t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.bill-t .r{text-align:right;white-space:nowrap}
.bill-t small{display:block;color:var(--ink-faint);font-size:11.5px}
.tot-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;color:var(--ink-faint)}
.tot-row b{color:var(--ink)}
.tot-row.big{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-size:18px;color:var(--ink)}
.terms-box{border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-top:10px;max-height:300px;overflow:auto;font-size:13px;line-height:1.55}
.terms-box h4{margin:12px 0 2px;font-size:13px}
.terms-box p{margin:0 0 6px;color:var(--ink-faint)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.upi-card{text-align:center}
.upi-card img{margin:10px auto;display:block;border-radius:12px;background:#fff}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13.5px;margin-top:8px}
.kv span:nth-child(odd){color:var(--ink-faint)}
</style>
<style id="topbar-nav-css">
.topbar-nav{display:none}
@media(min-width:900px){
  .topbar-nav{display:flex;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);gap:26px;margin:0;order:0}
  .tbn-item{position:relative}
  .topbar-nav .tbn-top{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:10px 2px;white-space:nowrap;position:relative}
  .topbar-nav .tbn-top i{font-style:normal;font-size:9px;opacity:.6;transition:transform .15s}
  .tbn-item:hover .tbn-top i,.tbn-item:focus-within .tbn-top i{transform:rotate(180deg)}
  .topbar-nav .tbn-top:hover{color:var(--accent)}
  .topbar-nav .tbn-top[aria-current="page"]{color:var(--accent)}
  .topbar-nav .tbn-top[aria-current="page"]::before{content:"[ ";white-space:pre}
  .topbar-nav .tbn-top[aria-current="page"]::after{content:" ]";white-space:pre}
  .tbn-menu{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);min-width:240px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -18px rgba(0,0,0,.4);z-index:40}
  .tbn-menu::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
  .tbn-item:hover .tbn-menu,.tbn-item:focus-within .tbn-menu{display:block}
  .tbn-menu a{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 12px;border-radius:10px;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap}
  .tbn-menu a small{font:500 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint,#8a847f)}
  .tbn-menu a:hover{background:var(--bg,#f6f4f1);color:var(--accent)}
  .tbn-menu a.tbn-all{margin-top:4px;border-top:1px dashed var(--line);border-radius:0 0 10px 10px;color:var(--accent)}
  .topbar-nav.tbn-fixed{display:flex;position:fixed;left:0;right:var(--sidebar-w,280px);top:0;transform:none;height:54px;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--line);z-index:24;padding-left:120px}
  body:not(:has(.sidebar)) .topbar-nav.tbn-fixed{right:0}
  .tbn-logo{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:block;line-height:0}
  .tbn-logo img{height:28px;width:auto;display:block}
  :root[data-theme=dark] .tbn-logo img{filter:invert(1)}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tbn-logo img{filter:invert(1)}}
  body.has-tbn main.content{padding-top:54px}
}
</style>

<script>
const sb = supabase.createClient(CFG.url, CFG.key);
const O = window.AUZ_ORDER, CO = window.AUZ_CO || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
const STEPS = [['requested', 'Request'], ['verifying', 'Verification'], ['link_sent', 'Payment'], ['payment_submitted', 'Confirming'], ['paid', 'Done']];
const ORDER_OF = { requested: 0, verifying: 1, confirmed: 1, link_sent: 2, payment_submitted: 3, paid: 4 };
let D = null, PAYCFG = { enabled: false };

function setHead(label, title, lede) { $('pgLabel').textContent = label; $('pgTitle').textContent = title; $('pgLede').textContent = lede || ''; }
function setSteps(status) {
  const at = ORDER_OF[status] == null ? -1 : ORDER_OF[status];
  $('steps').innerHTML = status === 'rejected' ? '' : STEPS.map(([k, t], i) => `<span class="${i < at ? 'done' : i === at ? 'on' : ''}">${i + 1}. ${esc(t)}</span>`).join('');
}
function billHtml(D) {
  const q = D.quote || {}, t = D.totals || {}, lines = t.lines || [];
  const planTxt = (l) => l.type === 'product' ? (l.plan === 'year' ? 'Yearly' : 'Monthly') : '';
  const rows = lines.map((l) => `<tr><td>${esc(l.label)}${planTxt(l) ? `<small>${planTxt(l)} plan${l.renewal ? ' &middot; renews ' + esc(l.renewal) : ''}</small>` : ''}</td><td class="r">${inr(l.rate)}</td><td class="r">${l.discount > 0 ? '−' + inr(l.discount) : '&mdash;'}</td><td class="r">${l.gst ? l.gst + '%' : '0%'}</td><td class="r"><b>${inr(l.total)}</b></td></tr>`).join('');
  return `<table class="bill-t"><tr><th>Item</th><th class="r">Price</th><th class="r">Discount</th><th class="r">GST</th><th class="r">Amount</th></tr>${rows}</table>
  <div style="margin-top:12px">
    <div class="tot-row"><span>Total before GST</span><b>${inr(t.taxable)}</b></div>
    ${t.intra ? `<div class="tot-row"><span>CGST</span><b>${inr(t.cgst)}</b></div><div class="tot-row"><span>SGST</span><b>${inr(t.sgst)}</b></div>` : `<div class="tot-row"><span>IGST</span><b>${inr(t.igst)}</b></div>`}
    ${t.round ? `<div class="tot-row"><span>Round off</span><b>${t.round > 0 ? '+' : ''}${inr(t.round)}</b></div>` : ''}
    <div class="tot-row big"><span>Total to pay</span><b>${inr(t.total)}</b></div>
  </div>${q.note ? `<p class="pay-note">${esc(q.note)}</p>` : ''}`;
}
function termsHtml() { return O.terms.map(([h, p]) => `<h4>${esc(h)}</h4><p>${esc(p)}</p>`).join(''); }
function detailsHtml(D) {
  return `<div class="kv"><span>Name</span><span>${esc(D.contact_name)}</span><span>Mobile</span><span>${esc(D.phone)}</span><span>Business</span><span>${esc(D.business_name)}</span>${D.gstin ? `<span>GSTIN</span><span>${esc(D.gstin)}</span>` : ''}${D.address ? `<span>Address</span><span>${esc(D.address)}</span>` : ''}${(D.products || []).length ? `<span>Products</span><span>${D.products.map((k) => esc(O.labels[k] || k)).join(', ')}</span>` : ''}</div>`;
}
function bankHtml() {
  const b = O.bank || {}; if (!b.account) return '';
  return `<div class="kv"><span>Account name</span><span>${esc(b.holder)}</span><span>Bank</span><span>${esc(b.bank)}</span><span>Account no.</span><span>${esc(b.account)}</span><span>IFSC</span><span>${esc(b.ifsc)}</span>${b.branch ? `<span>Branch</span><span>${esc(b.branch)}</span>` : ''}</div>`;
}

function helpCard(title) {
  const ph = String(CO.phone || '').replace(/[^0-9]/g, '');
  return `<div class="card"><div class="label">${title || 'Need help?'}</div><p class="pay-note" style="margin:6px 0 12px">Write to us and quote your request. We reply the same day.</p><div class="help-btns">${ph ? `<a class="btn btn-primary" href="https://wa.me/${ph}" target="_blank" rel="noopener">WhatsApp us</a><a class="btn btn-ghost" href="tel:+${ph}">Call</a>` : ''}${CO.grievanceEmail ? `<a class="btn btn-ghost" href="mailto:${esc(CO.grievanceEmail)}">Email</a>` : ''}</div></div>`;
}
function stateBody(kind, title, text, extra) {
  const ico = kind === 'ok' ? '&#10003;' : kind === 'bad' ? '!' : '?';
  $('body').innerHTML = `<div class="pay-grid"><div class="pay-col"><div class="card state-card"><div class="state-ico ${kind}">${ico}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${extra || ''}</div></div><div class="pay-col pay-side">${helpCard()}<div class="card"><div class="label">Not sure what to do?</div><ul class="next-list"><li><b>1</b><span>Open the latest message we sent you on WhatsApp.</span></li><li><b>2</b><span>Tap the payment link in it.</span></li><li><b>3</b><span>Or send a new request from the cart.</span></li></ul><a class="btn btn-ghost" style="margin-top:12px" href="cart.html">Go to cart</a></div></div></div>`;
}

function render() {
  const st = D.status; setSteps(st);
  if (st === 'rejected') { setHead('Your request', 'We could not take this request.', 'Please write to us on WhatsApp or email if you would like to talk about it.'); $('body').innerHTML = `<div class="pay-grid"><div class="pay-col"><div class="card"><div class="label">What you sent us</div>${detailsHtml(D)}</div></div><div class="pay-col pay-side">${helpCard('Talk to us')}</div></div>`; return; }
  if (st === 'requested' || st === 'verifying' || st === 'confirmed') {
    setHead('Your request', st === 'requested' ? 'Request received.' : st === 'verifying' ? 'We are checking your business.' : 'You are confirmed.',
      st === 'confirmed' ? 'Your bill is being prepared. We will send the payment link on WhatsApp.' : 'We will contact you on WhatsApp. After that you will get your payment link here.');
    $('body').innerHTML = `<div class="pay-grid"><div class="pay-col"><div class="card"><div class="label">What you sent us</div>${detailsHtml(D)}${D.requirement ? `<p class="pay-note" style="margin-top:12px">${esc(D.requirement)}</p>` : ''}</div></div>
      <div class="pay-col pay-side"><div class="card"><div class="label">What happens next</div><ol class="next-list">
        <li><b>1</b><span>We check your details and contact you on WhatsApp.</span></li>
        <li><b>2</b><span>You get your bill and a payment link on this page.</span></li>
        <li><b>3</b><span>Pay online. Your access starts as soon as the payment is confirmed.</span></li></ol></div>
        ${helpCard('Need help?')}</div>`;
    return;
  }
  if (st === 'paid') {
    setHead('Payment confirmed', 'Thank you. You are all set.', 'Your access is active. Your bill is below.');
    const slug = D.tenant_slug;
    $('body').innerHTML = `<div class="pay-grid"><div class="pay-col"><div class="card"><div class="label">Your bill</div>${billHtml(D)}</div></div><div class="pay-col pay-side"><div class="card"><div class="label">Bill ${esc(D.invoice_no || '')}</div>
      <p class="p">Paid on ${esc(String(D.paid_at || '').slice(0, 10))}. ${slug ? `Open your workspace at <a href="https://${esc(slug)}.auzslab.in" style="color:var(--accent)">${esc(slug)}.auzslab.in</a> and sign in with the same account you used to send the request.` : ''}</p>
      <a class="btn btn-primary form-submit" href="inv.html?t=${encodeURIComponent(TOKEN)}">View or print your bill</a></div></div></div>`;
    return;
  }
  // link_sent / payment_submitted: the bill and the payment card
  const submitted = st === 'payment_submitted';
  setHead(submitted ? 'Payment received' : 'Payment', submitted ? 'Thank you. We are confirming your payment.' : 'Your bill and payment.', submitted ? 'You will get your bill on WhatsApp once we confirm it. You can send the screenshot again below if needed.' : (PAYCFG.enabled ? 'Read the terms, tick the box and pay online.' : 'Read the terms, tick the box, pay, then send us the screenshot.'));
  const total = Number((D.totals || {}).total || 0);
  const upi = O.upi || {}; const uri = 'upi://pay?pa=' + encodeURIComponent(upi.id) + '&pn=' + encodeURIComponent(upi.name || 'AUZslab') + '&am=' + total.toFixed(2) + '&cu=INR&tn=' + encodeURIComponent('AUZslab ' + (D.business_name || ''));
  $('body').innerHTML = `<div class="pay-grid"><div class="pay-col">
  <div class="card"><div class="label">Your bill</div>${billHtml(D)}</div>
  <div class="card"><div class="label">Good to know</div><ul class="next-list"><li><b>1</b><span>Tick the box to agree to the terms.</span></li><li><b>2</b><span>Pay ${inr(total)} online.</span></li><li><b>3</b><span>Your bill and access arrive as soon as it is confirmed.</span></li></ul></div>
  </div>
  <div class="pay-col pay-side">
  <div class="card"><div class="label">Terms, privacy and refunds</div>
    <div class="terms-box" id="termsBox">${termsHtml()}</div>
    <p class="pay-note"><a href="terms.html" target="_blank" rel="noopener" style="color:var(--accent)">Terms &amp; conditions</a> &middot; <a href="privacy.html" target="_blank" rel="noopener" style="color:var(--accent)">Privacy policy</a> &middot; <a href="refund.html" target="_blank" rel="noopener" style="color:var(--accent)">Refund policy</a></p>
    <label class="chk"><input type="checkbox" id="agree" ${submitted ? 'checked' : ''}><span>I have read and I agree to the Terms &amp; Conditions, Privacy Policy and Refund Policy.</span></label>
  </div>

  ${PAYCFG.enabled ? `<div class="card" style="text-align:center"><div class="label" style="justify-content:center">Pay online</div>
    <p class="pay-note" style="margin:6px 0 12px">Cards, UPI and net banking, secured by Razorpay. Your bill is created automatically as soon as the payment goes through.</p>
    <button class="btn btn-primary form-submit" id="payOnline" type="button">Pay ${inr(total)} online</button>
    <div class="err" id="onErr"></div>
  </div>` : ''}
  ${PAYCFG.enabled ? '' : `<div class="card upi-card" id="payCard"><div class="label" style="justify-content:center">Pay ${inr(total)}</div>
    <img id="qr" alt="UPI QR code" width="200" height="200">
    <p class="pay-note" style="margin:0">Scan with any UPI app, or pay to <b>${esc(upi.id)}</b> (${esc(upi.name)}).</p>
    <a class="btn btn-ghost" style="margin-top:10px" href="${esc(uri)}" id="upiOpen">Open my UPI app</a>
    ${bankHtml() ? `<div style="text-align:left;margin-top:14px"><div class="label">Or pay by bank transfer</div>${bankHtml()}</div>` : ''}
    <div class="field" style="text-align:left;margin-top:16px"><label for="shot">Screenshot of your payment *</label><input id="shot" type="file" accept="image/*,application/pdf"></div>
    <div class="field" style="text-align:left"><label for="utr">UTR / reference number <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="utr" inputmode="numeric" autocomplete="off" placeholder="12-digit number from your UPI app" value="${esc(D.payment.utr || '')}"></div>
    <button class="btn btn-primary form-submit" id="send" type="button">${submitted ? 'Send again' : 'I have paid: send screenshot'}</button>
    <div class="err" id="err"></div>
    ${D.payment.proof ? '<p class="pay-note">We already have a screenshot from you.</p>' : ''}
  </div>`}
  </div></div>`;
  if (!PAYCFG.enabled) {
    try { const q = qrcode(0, 'M'); q.addData(uri); q.make(); $('qr').src = q.createDataURL(5, 2); } catch (e) { $('qr').style.display = 'none'; }
    $('send').onclick = send;
  }
  if ($('payOnline')) $('payOnline').onclick = payOnline;
}

function loadCheckout() {
  return new Promise((resolve, reject) => {
    if (window.Razorpay) return resolve();
    const el = document.createElement('script'); el.src = 'https://checkout.razorpay.com/v1/checkout.js';
    el.onload = () => resolve(); el.onerror = () => reject(new Error('Could not load the payment window. Check your connection and try again.'));
    document.head.appendChild(el);
  });
}
async function waitPaid() {
  const box = $('onErr'); const btn = $('payOnline');
  if (btn) { btn.disabled = true; btn.textContent = 'Confirming your payment...'; }
  for (let i = 0; i < 30; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const { data } = await sb.rpc('public_client_order', { p_token: TOKEN });
    if (data && data.status === 'paid') { D = data; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  }
  if (box) box.textContent = 'Your payment is being confirmed. This can take a minute. You will get your bill on WhatsApp; you can also refresh this page.';
}
async function payOnline() {
  const err = $('onErr'); err.textContent = '';
  if (!$('agree').checked) { err.textContent = 'Please tick the box to accept the terms, privacy policy and refund policy.'; $('agree').scrollIntoView({ block: 'center' }); return; }
  const btn = $('payOnline'); const old = btn.textContent; btn.disabled = true; btn.textContent = 'Opening...';
  try {
    const r = await fetch(CFG.url + '/payments/order/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN, terms: true }) });
    const o = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(o.error || 'Could not start the payment.');
    await loadCheckout();
    const rz = new window.Razorpay({
      key: o.keyId, amount: o.amount, currency: o.currency, order_id: o.orderId, name: 'AUZslab', description: o.description,
      prefill: o.prefill, theme: { color: '#800020' },
      handler: () => { waitPaid(); },
      modal: { ondismiss: () => { btn.disabled = false; btn.textContent = old; } },
    });
    rz.on('payment.failed', (resp) => { err.textContent = (resp && resp.error && resp.error.description) || 'The payment did not go through. You can try again.'; btn.disabled = false; btn.textContent = old; });
    rz.open();
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = old; }
}

async function send() {
  const err = $('err'); err.textContent = '';
  if (!$('agree').checked) { err.textContent = 'Please tick the box to accept the terms, privacy policy and refund policy.'; $('agree').scrollIntoView({ block: 'center' }); return; }
  const file = $('shot').files[0];
  if (!file && !D.payment.proof) { err.textContent = 'Please choose the screenshot of your payment.'; return; }
  const btn = $('send'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Sending...';
  try {
    if (file) {
      // auto-compress on the device before it ever leaves (window.auzCompressImage, from sb-client.js) -- a
      // PDF or an already-small file passes through unchanged; a phone photo is shrunk to a smaller JPEG
      const toSend = window.auzCompressImage ? await window.auzCompressImage(file) : file;
      if (toSend.size > 5_500_000) { throw new Error('That file is too big (5 MB at most, even after compressing). Please send a smaller screenshot.'); }
      const buf = await toSend.arrayBuffer();
      const r = await fetch(CFG.url + '/storage/order-proof/' + encodeURIComponent(TOKEN), { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: buf });
      if (!r.ok) { let m = 'The screenshot could not be sent.'; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
    }
    const { error } = await sb.rpc('public_order_submit_payment', { p_token: TOKEN, p_utr: $('utr').value.trim(), p_terms: true });
    if (error) throw new Error(error.message);
    await load();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = old; }
}

async function load() {
  if (!/^[a-f0-9]{32}$/.test(TOKEN)) { setHead('Payment link', 'This link is not valid.', 'Please use the link we sent you on WhatsApp, or send a new request from the cart.'); setSteps('x'); stateBody('bad', 'This link does not look right', 'It may have been cut short when copied. Open the original message and tap the link again.'); return; }
  const { data, error } = await sb.rpc('public_client_order', { p_token: TOKEN });
  if (error || !data) { setHead('Payment link', 'We could not find this request.', 'Please check the link we sent you on WhatsApp.'); setSteps('x'); stateBody('bad', 'No request found for this link', 'The request may have been removed, or the link is from an older message.'); return; }
  try { const c = await fetch(CFG.url + '/payments/config'); if (c.ok) PAYCFG = await c.json(); } catch (e) {}
  D = data; render();
}
load();
</script>
<button type="button" class="theme-fab" onclick="auzThemeToggle()" aria-label="Toggle dark mode" title="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
