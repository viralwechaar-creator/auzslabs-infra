services:
  # ---- Reverse proxy: serves both static sites + the API + handles
  # HTTPS automatically. The marketing site (./site) answers the root
  # domain; the POS app (./app/public) answers every client subdomain;
  # api.$DOMAIN reverse-proxies to the api service; /uploads is this
  # project's own file storage (see server/src/storage.js), served
  # directly and publicly from the same volume the api container writes
  # to. Routing lives in the Caddyfile. ----
  caddy:
    build: ./caddy   # stock caddy + the GoDaddy DNS plugin (needed for the wildcard cert's DNS-01 challenge) -- see caddy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./app/public:/srv/app:ro
      - uploads_data:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---- Database: plain Postgres, no Supabase/managed-vendor software.
  # Auth, file storage and realtime sync are this project's own code
  # against this database, not a Supabase feature -- see db/ for schema. ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # schema files here auto-run on first boot only
    expose:
      - "5432"

  # ---- This project's own API: auth, the data API, RPC endpoints,
  # file uploads, realtime (WebSocket + Postgres LISTEN/NOTIFY) and Web
  # Push -- everything Supabase used to provide, now plain code against
  # plain Postgres. Connects as the "app" role (db/000b_create_app_role.sh),
  # never POSTGRES_USER -- see that file for why. ----
  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - uploads_data:/data/uploads
      # Employee documents (Aadhar/PAN/driving-licence) are private --
      # unlike uploads_data above, this volume is mounted into the api
      # container ONLY, never into caddy, so there is no static-file
      # path that can ever serve one of these out unauthenticated
      # (Caddy has no filesystem access to it at all). Every read goes
      # through GET /storage/doc/... (server/src/index.js), which
      # checks the caller's own session before touching disk.
      - private_uploads_data:/data/private-uploads
    expose:
      - "3000"
    depends_on:
      - postgres

  # ---- Automated nightly backups, kept locally in ./backups ----
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS}
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres

  # ---- Off-site copy of the Postgres backups + uploaded files, so a
  # lost/corrupted VPS doesn't also mean losing every backup that was
  # ONLY ever kept on that same disk (both ./backups and uploads_data
  # live here alone otherwise). Backblaze B2's free tier (10GB
  # storage, uploads always free) comfortably covers this project's
  # actual backup size -- see .env.example for how to get the 3
  # required values. Syncs once at container start, then every 24h;
  # `rclone sync` is one-directional (local -> B2) and mirrors
  # deletions too, so a file removed locally is removed off-site on
  # the next sync rather than piling up forever. ----
  offsite-backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY}
    volumes:
      - ./backups:/data/backups:ro
      - uploads_data:/data/uploads:ro
      - private_uploads_data:/data/private-uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          echo "[$$(date -Iseconds)] offsite-backup: syncing ./backups";
          rclone sync /data/backups B2:$$B2_BUCKET/backups --log-level INFO;
          echo "[$$(date -Iseconds)] offsite-backup: syncing uploads";
          rclone sync /data/uploads B2:$$B2_BUCKET/uploads --log-level INFO;
          echo "[$$(date -Iseconds)] offsite-backup: syncing private uploads";
          rclone sync /data/private-uploads B2:$$B2_BUCKET/private-uploads --log-level INFO;
          echo "[$$(date -Iseconds)] offsite-backup: done, sleeping 24h";
          sleep 86400;
        done
    depends_on:
      - backup

  # ---- "Is it alive" dashboard + alerting ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    expose:
      - "3001"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
  uploads_data:
  private_uploads_data:
