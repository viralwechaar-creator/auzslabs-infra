services:
  # ---- Reverse proxy: serves both static sites + handles HTTPS automatically ----
  # No app container needed for either — everything here is plain static
  # files with no build step. The marketing site (./site) answers the root
  # domain; the POS app (./app/public) answers every client subdomain; and
  # api.$DOMAIN reverse-proxies into the self-hosted Supabase stack's own
  # gateway (a separate `docker compose` project, brought up first — see
  # the setup steps for this repo). Routing between all three lives in
  # the Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./app/public:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - supabase_default

  # ---- Automated nightly backups of the self-hosted Supabase Postgres,
  # kept locally in ./backups. Runs against the *Supabase* stack's db
  # service (container name supabase-db), not a database of our own. ----
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: supabase-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS}
    volumes:
      - ./backups:/backups
    networks:
      - supabase_default

  # ---- "Is it alive" dashboard + alerting ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    expose:
      - "3001"

networks:
  # Created by the Supabase stack's own compose project (name: supabase in
  # its docker-compose.yml -> network "supabase_default"). Bring that stack
  # up first, then this one, or this fails with "network not found".
  supabase_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
