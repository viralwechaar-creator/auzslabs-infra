.acct-table th{text-align:left;padding:10px 12px;background:var(--bg-raised);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);border-bottom:2px solid var(--ink)}
.acct-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.acct-table tr:last-child td{border-bottom:none}
.acct-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--bg-raised);border:1px solid var(--ink);border-radius:999px;transition:.15s;cursor:pointer}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:2px;top:2px;background:#fff;border:1px solid var(--ink);border-radius:50%;transition:.15s}
input:checked+.slider{background:var(--accent);border-color:var(--accent)}
input:checked+.slider:before{transform:translateX(18px);border-color:var(--accent)}
input:disabled+.slider{opacity:.4;cursor:default}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.perm-grid label{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--bg-raised);border-radius:8px;padding:7px 10px}
.notif{padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:none}
.notif.unread{background:var(--bg-raised);margin:0 -18px;padding:12px 18px;border-radius:8px}
.notif b{display:block;font-size:14px}

.section-pane{display:none}
.section-pane.on{display:block}
.pos-link-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg-raised);border:1px solid var(--ink);border-radius:14px;padding:12px 14px;margin-top:8px}

<script>
const sb = supabase.createClient(CFG.url, CFG.key);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PERM_KEYS = [['pos','Sell (POS)'],['orders','Orders'],['kitchen','Kitchen Display'],['reports','Reports'],['staff','Staff (view)'],['inventory','Stock'],['crm','Customers'],['menu','Menu'],['settings','Business Settings'],['billing','Billing / Refunds'],['acc_view','Accounting: view'],['acc_sales','Accounting: sales and receipts'],['acc_purchase','Accounting: purchases and payments'],['acc_inventory','Accounting: products and stock'],['acc_banking','Accounting: banking'],['acc_post','Accounting: journals and assets'],['acc_approve','Accounting: approve documents'],['acc_cancel','Accounting: cancel and reverse'],['acc_reports','Accounting: reports and GST'],['acc_import','Accounting: import'],['acc_admin','Accounting: settings'],['acc_audit','Accounting: audit log'],['pay_view','Payroll: view people'],['pay_people','Payroll: add and edit people'],['pay_time','Payroll: attendance and leave'],['pay_salary','Payroll: salaries and bank details'],['pay_run','Payroll: calculate payroll'],['pay_approve','Payroll: approve payroll'],['pay_pay','Payroll: pay salaries'],['pay_reports','Payroll: reports'],['pay_admin','Payroll: settings'],['pay_audit','Payroll: change history'],['mob_view','AUZsMob: view'],['mob_sell','AUZsMob: sell'],['mob_purchase','AUZsMob: purchase / buy used'],['mob_repair','AUZsMob: repairs'],['mob_reports','AUZsMob: reports (see all staff data)'],['mob_manage','AUZsMob: catalog, vendors, settings, void, adjust']];

let DASH = null, ROLES = [], STAFF = [], NOTIFS = [], SESSIONS = [];

// A role's permission checklist should only ever offer what this business
// actually owns -- a mobile-only client's "Create a role" used to list every
// POS/Accounting/Payroll permission in the product too, which both confused
// owners (that software was never theirs) and let them grant access to
// something the server would refuse anyway (every *_guard() function still
// checks the tenant's own feature entitlement independently -- this is a
// display-only fix, not a new access boundary).
function permKeyGroup(k) {
  if (k.startsWith('acc_')) return 'accounting';
  if (k.startsWith('pay_')) return 'payroll';
  if (k.startsWith('mob_')) return 'mobile';
  return 'pos';
}
function visiblePermKeys() {
  const f = DASH.features || {}, e = DASH.enabled_features || {};
  const on = (k) => f[k] === true && e[k] !== false;
  return PERM_KEYS.filter(([k]) => {
    const g = permKeyGroup(k);
    if (g === 'accounting') return on('accounting');
    if (g === 'payroll') return on('payroll');
    if (g === 'mobile') return on('mobile');
    return on('pos');
  });
}

const PRODUCT_CHOICES = [['pos', 'AUZsPOS (billing, kitchen, stock, customers)'], ['self_order', 'AUZsPOS QR (table QR ordering)'], ['payroll', 'AUZsPay (attendance and payroll)'], ['accounting', 'AUZsLedger (accounting and GST)'], ['mobile', 'AUZsMob (mobile shop)'], ['salon', 'AUZslab Salon (booking, billing, website)'], ['website_builder', 'Website Builder'], ['whatsapp', 'WhatsApp automation (add-on)'], ['aggregators', 'Zomato / Swiggy orders (add-on)'], ['custom', 'Custom software']];
const BIZ_TYPES = ['Cafe / restaurant / bar', 'Salon / spa', 'Retail shop', 'Clothing / boutique', 'Mobile phone shop', 'Office / services', 'Other'];
const START_WHEN = [['', 'Choose'], ['now', 'As soon as possible'], ['month', 'Within a month'], ['quarter', 'In 2 to 3 months'], ['exploring', 'Just exploring']];
let PROFILE = null, LOGIN_EMAIL = '';

async function loadProfile() {
  const { data } = await sb.rpc('my_profile');
  LOGIN_EMAIL = (data && data.login_email) || ''; PROFILE = (data && data.profile) || {};
}

function renderProfile() {
  const P = PROFILE || {}, chosen = new Set(Array.isArray(P.products) ? P.products : []);
  const opt = (arr, v) => arr.map((x) => { const val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x; return `<option value="${esc(val)}" ${String(v || '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');
  $('#pane-profile').innerHTML = `
    <div class="card">
      <h3 class="h-2">Your profile</h3>
      <p class="muted">Tell us about you and your business. This helps us suggest the right products and get back to you with the right plan.</p>
      <div class="field"><label>Full name *</label><input id="pfName" value="${esc(P.name)}" autocomplete="name"></div>
      <div class="field"><label>Phone number *</label><input id="pfPhone" type="tel" value="${esc(P.phone)}" autocomplete="tel" placeholder="9876543210"></div>
      <div class="field"><label>Login email</label><input value="${esc(LOGIN_EMAIL)}" disabled></div>
      <div class="field"><label>Contact email (if different)</label><input id="pfEmail" type="email" value="${esc(P.contact_email)}" placeholder="optional"></div>
      <div class="field"><label>Business name</label><input id="pfBiz" value="${esc(P.business_name || (DASH && DASH.tenant && DASH.tenant.name) || '')}"></div>
      <div class="field"><label>Business type</label><select id="pfType"><option value="">Choose</option>${opt(BIZ_TYPES, P.business_type)}</select></div>
      <div class="field"><label>Niche (what exactly do you do or sell?)</label><input id="pfNiche" value="${esc(P.niche)}" placeholder="e.g. unisex salon, bakery, mobile repair"></div>
      <div class="field"><label>City</label><input id="pfCity" value="${esc(P.city)}"></div>
      <div class="field wide"><label>Address (optional)</label><textarea id="pfAddr" rows="2">${esc(P.address)}</textarea></div>
      <div class="field"><label>Number of outlets</label><input id="pfOutlets" type="number" min="0" value="${P.outlets == null ? '' : esc(P.outlets)}"></div>
      <div class="field"><label>Number of staff</label><input id="pfStaff" type="number" min="0" value="${P.staff_count == null ? '' : esc(P.staff_count)}"></div>
      <div class="field wide"><label>Products you need</label>
        <div id="pfProducts">${PRODUCT_CHOICES.map(([k, l]) => `<label style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-weight:400"><input type="checkbox" value="${esc(k)}" ${chosen.has(k) ? 'checked' : ''} style="width:18px;height:18px;margin-top:2px"> <span>${esc(l)}</span></label>`).join('')}</div></div>
      <div class="field"><label>Software you use today (if any)</label><input id="pfCurrent" value="${esc(P.current_software)}" placeholder="e.g. PetPooja, Tally, a notebook"></div>
      <div class="field"><label>When do you want to start?</label><select id="pfWhen">${opt(START_WHEN, P.start_when)}</select></div>
      <div class="field wide"><label>Anything else we should know</label><textarea id="pfNotes" rows="3">${esc(P.notes)}</textarea></div>
      <button class="btn btn-primary form-submit" id="pfSave" style="margin-top:12px">Save profile</button>
      <a href="cart.html" class="btn btn-ghost form-submit" style="margin-top:8px">Go to my cart</a>
      <div id="pfMsg" class="muted" style="margin-top:10px"></div>
    </div>`;
  $('#pfSave').onclick = async () => {
    const btn = $('#pfSave'), msg = $('#pfMsg'); msg.textContent = '';
    const body = { name: $('#pfName').value, phone: $('#pfPhone').value, contact_email: $('#pfEmail').value, business_name: $('#pfBiz').value, business_type: $('#pfType').value, niche: $('#pfNiche').value,
      city: $('#pfCity').value, address: $('#pfAddr').value, outlets: $('#pfOutlets').value, staff_count: $('#pfStaff').value, current_software: $('#pfCurrent').value, start_when: $('#pfWhen').value, notes: $('#pfNotes').value,
      products: [...document.querySelectorAll('#pfProducts input:checked')].map((i) => i.value) };
    btn.disabled = true;
    const { error } = await sb.rpc('save_my_profile', { p: body });
    btn.disabled = false;
    if (error) { msg.textContent = error.message; msg.style.color = 'var(--accent)'; return; }
    PROFILE = { ...body, outlets: body.outlets === '' ? null : Number(body.outlets), staff_count: body.staff_count === '' ? null : Number(body.staff_count) };
    msg.style.color = ''; msg.textContent = 'Saved. Thank you!';
  };
}

async function bootProspect(session) {
  $('#signOutBtn').onclick = async () => { await sb.auth.signOut(); window.location.href = 'signup.html'; };
  document.querySelectorAll('.tenant-only').forEach((e) => { e.style.display = 'none'; });
  $('#pageTitle').textContent = 'Welcome';
  $('#pageLede').textContent = 'Complete your profile and review your cart.';
  $('#tabsSection').style.display = 'block'; $('#acctNav').style.display = 'flex';
  await loadProfile();
  const n = (window.AUZcart && AUZcart.get().length) || 0; $('#cartNavCount').textContent = n ? ' (' + n + ')' : '';
  document.querySelectorAll('.acct-nav-btn').forEach((b) => { b.onclick = () => { showTab(b.dataset.tab); const d = $('#sidebarDrawer'); if (d) d.classList.remove('open'); const o = $('#drawerOverlay'); if (o) o.classList.remove('open'); }; });
  showTab('profile');
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'signup.html'; return; }
  const { data, error } = await sb.rpc('my_dashboard');
  if (error) {
    // A login that no longer exists (account removed) or an expired session: clear it and start again at sign-in,
    // instead of leaving a dead page. Sign out always works, even when the account could not load.
    $('#signOutBtn').onclick = async () => { await sb.auth.signOut(); window.location.href = 'signup.html'; };
    if (error.status === 401 || /authentication required|not a tenant member/i.test(error.message || '')) {
      // A signed-in person with no business yet gets "authentication required" here too (they have no staff record),
      // so ask a function that only needs the login: if it works, they are a new customer, not a dead session.
      const probe = await sb.rpc('my_profile');
      if (!probe.error) return bootProspect(session);
      if (error.status === 401 || /authentication required/i.test(error.message || '')) { await sb.auth.signOut(); window.location.href = 'signup.html'; return; }
      // signed in but no business yet: a new customer. They get the lighter dashboard: profile and cart.
      return bootProspect(session);
    }
    $('#pageTitle').textContent = 'Could not load your account';
    $('#pageLede').textContent = error.message;
    return;
  }
  DASH = data;
  $('#pageTitle').textContent = DASH.tenant.name;
  $('#pageLede').textContent = 'Manage your account, services, staff, and notifications.';
  $('#tabsSection').style.display = 'block';
  $('#acctNav').style.display = 'flex';
  if (DASH.my_role === 'owner') { $('#tabStaffBtn').style.display = ''; $('#tabRolesBtn').style.display = ''; }
  // Salon tenants run AUZslab Salon (app/public/salon/), not the POS -- its
  // staff/owner console lives at /salon/admin/. Everyone else only gets this
  // link when they actually have the pos feature -- it used to show
  // unconditionally for every tenant, including e.g. a mobile-shop-only
  // client with no POS entitlement at all.
  const posOn = (DASH.features || {}).pos === true && (DASH.enabled_features || {}).pos !== false;
  if (DASH.tenant.niche === 'salon') {
    $('#openPosLabel').textContent = 'Open AUZslab Salon';
    $('#openPosLink').style.display = '';
    $('#openPosLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/salon/admin/';
  } else if (posOn) {
    $('#openPosLink').style.display = '';
    $('#openPosLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in';
  }
  // A salon that added the POS product keeps AUZslab Salon as its main app; the POS is a second link.
  if (DASH.tenant.niche === 'salon' && posOn) {
    $('#openPosAddonLink').style.display = ''; $('#openPosAddonLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/index.html';
  }
  const payrollOn = (DASH.features || {}).payroll === true && (DASH.enabled_features || {}).payroll !== false;
  if (payrollOn) { $('#openPayrollLink').style.display = ''; $('#openPayrollLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/payroll.html'; }
  const builderOn = (DASH.features || {}).website_builder === true && (DASH.enabled_features || {}).website_builder !== false;
  if (builderOn) { $('#openBuilderLink').style.display = ''; $('#openBuilderLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/builder.html'; }
  const accountingOn = (DASH.features || {}).accounting === true && (DASH.enabled_features || {}).accounting !== false;
  if (accountingOn) { $('#openAccountsLink').style.display = ''; $('#openAccountsLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/accounts.html'; }
  const mobileOn = (DASH.features || {}).mobile === true && (DASH.enabled_features || {}).mobile !== false;
  if (mobileOn) { $('#openMobLink').style.display = ''; $('#openMobLink').href = 'https://' + DASH.tenant.slug + '.auzslab.in/mob.html'; }

  await loadRoles();
  if (DASH.my_role === 'owner') await loadStaff();
  await loadNotifications();
  await loadSessions();
  await loadProfile();
  { const n = (window.AUZcart && AUZcart.get().length) || 0; $('#cartNavCount').textContent = n ? ' (' + n + ')' : ''; }

  document.querySelectorAll('.acct-nav-btn').forEach((b) => {
    b.onclick = () => {
      showTab(b.dataset.tab);
      const drawer = document.getElementById('sidebarDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const toggle = document.getElementById('menuToggle');
      if (drawer) drawer.classList.remove('open');
      if (overlay) overlay.classList.remove('open');
      if (toggle) toggle.classList.remove('is-open');
    };
  });
  const hashTab = { '#notifications': 'notifications', '#staff': 'staff', '#roles': 'roles', '#profile': 'profile' }[location.hash];
  showTab(hashTab && document.getElementById('pane-' + hashTab) ? hashTab : 'account');
  setInterval(async () => { await loadNotifications(); if ($('#pane-notifications').classList.contains('on')) renderNotifications(); }, 20000);

  $('#signOutBtn').onclick = async () => {
    await sb.auth.signOut();
    window.location.href = 'signup.html';
  };
}

function showTab(tab) {
  document.querySelectorAll('.acct-nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.section-pane').forEach((s) => s.classList.remove('on'));
  $('#pane-' + tab).classList.add('on');
  if (tab === 'profile') renderProfile();
  if (tab === 'account') renderAccount();
  if (tab === 'services') renderServices();
  if (tab === 'staff') renderStaff();
  if (tab === 'roles') renderRoles();
  if (tab === 'notifications') renderNotifications();
}

// Products the marketing site (products.html) actually sells are POS,
// Payroll and Website Builder -- everything else (CRM, billing,
// inventory, QR ordering, kitchen display, reports, bookings,
// expenses, and the 4 newer ERP modules) are add-ons/sub-features of
// the POS line, not separate products. The flat, alphabetical-ish list
// this rendered before didn't match that mental model at all -- group
// it the same way the products actually get sold.
// Salon tenants: AUZslab Salon is the base product; everything else is an
// add-on they can request from the products page.
const SALON_SERVICE_GROUPS = [
  ['AUZslab Salon', ['salon', 'booking', 'crm', 'billing', 'expenses', 'membership', 'helpdesk', 'tasks']],
  ['AUZsPOS', ['pos', 'self_order', 'inventory', 'kds', 'reports', 'purchases']],
  ['AUZsPay', ['payroll']],
  ['Website Builder', ['website_builder']],
  ['AUZsLedger', ['accounting']],
  ['AUZsMob', ['mobile']],
];
const SERVICE_GROUPS = [
  ['AUZsPOS', ['pos', 'self_order', 'inventory', 'crm', 'kds', 'billing', 'reports', 'booking', 'expenses', 'membership', 'helpdesk', 'tasks', 'purchases']],
  ['AUZsPay', ['payroll']],
  ['Website Builder', ['website_builder']],
  ['AUZsLedger', ['accounting']],
  ['AUZsMob', ['mobile']],
];
function renderServices() {
  const entitled = DASH.features || {}, enabled = DASH.enabled_features || {};
  const keys = Object.keys(entitled).filter((k) => entitled[k] === true);
  const isOwner = DASH.my_role === 'owner';
  const builderOn = entitled.website_builder === true;
  // The Website Builder's own editor (builder.html) always shows the same
  // link per-page, but a non-technical owner won't necessarily go looking
  // there -- surface the site's home page here too, where "your services"
  // already lives. Visitors never see the builder or its draft blocks,
  // only /w.html?page=... (see w.html + public_page RPC) -- your bare
  // subdomain root is the staff POS app, not this site.
  const siteUrl = 'https://' + DASH.tenant.slug + '.auzslab.in/w.html?page=home';
  $('#pane-services').innerHTML = `
    ${builderOn ? `<div class="card">
      <h3 class="h-2">Your website</h3>
      <p class="muted">Built with Website Builder. This is the link to give customers — your subdomain's own home page is your staff POS app, not this.</p>
      <div class="acct-row"><span style="font-family:monospace;font-size:13px;word-break:break-all">${esc(siteUrl)}</span></div>
    </div>` : ''}
    <div class="card">
      <h3 class="h-2">Your subscribed services</h3>
      <p class="muted">${isOwner ? 'Turn any of these off temporarily — turning one back on takes effect instantly, no need to contact us.' : 'Only the business owner can change these.'}</p>
      ${keys.length ? (DASH.tenant.niche === 'salon' ? SALON_SERVICE_GROUPS : SERVICE_GROUPS).map(([label, groupKeys]) => {
        const rows = groupKeys.filter((k) => keys.includes(k));
        if (!rows.length) return '';
        // One switch per product line, not per underlying flag -- flipping
        // "POS" off disables every sub-feature (CRM/billing/inventory/QR/
        // KDS/reports/etc.) at once for this tenant. The individual flags
        // still exist and still gate independently everywhere in the app
        // (featureOn() per key) -- this is just the one control surface an
        // owner gets; a client needing just one piece split out is an
        // admin.html job (the per-feature checkboxes there still exist).
        const allOn = rows.every((k) => enabled[k] !== false);
        return `<div class="acct-row">
          <span>${esc(label)}</span>
          <label class="switch"><input type="checkbox" data-feat-group="${esc(rows.join(','))}" ${allOn ? 'checked' : ''} ${isOwner ? '' : 'disabled'}><span class="slider"></span></label>
        </div>`;
      }).join('') : '<p class="muted">No services on your subscription yet — contact AUZslab.</p>'}
      <div id="svcMsg"></div>
    </div>
    ${isOwner ? `<div class="card">
      <h3 class="h-2">Add more products</h3>
      <p class="muted">${DASH.tenant.niche === 'salon' ? 'Payroll, Website Builder, POS and inventory all work alongside AUZslab Salon.' : 'Add Payroll, Website Builder or any other product to your account.'} Pick what you want and send the request &mdash; we'll switch it on and notify you here.</p>
      <a href="products.html" class="btn btn-primary form-submit" style="margin-top:12px">Browse products</a>
    </div>` : ''}
  `;
  if (isOwner) {
    document.querySelectorAll('[data-feat-group]').forEach((cb) => {
      cb.onchange = async () => {
        const map = {};
        document.querySelectorAll('[data-feat-group]').forEach((x) => {
          x.dataset.featGroup.split(',').forEach((k) => { map[k] = x.checked; });
        });
        const msg = $('#svcMsg');
        const { error } = await sb.rpc('update_my_features', { p_enabled: map });
        if (error) { msg.className = 'err'; msg.textContent = error.message; return; }
        msg.className = 'ok-box'; msg.textContent = 'Saved.';
        DASH.enabled_features = map;
        setTimeout(() => { if (msg) { msg.textContent = ''; msg.className = ''; } }, 2000);
      };
    });
  }
}

  const { data } = await sb.from('profiles').select('*').order('email');
  STAFF = data || [];
}

      ${payrollOn ? `<p class="muted" style="margin-top:12px;font-size:12.5px">This creates their login only. For Payroll self-service (attendance, leave, payslips), also add them under <a href="https://${esc(DASH.tenant.slug)}.auzslab.in/payroll.html" target="_blank" style="color:inherit;text-decoration:underline">Payroll → Employees</a>, entering this same email there.</p>` : ''}
    </div>
    <div class="card">
      <h3 class="h-2">Current staff</h3>
      ${STAFF.map((p) => `
        <div class="acct-row">
          <span>
            <b>${esc(p.name || p.email)}</b><br>
            <span class="muted">${p.username ? 'Username: <b>' + esc(p.username) + '</b>' + (p.login_off ? ' · <b>login off</b>' : '') + (p.outlet_id ? ' · outlet ' + esc(p.outlet_id) : '') : esc(p.email)}${p.phone ? ' · ' + esc(p.phone) : ''}</span>
          </span>
          ${p.role === 'owner' ? '<span class="status-pill">owner</span>' : `
            <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <select data-role="${p.id}" style="max-width:150px">
                <option value="" ${!p.role_id && p.role !== 'manager' ? 'selected' : ''}>Staff (everyday access)</option><option value="builtin:manager" ${!p.role_id && p.role === 'manager' ? 'selected' : ''}>Manager</option>
                ${ROLES.map((r) => `<option value="${r.id}" ${p.role_id === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
              </select>
              ${p.username
                ? `<button class="btn btn-ghost" data-reset-pin="${p.id}" data-user="${esc(p.username)}">Reset PIN</button><button class="btn btn-ghost" data-toggle-login="${p.id}" data-off="${p.login_off ? '1' : ''}">${p.login_off ? 'Turn on' : 'Turn off'}</button>`
                : `<button class="btn btn-ghost" data-reset-pw="${p.id}" data-email="${esc(p.email)}">Set/reset password</button>`}
              <button class="btn btn-ghost" data-remove="${p.id}">Remove</button>
            </span>
          `}
        </div>
      `).join('')}
    </div>
  `;
  $('#stAdd').onclick = async () => {
    const name = $('#stName').value.trim(), phone = $('#stPhone').value.trim(), email = $('#stEmail').value.trim(), roleId = $('#stRole').value, msg = $('#stMsg');
    msg.className = ''; msg.textContent = '';
    if ($('#stMethod').value === 'pin') {
      if (!name) { msg.className = 'err'; msg.textContent = 'Enter their name.'; return; }
      const { data: d, error: e2 } = await sb.rpc('staff_create', { p_name: name, p_phone: phone, p_role_id: /^[0-9a-f-]{36}$/.test(roleId) ? roleId : null, p_builtin: roleId === 'builtin:manager' ? 'manager' : null, p_outlet: $('#stOutlet').value || null });
      if (e2) { msg.className = 'err'; msg.textContent = e2.message; return; }
      msg.className = 'ok-box';
      msg.innerHTML = `Added. Give them these to sign in (they do not need an email):<br><br>Username: <b>${esc(d.username)}</b><br>PIN: <b>${esc(d.pin)}</b><br><br>They open the app, tap <b>Staff</b>, and type the username and PIN. Write the PIN down now: you can see it only this once, but you can reset it any time.`;
      $('#stName').value = ''; $('#stPhone').value = '';
      await loadStaff(); renderStaff(); $('#stMsg').className = 'ok-box'; $('#stMsg').innerHTML = msg.innerHTML;
      return;
    }
    if (!email) { msg.className = 'err'; msg.textContent = 'Enter their email.'; return; }
    if (!name) { msg.className = 'err'; msg.textContent = 'Name and email are required.'; return; }
    const { data, error } = await sb.rpc('invite_staff', { p_email: email, p_name: name, p_phone: phone, p_role_id: /^[0-9a-f-]{36}$/.test(roleId) ? roleId : null, p_builtin: roleId === 'builtin:manager' ? 'manager' : null });
    if (error) { msg.className = 'err'; msg.textContent = error.message; return; }
    const verifyLink = 'https://' + DASH.tenant.slug + '.auzslab.in/verify.html?token=' + data.verify_token;
    let emailSent = false;
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(CFG.url + '/staff/send-invite-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ email, name, verify_link: verifyLink }),
      });
      const body = await res.json();
      emailSent = res.ok && body.sent;
    } catch {}
    msg.className = 'ok-box';
    msg.innerHTML = `Added. Share this temporary password with them directly:<br><b>${esc(email)}</b> / <b>${esc(data.temp_password)}</b><br><br>` +
      (emailSent
        ? `They can't sign in until they confirm their email — we've sent a verification link to <b>${esc(email)}</b>.`
        : `They can't sign in until this link is opened — <b>the verification email couldn't be sent</b>, so share this link with them directly too:<br><a href="${esc(verifyLink)}" target="_blank" style="word-break:break-all">${esc(verifyLink)}</a>`);
    $('#stName').value = ''; $('#stPhone').value = ''; $('#stEmail').value = '';
    await loadStaff(); renderStaff();
  };
  $('#stMethod').onchange = () => { $('#stEmailWrap').style.display = $('#stMethod').value === 'email' ? '' : 'none'; };
  (async () => {
    try {
      const { data: outs } = await sb.from('records').select('id,data').eq('kind', 'outlet');
      const list = (outs || []).map((r) => ({ id: r.id, name: (r.data && (r.data.name || r.data.n)) || r.id }));
      if (list.length) { $('#stOutlet').innerHTML = '<option value="">Main outlet</option>' + list.map((o) => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join(''); $('#stOutletWrap').style.display = ''; }
    } catch {}
  })();
  document.querySelectorAll('[data-reset-pin]').forEach((btn) => {
    btn.onclick = async () => {
      const typed = prompt(`New PIN for ${btn.dataset.user}: type 4 digits (6 for managers), or leave blank to make a random one.`);
      if (typed === null) return;
      const { data, error } = await sb.rpc('staff_reset_pin', { p_staff_id: btn.dataset.resetPin, p_pin: typed.trim() || null });
      if (error) { alert(error.message); return; }
      alert(`New PIN set. Give them:\n\nUsername: ${data.username}\nPIN: ${data.pin}`);
    };
  });
  document.querySelectorAll('[data-toggle-login]').forEach((btn) => {
    btn.onclick = async () => {
      const turnOn = btn.dataset.off === '1';
      if (!turnOn && !confirm('Turn this login off? They will not be able to sign in until you turn it on again.')) return;
      const { error } = await sb.rpc('staff_set_active', { p_staff_id: btn.dataset.toggleLogin, p_active: turnOn });
      if (error) { alert(error.message); return; }
      await loadStaff(); renderStaff();
    };
  });
  document.querySelectorAll('[data-role]').forEach((sel) => {
    sel.onchange = async () => {
      const role = ROLES.find((r) => r.id === sel.value);
      const patch = role ? { role_id: role.id, role: role.name } : { role_id: null, role: sel.value === 'builtin:manager' ? 'manager' : 'cashier' };
      const { error } = await sb.from('profiles').update(patch).eq('id', sel.dataset.role);
      if (error) { alert(error.message); return; }
      await loadStaff();
    };
  });
  document.querySelectorAll('[data-remove]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm('Remove this staff member? They will no longer be able to sign in.')) return;
      const { error } = await sb.rpc('remove_staff', { p_staff_id: btn.dataset.remove });
      if (error) { alert(error.message); return; }
      await loadStaff(); renderStaff();
    };
  });
  document.querySelectorAll('[data-reset-pw]').forEach((btn) => {
    btn.onclick = async () => {
      const typed = prompt(`Set a new password for ${btn.dataset.email} (min 8 characters), or leave blank to generate a random one:`);
      if (typed === null) return; // cancelled
      const newPassword = typed.trim() || null;
      if (newPassword && newPassword.length < 8) { alert('Password must be at least 8 characters.'); return; }
      const { data, error } = await sb.rpc('reset_staff_password', { p_staff_id: btn.dataset.resetPw, p_new_password: newPassword });
      if (error) { alert(error.message); return; }
      alert(`Password set. Share these with them directly:\n\n${data.email} / ${data.temp_password}`);
    };
  });
}

async function loadRoles() {
  const { data } = await sb.from('roles').select('*').order('name');
  ROLES = data || [];
}
function renderRoles() {
  $('#pane-roles').innerHTML = `
    <div class="card">
      <h3 class="h-2">Create a role</h3>
      <div class="field"><label>Role name</label><input id="roleName" placeholder="e.g. Chef, Manager"></div>
      <p class="muted">Choose which parts of the system this role can see:</p>
      <div class="perm-grid">${visiblePermKeys().map(([k, l]) => `<label><input type="checkbox" data-perm="${k}"> ${esc(l)}</label>`).join('')}</div>
      <button class="btn btn-primary form-submit" id="roleAdd">Create role</button>
      <div id="roleMsg"></div>
    </div>
    <div class="card">
      <h3 class="h-2">Existing roles</h3>
      ${ROLES.length ? ROLES.map((r) => `
        <div class="acct-row" style="flex-direction:column;align-items:stretch">
          <div class="acct-row" style="border:none;padding:0 0 6px">
            <b>${esc(r.name)}</b>
            <button class="btn btn-ghost" data-delrole="${r.id}">Delete</button>
          </div>
          <div class="muted">${PERM_KEYS.filter(([k]) => r.permissions && r.permissions[k]).map(([, l]) => l).join(', ') || 'No access granted'}</div>
        </div>
      `).join('') : '<p class="muted">No custom roles yet.</p>'}
    </div>
  `;
  $('#roleAdd').onclick = async () => {
    const name = $('#roleName').value.trim(), msg = $('#roleMsg');
    msg.className = ''; msg.textContent = '';
    if (!name) { msg.className = 'err'; msg.textContent = 'Role name is required.'; return; }
    const perms = {}; document.querySelectorAll('[data-perm]').forEach((cb) => { if (cb.checked) perms[cb.dataset.perm] = true; });
    const { error } = await sb.from('roles').insert({ name, permissions: perms });
    if (error) { msg.className = 'err'; msg.textContent = error.message; return; }
    $('#roleName').value = '';
    await loadRoles(); renderRoles();
  };
  document.querySelectorAll('[data-delrole]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm('Delete this role? Any staff on it will lose their custom permissions until reassigned.')) return;
      const { error } = await sb.rpc('delete_role', { p_role_id: btn.dataset.delrole });
      if (error) { alert(error.message); return; }
      await loadRoles(); renderRoles();
    };
  });
}

async function loadSessions() {
  const { data } = await sb.auth.listSessions();
  SESSIONS = data || [];
}
async function loadNotifications() {
  const { data } = await sb.from('notifications').select('*').order('created_at');
  NOTIFS = (data || []).slice().reverse();
  const unread = NOTIFS.filter((n) => !n.read).length;
  const badge = $('#notifBadge');
  if (badge) badge.textContent = unread ? '(' + unread + ')' : '';
}
function renderNotifications() {
  $('#pane-notifications').innerHTML = `
    <div class="card">
      <h3 class="h-2">Notifications</h3>
      ${NOTIFS.length ? NOTIFS.map((n) => `
        <div class="notif ${n.read ? '' : 'unread'}" data-notif="${n.id}">
          <b>${esc(n.title)}</b>
          ${n.body ? `<div>${esc(n.body)}</div>` : ''}
          <div class="muted">${new Date(n.created_at).toLocaleString()}</div>
        </div>
      `).join('') : '<p class="muted">Nothing yet.</p>'}
    </div>
  `;
  document.querySelectorAll('[data-notif]').forEach((el) => {
    el.onclick = async () => {
      const id = el.dataset.notif, n = NOTIFS.find((x) => x.id === id);
      if (!n || n.read) return;
      n.read = true; el.classList.remove('unread');
      await sb.from('notifications').update({ read: true }).eq('id', id);
      loadNotifications();
    };
  });
}

boot();
</script>
