<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sign in — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="theme.css?v=44">
<link rel="stylesheet" href="design-system/ui-kit.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.err{color:var(--accent);font-size:12.5px;margin-top:10px}

.auth-combo{
  display:flex;flex-wrap:wrap;max-width:1100px;min-height:460px;
  background:#fff;border:2px solid var(--ink);border-radius:26px 12px 26px 12px;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;
}
.auth-illustration{
  
  flex:3 1 260px;min-width:220px;position:relative;overflow:hidden;
  background:var(--bg-raised);display:flex;align-items:center;justify-content:center;padding:40px 24px;
}
.auth-illustration-shape{position:absolute;border-radius:50%}
.auth-illustration-shape.s1{width:240px;height:240px;background:var(--ink);opacity:.05;top:-80px;left:-70px}
.auth-illustration-shape.s2{
  width:180px;height:180px;background:var(--accent);opacity:.14;bottom:-60px;right:-50px;
  animation:authBob 5.5s ease-in-out infinite;
}
.auth-illustration-shape.s3{
  width:90px;height:90px;background:var(--ink);opacity:.07;bottom:30%;left:8%;
  animation:authBob 7s ease-in-out infinite reverse;
}
@keyframes authBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.auth-illustration-logo{position:relative;width:52%;max-width:220px;animation:authFloat 4.5s ease-in-out infinite}
@keyframes authFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.auth-form-col{
  flex:1 1 300px;min-width:260px;max-width:420px;padding:32px 28px;
  display:flex;flex-direction:column;justify-content:center;
}
@media (prefers-reduced-motion:reduce){
  .auth-illustration-shape.s2,.auth-illustration-shape.s3,.auth-illustration-logo{animation:none}
}

@media (min-width:861px){
  .wrap{max-width:1180px;margin:0 auto}
}
</style>
</head>
<body>
<div id="pageTransition" class="page-transition" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <a href="index.html" class="btn btn-ghost" style="order:2">&larr; Site</a>
    <a href="index.html" class="topbar-logo"><img src="logo.png" alt="AUZslab"></a>
  </header>

  <main class="content">
    <div class="wrap">

      <section class="section" style="padding-top:56px">
        <div class="label">Your account</div>
        <h1 class="h-1" id="pageTitle">Sign in</h1>
        <p class="lede" id="pageLede">Create an account or sign in to build your cart and send us your requirements.</p>

        <section class="section tight" style="padding-top:24px">
          <div class="auth-combo">
            <div class="auth-illustration" role="presentation">
              <div class="auth-illustration-shape s1"></div>
              <div class="auth-illustration-shape s2"></div>
              <div class="auth-illustration-shape s3"></div>
              <img class="auth-illustration-logo" src="logo.png" alt="" aria-hidden="true">
            </div>
            <div class="auth-form-col">
              <div id="authSection">
                <div style="display:flex;gap:8px;margin-bottom:6px">
                  <button class="btn btn-ghost" id="modeNew" style="flex:1;justify-content:center">New account</button>
                  <button class="btn btn-ghost" id="modeLogin" style="flex:1;justify-content:center">Log in</button>
                </div>
                <div class="field">
                  <label for="email">Email</label>
                  <input id="email" type="email" required autocomplete="email">
                </div>
                <div class="field">
                  <label for="password">Password</label>
                  <input id="password" type="password" required minlength="8" autocomplete="new-password">
                </div>
                <button id="submitBtn" class="btn btn-primary form-submit">Create account</button>
                <div id="authErr" class="err"></div>
              </div>

              <div id="loggedInSection" style="display:none">
                <p class="p">You're signed in as <b id="loggedInEmail"></b>.</p>
                <a href="cart.html" class="btn btn-primary form-submit">Go to your cart</a>
                <button id="signOutBtn" class="btn btn-ghost form-submit">Sign out</button>
              </div>
            </div>
          </div>
        </section>
      </section>

    </div>
  </main>
</div>

<script src="/sb-client.js?v=2"></script>
<script src="site.js?v=7"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);
let mode = 'signup';

function setMode(m) {
  mode = m;
  document.getElementById('modeNew').style.background = m === 'signup' ? 'var(--ink)' : '';
  document.getElementById('modeNew').style.color = m === 'signup' ? '#fff' : '';
  document.getElementById('modeLogin').style.background = m === 'login' ? 'var(--ink)' : '';
  document.getElementById('modeLogin').style.color = m === 'login' ? '#fff' : '';
  document.getElementById('submitBtn').textContent = m === 'signup' ? 'Create account' : 'Log in';
  document.getElementById('pageTitle').textContent = m === 'signup' ? 'Create your account' : 'Sign in';
}
document.getElementById('modeNew').onclick = () => setMode('signup');
document.getElementById('modeLogin').onclick = () => setMode('login');
setMode('signup');

// Whether to send someone to account.html or cart.html has to come
// from their actual profiles row, not user.app_metadata off the JWT --
// that's only a snapshot from whenever they first signed up (before
// they had a tenant), and can drift out of sync with profiles (see
// db/038_client_setup_handoff.sql for the real incident this caused:
// an approved owner kept bouncing back to cart.html because
// app_metadata never got updated even though their profile was
// already correct).
async function hasOwnTenant(userId) {
  const { data } = await sb.from('profiles').select('tenant_id').eq('id', userId).single();
  return !!(data && data.tenant_id);
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    if (await hasOwnTenant(session.user.id)) {
      window.location.href = 'account.html';
      return;
    }
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('loggedInSection').style.display = 'block';
    document.getElementById('loggedInEmail').textContent = session.user.email;
  }
}
checkSession();

document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  if (!email) { errEl.textContent = 'Enter your email address.'; return; }
  if (!password) { errEl.textContent = 'Enter a password.'; return; }
  if (mode === 'signup' && password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  const { data, error } = mode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  const user = data && (data.user || (data.session && data.session.user));
  if (user && await hasOwnTenant(user.id)) {
    window.location.href = 'account.html';
    return;
  }
  window.location.href = 'cart.html';
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.reload();
};
</script>
</body>
</html>
