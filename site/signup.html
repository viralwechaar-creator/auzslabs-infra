<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sign in — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="tool/theme.mobile.css?v=44" media="(max-width:899px)"><link rel="stylesheet" href="tool/theme.desktop.css?v=44" media="(min-width:900px)">
<link rel="stylesheet" href="tool/sketch.mobile.css?v=1" media="(max-width:899px)"><link rel="stylesheet" href="tool/sketch.desktop.css?v=1" media="(min-width:900px)">
<script src="tool/sketch.js?v=1"></script>
<script src="tool/sketch-art.js?v=1" defer></script>
<link rel="stylesheet" href="tool/design-system/ui-kit.mobile.css?v=3" media="(max-width:899px)"><link rel="stylesheet" href="tool/design-system/ui-kit.desktop.css?v=3" media="(min-width:900px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style media="(max-width:899px)">.err{color:var(--accent);font-size:12.5px;margin-top:10px}
.auth-combo{display:flex;flex-wrap:wrap;max-width:1100px;min-height:460px;
  background:#fff;border:2px solid var(--ink);border-radius:26px 12px 26px 12px;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;}
.auth-illustration{flex:3 1 260px;min-width:220px;position:relative;overflow:hidden;
  background:var(--bg-raised);display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.auth-illustration-shape{position:absolute;border-radius:50%}
.auth-illustration-shape.s1{width:240px;height:240px;background:var(--ink);opacity:.05;top:-80px;left:-70px}
.auth-illustration-shape.s2{width:180px;height:180px;background:var(--accent);opacity:.14;bottom:-60px;right:-50px;
  animation:authBob 5.5s ease-in-out infinite;}
.auth-illustration-shape.s3{width:90px;height:90px;background:var(--ink);opacity:.07;bottom:30%;left:8%;
  animation:authBob 7s ease-in-out infinite reverse;}
@keyframes authBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.auth-illustration-logo{position:relative;width:52%;max-width:220px;animation:authFloat 4.5s ease-in-out infinite}
@keyframes authFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.auth-form-col{flex:1 1 300px;min-width:260px;max-width:420px;padding:32px 28px;
  display:flex;flex-direction:column;justify-content:center;}
@media (prefers-reduced-motion:reduce){
.auth-illustration-shape.s2,.auth-illustration-shape.s3,.auth-illustration-logo{animation:none}
}
@media (min-width:861px){
.wrap{max-width:1180px;margin:0 auto}
}
</style><style media="(min-width:900px)">.err{color:var(--accent);font-size:12.5px;margin-top:10px}
.auth-combo{display:flex;flex-wrap:wrap;max-width:1100px;min-height:460px;
  background:#fff;border:2px solid var(--ink);border-radius:26px 12px 26px 12px;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;}
.auth-illustration{flex:3 1 260px;min-width:220px;position:relative;overflow:hidden;
  background:var(--bg-raised);display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.auth-illustration-shape{position:absolute;border-radius:50%}
.auth-illustration-shape.s1{width:240px;height:240px;background:var(--ink);opacity:.05;top:-80px;left:-70px}
.auth-illustration-shape.s2{width:180px;height:180px;background:var(--accent);opacity:.14;bottom:-60px;right:-50px;
  animation:authBob 5.5s ease-in-out infinite;}
.auth-illustration-shape.s3{width:90px;height:90px;background:var(--ink);opacity:.07;bottom:30%;left:8%;
  animation:authBob 7s ease-in-out infinite reverse;}
@keyframes authBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.auth-illustration-logo{position:relative;width:52%;max-width:220px;animation:authFloat 4.5s ease-in-out infinite}
@keyframes authFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.auth-form-col{flex:1 1 300px;min-width:260px;max-width:420px;padding:32px 28px;
  display:flex;flex-direction:column;justify-content:center;}
@media (prefers-reduced-motion:reduce){
.auth-illustration-shape.s2,.auth-illustration-shape.s3,.auth-illustration-logo{animation:none}
}
.wrap{max-width:1180px;margin:0 auto}
</style>
</head>
<body>
<div id="pageTransition" class="page-transition" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <a href="index.html" class="btn btn-ghost" style="order:2">&larr; Site</a>
    <a href="index.html" class="topbar-logo"><img src="logo.png" alt="AUZslab"></a>
  </header>

  <main class="content">
    <div class="wrap">

      <section class="section" style="padding-top:56px">
        <div class="label">Your account</div>
        <h1 class="h-1" id="pageTitle">Sign in</h1>
        <p class="lede" id="pageLede">Create an account or sign in to build your cart and send us your requirements.</p>

        <section class="section tight" style="padding-top:24px">
          <div class="auth-combo">
            <div class="auth-illustration" role="presentation">
              <div class="auth-illustration-shape s1"></div>
              <div class="auth-illustration-shape s2"></div>
              <div class="auth-illustration-shape s3"></div>
              <img class="auth-illustration-logo" src="logo.png" alt="" aria-hidden="true">
            </div>
            <div class="auth-form-col">
              <div id="authSection">
                <div style="display:flex;gap:8px;margin-bottom:6px">
                  <button class="btn btn-ghost" id="modeNew" style="flex:1;justify-content:center">New account</button>
                  <button class="btn btn-ghost" id="modeLogin" style="flex:1;justify-content:center">Log in</button>
                </div>

                <div id="socialRow" style="display:none;flex-direction:column;gap:8px;margin:4px 0 14px">
                  <div id="googleBtnHost"></div>
                  <button id="appleBtn" class="btn btn-ghost form-submit" style="display:none;justify-content:center;gap:8px">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.46 2.1-1.17 2.83-.78.8-2.03 1.42-3.09 1.33-.12-1.1.46-2.25 1.15-2.97.78-.83 2.17-1.46 3.11-1.19ZM20.6 17.17c-.46 1.06-.68 1.53-1.27 2.47-.82 1.3-1.98 2.93-3.41 2.94-1.27.02-1.6-.83-3.33-.82-1.73.01-2.09.84-3.36.82-1.43-.02-2.53-1.48-3.35-2.78-2.3-3.63-2.54-7.89-1.12-10.16.99-1.6 2.56-2.54 4.03-2.54 1.5 0 2.44.84 3.68.84 1.2 0 1.93-.85 3.66-.85 1.32 0 2.71.72 3.7 1.96-3.25 1.78-2.72 6.42.77 8.12Z"/></svg>
                    Continue with Apple
                  </button>
                  <div class="hr-or" style="display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--ink-dim,#8a8680);font-size:12.5px">
                    <span style="flex:1;height:1px;background:var(--l,#e5e2dd)"></span>or<span style="flex:1;height:1px;background:var(--l,#e5e2dd)"></span>
                  </div>
                </div>

                <div style="display:flex;gap:6px;margin-bottom:10px">
                  <button class="btn btn-ghost" id="methodEmail" style="flex:1;justify-content:center;padding:8px;font-size:13px">Email</button>
                  <button class="btn btn-ghost" id="methodPhone" style="flex:1;justify-content:center;padding:8px;font-size:13px">Phone</button>
                </div>

                <div id="emailFields">
                  <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" required autocomplete="email">
                  </div>
                  <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" required minlength="8" autocomplete="new-password">
                  </div>
                  <div id="forgotRow" style="display:none;text-align:right;margin:-6px 0 10px">
                    <button id="forgotLink" type="button" style="background:none;border:none;padding:0;color:var(--ink-dim,#8a8680);font-size:12.5px;text-decoration:underline;cursor:pointer">Forgot your password?</button>
                  </div>
                  <button id="submitBtn" class="btn btn-primary form-submit">Create account</button>
                </div>

                <div id="phoneFields" style="display:none">
                  <div class="field">
                    <label for="phoneNum">Phone number</label>
                    <input id="phoneNum" type="tel" placeholder="+91 98765 43210" autocomplete="tel">
                  </div>
                  <button id="sendCodeBtn" class="btn btn-primary form-submit" type="button">Send code</button>
                  <div id="codeStep" style="display:none">
                    <div class="field">
                      <label for="phoneCode">6-digit code</label>
                      <input id="phoneCode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                    </div>
                    <button id="verifyCodeBtn" class="btn btn-primary form-submit" type="button">Verify &amp; continue</button>
                  </div>
                </div>

                <div id="authErr" class="err"></div>
              </div>

              <div id="resetSection" style="display:none">
                <p class="p">Set a new password.</p>
                <div class="field">
                  <label for="newPassword">New password</label>
                  <input id="newPassword" type="password" required minlength="8" autocomplete="new-password">
                </div>
                <button id="resetSubmitBtn" class="btn btn-primary form-submit">Set new password</button>
                <div id="resetErr" class="err"></div>
              </div>

              <div id="loggedInSection" style="display:none">
                <p class="p">You're signed in as <b id="loggedInEmail"></b>.</p>
                <a href="cart.html" class="btn btn-primary form-submit">Go to your cart</a>
                <button id="signOutBtn" class="btn btn-ghost form-submit">Sign out</button>
              </div>
            </div>
          </div>
        </section>
      </section>

    </div>
  </main>
</div>

<script src="/sb-client.js?v=2"></script>
<script src="tool/site.js?v=8"></script>
<script>
// googleClientId/appleClientId: empty until the owner creates them (see
// CLAUDE.md / the deploy notes for exactly where) -- every social button
// below stays hidden until its own id is filled in, so this page never
// shows a button that can't actually work yet.
window.CFG = { url: 'https://api.auzslab.in', key: '', googleClientId: '', appleClientId: '' };
</script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);
let mode = 'signup';
let authMethod = 'email';

function setMode(m) {
  mode = m;
  document.getElementById('modeNew').style.background = m === 'signup' ? 'var(--ink)' : '';
  document.getElementById('modeNew').style.color = m === 'signup' ? '#fff' : '';
  document.getElementById('modeLogin').style.background = m === 'login' ? 'var(--ink)' : '';
  document.getElementById('modeLogin').style.color = m === 'login' ? '#fff' : '';
  document.getElementById('submitBtn').textContent = m === 'signup' ? 'Create account' : 'Log in';
  document.getElementById('pageTitle').textContent = m === 'signup' ? 'Create your account' : 'Sign in';
  document.getElementById('forgotRow').style.display = m === 'login' ? 'block' : 'none';
}
document.getElementById('modeNew').onclick = () => setMode('signup');
document.getElementById('modeLogin').onclick = () => setMode('login');
setMode('signup');

function setAuthMethod(m) {
  authMethod = m;
  document.getElementById('methodEmail').style.background = m === 'email' ? 'var(--ink)' : '';
  document.getElementById('methodEmail').style.color = m === 'email' ? '#fff' : '';
  document.getElementById('methodPhone').style.background = m === 'phone' ? 'var(--ink)' : '';
  document.getElementById('methodPhone').style.color = m === 'phone' ? '#fff' : '';
  document.getElementById('emailFields').style.display = m === 'email' ? 'block' : 'none';
  document.getElementById('phoneFields').style.display = m === 'phone' ? 'block' : 'none';
  document.getElementById('authErr').textContent = '';
}
document.getElementById('methodEmail').onclick = () => setAuthMethod('email');
document.getElementById('methodPhone').onclick = () => setAuthMethod('phone');
setAuthMethod('email');

// ---- after any successful sign-in, by whatever method ----
async function afterSignIn(user) {
  if (user && await hasOwnTenant(user.id)) { window.location.href = 'account.html'; return; }
  if (await isPlatformAdmin()) { window.location.href = 'admin.html'; return; }
  window.location.href = 'cart.html';
}

// ---- Google Sign-In (Google Identity Services) ----
if (CFG.googleClientId) {
  const gs = document.createElement('script');
  gs.src = 'https://accounts.google.com/gsi/client';
  gs.async = true; gs.defer = true;
  gs.onload = () => {
    document.getElementById('socialRow').style.display = 'flex';
    google.accounts.id.initialize({
      client_id: CFG.googleClientId,
      callback: async (resp) => {
        const errEl = document.getElementById('authErr');
        const { data, error } = await sb.auth.signInWithGoogle(resp.credential);
        if (error) { errEl.textContent = error.message; return; }
        afterSignIn(data.user);
      },
    });
    google.accounts.id.renderButton(document.getElementById('googleBtnHost'), { theme: 'outline', size: 'large', width: 320 });
  };
  document.head.appendChild(gs);
}

// ---- Sign in with Apple ----
if (CFG.appleClientId) {
  const as = document.createElement('script');
  as.src = 'https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js';
  as.onload = () => {
    document.getElementById('socialRow').style.display = 'flex';
    const appleBtn = document.getElementById('appleBtn');
    appleBtn.style.display = 'flex';
    AppleID.auth.init({
      clientId: CFG.appleClientId,
      scope: 'email name',
      redirectURI: window.location.origin + '/signup.html',
      usePopup: true,
    });
    appleBtn.onclick = async () => {
      const errEl = document.getElementById('authErr');
      errEl.textContent = '';
      try {
        const resp = await AppleID.auth.signIn();
        const { data, error } = await sb.auth.signInWithApple(resp.authorization.code);
        if (error) { errEl.textContent = error.message; return; }
        afterSignIn(data.user);
      } catch (e) {
        if (e && e.error === 'popup_closed_by_user') return;
        errEl.textContent = 'Apple sign-in failed.';
      }
    };
  };
  document.head.appendChild(as);
}

// ---- Phone / OTP ----
document.getElementById('sendCodeBtn').onclick = async () => {
  const phone = document.getElementById('phoneNum').value.trim();
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  if (!/^\+[1-9]\d{6,14}$/.test(phone)) { errEl.textContent = 'Enter your number with a country code, e.g. +91 98765 43210.'; return; }
  const { data, error } = await sb.auth.sendPhoneOtp(phone);
  if (error) { errEl.textContent = error.message; return; }
  if (data && data.sent === false) { errEl.textContent = data.reason || 'Could not send a code right now.'; return; }
  document.getElementById('codeStep').style.display = 'block';
  document.getElementById('sendCodeBtn').textContent = 'Resend code';
};
document.getElementById('verifyCodeBtn').onclick = async () => {
  const phone = document.getElementById('phoneNum').value.trim();
  const code = document.getElementById('phoneCode').value.trim();
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  const { data, error } = await sb.auth.verifyPhoneOtp(phone, code);
  if (error) { errEl.textContent = error.message; return; }
  afterSignIn(data.user);
};

// ---- Forgot / reset password ----
document.getElementById('forgotLink').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  if (!email) { errEl.textContent = 'Enter your email above first, then tap "Forgot your password?" again.'; return; }
  const resetLinkBase = window.location.origin + '/signup.html';
  const { error } = await sb.auth.forgotPassword(email, resetLinkBase);
  errEl.style.color = 'var(--ink-dim, #666)';
  errEl.textContent = error ? error.message : 'If an account exists for that email, a reset link is on its way.';
};

// A reset link lands back on this same page as ?token=... -- show the
// "set a new password" form instead of the normal sign-in form.
const resetToken = new URLSearchParams(window.location.search).get('token');
if (resetToken) {
  document.getElementById('authSection').style.display = 'none';
  document.getElementById('resetSection').style.display = 'block';
  document.getElementById('pageTitle').textContent = 'Reset your password';
  document.getElementById('resetSubmitBtn').onclick = async () => {
    const password = document.getElementById('newPassword').value;
    const errEl = document.getElementById('resetErr');
    errEl.textContent = '';
    if (!password || password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
    const { error } = await sb.auth.resetPassword(resetToken, password);
    if (error) { errEl.textContent = error.message; return; }
    window.location.href = 'signup.html';
  };
}

// Whether to send someone to account.html or cart.html has to come
// from their actual profiles row, not user.app_metadata off the JWT --
// that's only a snapshot from whenever they first signed up (before
// they had a tenant), and can drift out of sync with profiles (see
// db/038_client_setup_handoff.sql for the real incident this caused:
// an approved owner kept bouncing back to cart.html because
// app_metadata never got updated even though their profile was
// already correct).
async function hasOwnTenant(userId) {
  const { data } = await sb.from('profiles').select('tenant_id').eq('id', userId).single();
  return !!(data && data.tenant_id);
}

// AUZslab's own team signs in here too, same as any client -- they skip
// the cart and land straight on the admin dashboard. list_clients() is
// the same server-side gate admin.html itself uses (it raises for anyone
// who isn't a platform admin).
async function isPlatformAdmin() {
  const { error } = await sb.rpc('list_clients', {});
  return !error;
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    if (await hasOwnTenant(session.user.id)) {
      window.location.href = 'account.html';
      return;
    }
    if (await isPlatformAdmin()) {
      window.location.href = 'admin.html';
      return;
    }
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('loggedInSection').style.display = 'block';
    document.getElementById('loggedInEmail').textContent = session.user.email;
  }
}
checkSession();

document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  if (!email) { errEl.textContent = 'Enter your email address.'; return; }
  if (!password) { errEl.textContent = 'Enter a password.'; return; }
  if (mode === 'signup' && password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  const { data, error } = mode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  const user = data && (data.user || (data.session && data.session.user));
  afterSignIn(user);
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.reload();
};
</script>
</body>
</html>
