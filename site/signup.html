<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=42">
<link rel="stylesheet" href="design-system/ui-kit.css?v=3">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.err{color:var(--accent);font-size:12.5px;margin-top:10px}

/* ---- signup-page-only: one unified card holding a decorative panel
   beside the form (illustration-left/form-right, like a typical auth
   page), replacing an earlier version that used a solid black square
   -- reads as "a heavy black box" rather than decoration, so this
   uses the same light --bg-raised panel every other card on the site
   sits on, with the site's own ink/maroon in place of illustration
   colour. Pure CSS, no external assets besides the existing logo. ---- */
.auth-combo{
  display:flex;flex-wrap:wrap;max-width:760px;
  background:#fff;border:2px solid var(--ink);border-radius:26px 12px 26px 12px;
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;
}
.auth-illustration{
  flex:1 1 260px;min-width:220px;position:relative;overflow:hidden;
  background:var(--bg-raised);display:flex;align-items:center;justify-content:center;padding:40px 24px;
}
.auth-illustration-shape{position:absolute;border-radius:50%}
.auth-illustration-shape.s1{width:200px;height:200px;background:var(--ink);opacity:.05;top:-70px;left:-60px}
.auth-illustration-shape.s2{
  width:150px;height:150px;background:var(--accent);opacity:.14;bottom:-50px;right:-40px;
  animation:authBob 5.5s ease-in-out infinite;
}
@keyframes authBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.auth-illustration-logo{position:relative;width:64%;max-width:180px;animation:authFloat 4.5s ease-in-out infinite}
@keyframes authFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.auth-form-col{flex:1 1 300px;min-width:260px;padding:32px 28px;display:flex;flex-direction:column;justify-content:center}
@media (prefers-reduced-motion:reduce){
  .auth-illustration-shape.s2,.auth-illustration-logo{animation:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="index.html" class="btn btn-ghost" style="order:2">&larr; Site</a>
    <a href="index.html" class="topbar-logo"><img src="logo.png" alt="AUZslab"></a>
  </header>

  <main class="content">
    <div class="wrap">

      <section class="section" style="padding-top:56px">
        <div class="label">Your account</div>
        <h1 class="h-1" id="pageTitle">Sign in</h1>
        <p class="lede" id="pageLede">Create an account or sign in to build your cart and send us your requirements.</p>

        <section class="section tight" style="padding-top:24px">
          <div class="auth-combo">
            <div class="auth-illustration" role="presentation">
              <div class="auth-illustration-shape s1"></div>
              <div class="auth-illustration-shape s2"></div>
              <img class="auth-illustration-logo" src="logo.png" alt="" aria-hidden="true">
            </div>
            <div class="auth-form-col">
              <div id="authSection">
                <div style="display:flex;gap:8px;margin-bottom:6px">
                  <button class="btn btn-ghost" id="modeNew" style="flex:1;justify-content:center">New account</button>
                  <button class="btn btn-ghost" id="modeLogin" style="flex:1;justify-content:center">Log in</button>
                </div>
                <div class="field">
                  <label for="email">Email</label>
                  <input id="email" type="email">
                </div>
                <div class="field">
                  <label for="password">Password</label>
                  <input id="password" type="password">
                </div>
                <button id="submitBtn" class="btn btn-primary form-submit">Create account</button>
                <div id="authErr" class="err"></div>
              </div>

              <div id="loggedInSection" style="display:none">
                <p class="p">You're signed in as <b id="loggedInEmail"></b>.</p>
                <a href="cart.html" class="btn btn-primary form-submit">Go to your cart</a>
                <button id="signOutBtn" class="btn btn-ghost form-submit">Sign out</button>
              </div>
            </div>
          </div>
        </section>
      </section>

    </div>
  </main>
</div>

<script src="/sb-client.js?v=2"></script>
<script src="site.js?v=6"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);
let mode = 'signup';

function setMode(m) {
  mode = m;
  document.getElementById('modeNew').style.background = m === 'signup' ? 'var(--ink)' : '';
  document.getElementById('modeNew').style.color = m === 'signup' ? '#fff' : '';
  document.getElementById('modeLogin').style.background = m === 'login' ? 'var(--ink)' : '';
  document.getElementById('modeLogin').style.color = m === 'login' ? '#fff' : '';
  document.getElementById('submitBtn').textContent = m === 'signup' ? 'Create account' : 'Log in';
  document.getElementById('pageTitle').textContent = m === 'signup' ? 'Create your account' : 'Sign in';
}
document.getElementById('modeNew').onclick = () => setMode('signup');
document.getElementById('modeLogin').onclick = () => setMode('login');
setMode('signup');

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // A tenant_id in app_metadata means this is already a live client
    // (either onboarded by us directly, like OG Book Cafe, or a
    // self-signup that's since been approved) -- send them straight
    // to their account dashboard instead of the cart/signup flow.
    if (session.user.app_metadata && session.user.app_metadata.tenant_id) {
      window.location.href = 'account.html';
      return;
    }
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('loggedInSection').style.display = 'block';
    document.getElementById('loggedInEmail').textContent = session.user.email;
  }
}
checkSession();

document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';
  const { data, error } = mode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  const user = data && (data.user || (data.session && data.session.user));
  if (user && user.app_metadata && user.app_metadata.tenant_id) {
    window.location.href = 'account.html';
    return;
  }
  window.location.href = 'cart.html';
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.reload();
};
</script>
</body>
</html>
