<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#4a4a4a;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,Inter,sans-serif;-webkit-text-size-adjust:100%}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 16px;flex-wrap:wrap}
.bar a,.bar button{font:600 14px Inter,Arial,sans-serif;padding:11px 18px;border-radius:999px;border:1.5px solid #fff;background:#000;color:#fff;cursor:pointer;text-decoration:none}
.bar button.go{background:#fff;color:#000}
#msg{max-width:520px;margin:60px auto;padding:0 20px;text-align:center;font-size:15px;line-height:1.6}
#wrap{display:flex;justify-content:center;padding:max(24px, env(safe-area-inset-top) + 16px) 0 28px;overflow:hidden}
/* one fixed A4 sheet (794 x 1123 CSS px), black, scaled to the screen width, real A4 when printed. flex-shrink:0 keeps the
   sheet at its real width inside the flex container (a phone would otherwise squeeze it before the scale is applied) */
.sheet{position:relative;width:794px;flex-shrink:0;height:1123px;background:#000;color:#fff;padding:38px 44px 26px;box-shadow:0 2px 24px rgba(0,0,0,.4);transform-origin:top left;display:flex;flex-direction:column;font-size:9.5px;line-height:1.3;font-weight:500;letter-spacing:-.1px;overflow:hidden}
.brand{font-size:104px;line-height:.9;font-weight:700;letter-spacing:-5px;margin:0;white-space:nowrap}
.meta{display:grid;grid-template-columns:200px 1fr auto;gap:0 26px;align-items:end;margin-top:54px;padding-bottom:12px}
.meta .m{font-size:16px;line-height:1.12;font-weight:600;letter-spacing:-.3px}
.h1{font-size:42px;line-height:.9;font-weight:700;letter-spacing:-2px;margin:0;text-transform:none}
hr{border:0;border-top:1px solid #fff;margin:0}
.to{display:grid;grid-template-columns:200px 1fr 1fr;gap:0 26px;padding:9px 0 12px;font-size:8.6px;line-height:1.35}
.to .k{color:#9b9b9b}
.table{margin-top:2px}
.th,.line{display:grid;grid-template-columns:1fr 46px 86px 76px 104px;gap:8px;align-items:start}
.th{padding:7px 0 5px;font-size:8px;color:#9b9b9b;letter-spacing:.3px}
.line{padding:8px 0 3px;font-size:10.5px;line-height:1.2;font-weight:600}
.line small{display:block;font-weight:500;color:#bdbdbd;font-size:8.6px;padding-left:34px;line-height:1.25}
.r{text-align:right}
.mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:14px;position:relative}
.ren{width:300px;font-size:8.4px}
.ren .t{font-size:8.6px;font-weight:700;letter-spacing:.2px;margin-bottom:4px}
.ren table{width:100%;border-collapse:collapse}
.ren th{text-align:left;font-weight:500;color:#9b9b9b;font-size:7.6px;padding:2px 0;border-bottom:1px solid #444}
.ren td{padding:3px 0;border-bottom:1px solid #2c2c2c;font-size:8.4px}
.tots{width:326px;font-size:10px;line-height:1.28;font-weight:700;letter-spacing:-.1px}
.tr{display:flex;justify-content:space-between;gap:12px}
.tr.sp{margin-top:9px}
.tr.big{font-size:12px;margin-top:6px}
.words{font-size:8px;color:#bdbdbd;font-weight:500;margin-top:5px;text-align:right}
.pay{display:grid;grid-template-columns:1fr 1.18fr;gap:0 24px;padding-top:14px;margin-top:18px;border-top:1px solid #fff;position:relative}
.pay h2{margin:0;font-size:40px;line-height:.9;font-weight:700;letter-spacing:-2px;display:inline}
.pay .ref{display:inline-block;vertical-align:top;margin-left:9px;font-size:7.6px;line-height:1.25;font-weight:600;max-width:150px}
.pay .info{margin-top:11px;font-size:7.6px;line-height:1.45;font-weight:500}
.pay .info b{font-weight:600}
.pay .qrrow{display:flex;gap:12px;align-items:flex-end;margin-top:8px}
.qr{background:#fff;padding:3px;width:76px;height:76px}.qr img{width:100%;height:100%;display:block}
.pay .scan{font-size:7.6px;font-weight:700;letter-spacing:.2px;padding-bottom:2px}
.terms{columns:2;column-gap:14px;font-size:5.9px;line-height:1.28;color:#e6e6e6;font-weight:500}
.terms h4{margin:0;font-size:6px;color:#fff;font-weight:700;display:inline}
.terms p{margin:0 0 2.5px;break-inside:avoid;display:block}
.foot{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;border-top:1px solid #fff;margin-top:14px;padding-top:7px;font-size:6.6px;line-height:1.3;font-weight:600}
.stamp{position:absolute;left:170px;bottom:150px;width:104px;height:104px;transform:rotate(-13deg);opacity:.85;pointer-events:none;color:#fff}
@page{size:A4;margin:0}
@media print{
  html,body{background:#000}
  .bar{display:none!important}
  #printHint{display:none!important}
  #wrap{padding:0;display:block}
  .sheet{box-shadow:none;transform:none!important;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<h1 class="sr" style="position:absolute;left:-9999px">Your bill</h1>
<div id="msg">Loading your bill...</div>
<div id="wrap" hidden><div class="sheet" id="sheet"></div></div>
<div class="bar" id="bar" hidden><button class="go" id="printBtn" type="button">Print or save as PDF</button><a href="#" id="backLink">Back to payment page</a></div>
<p id="printHint" hidden style="max-width:420px;margin:0 auto 20px;padding:0 20px;text-align:center;font-size:12.5px;color:#8a8a8a;line-height:1.5">If the button above doesn't open a Print/Save box, this page may be opened inside WhatsApp's own browser. Tap the <b>⋯</b> or <b>Share</b> icon at the top or bottom of this screen, choose <b>Open in Safari/Chrome</b>, then try again.</p>
<script src="vendor/qrcode.js"></script>
<script src="company.js?v=104"></script>
<script src="orderterms.js?v=103"></script>
<script>
const CFG = { url: 'https://api.auzslab.in' };
const O = window.AUZ_ORDER, CO = window.AUZ_CO || {};
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dmy = (d) => { const m = String(d || '').slice(0, 10).split('-'); return m.length === 3 ? m[2] + '/' + m[1] + '/' + m[0] : ''; };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const longDate = (d) => { const m = String(d || '').slice(0, 10).split('-'); return m.length === 3 ? Number(m[2]) + ' ' + MONTHS[Number(m[1]) - 1] + ' ' + m[0] : ''; };
// amount in words (Indian system)
function words(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'], b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (x) => (x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : ''));
  const three = (x) => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x));
  const rs = Math.floor(n), ps = Math.round((n - rs) * 100); if (rs === 0 && ps === 0) return 'Zero';
  const parts = [[Math.floor(rs / 1e7), 'Crore'], [Math.floor(rs / 1e5) % 100, 'Lakh'], [Math.floor(rs / 1e3) % 100, 'Thousand'], [rs % 1000, '']];
  let out = parts.filter((p) => p[0]).map((p) => (p[1] === '' ? three(p[0]) : two(p[0]) + ' ' + p[1])).join(' ');
  out = (out || 'Zero') + ' Rupees'; if (ps) out += ' and ' + two(ps) + ' Paise'; return out + ' only';
}
function stampSvg(dateTxt) {
  return `<svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true"><defs>
  <path id="cpt" d="M24,100 A76,76 0 0 1 176,100"/><path id="cpb" d="M20,100 A80,80 0 0 0 180,100"/>
  <filter id="wine" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .5 0 0 0 0 0 0 0 0 0 .125 0 0 0 1 0"/></filter></defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="100" cy="100" r="58" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="currentColor" text-anchor="middle"><textPath href="#cpt" startOffset="50%">AUZSLAB</textPath></text>
  <text font-family="Inter,Arial,sans-serif" font-size="8.6" font-weight="600" letter-spacing="1.6" fill="currentColor" text-anchor="middle"><textPath href="#cpb" startOffset="50%">IDEAS | PRODUCTS | SOLUTIONS</textPath></text>
  <text x="100" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="currentColor">PAID</text>
  <image href="logo.png" x="56" y="87" width="88" height="32" style="filter:invert(1)" preserveAspectRatio="xMidYMid meet"/>
  <text x="100" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9.5" font-weight="600" fill="currentColor">${esc(dateTxt)}</text></svg>`;
}

function build(D) {
  const t = D.totals || {}, lines = t.lines || [], st = (O.states || {})[D.state_code] || '';
  const prods = lines.filter((l) => l.type === 'product');
  const U = (x) => esc(String(x == null ? '' : x).toUpperCase());
  const co = esc(CO.legalName || 'AUZslab'), shortName = U((CO.name || 'AUZslab'));
  const bank = (O.bank && O.bank.account) ? `<div>[BANK TRANSFER]</div><div style="margin-top:5px">[${U(O.bank.holder)}]<br>BANK: ${esc(O.bank.bank)}<br>ACC NO. ${esc(O.bank.account)}<br>IFSC: ${esc(O.bank.ifsc)}</div>` : '';
  const svcRows = lines.map((l) => {
    const sub = l.type === 'product' ? (l.plan === 'year' ? 'Yearly plan' : 'Monthly plan') + (l.renewal ? ' · renews ' + dmy(l.renewal) : '') + ' · SAC ' + O.sac.product : (l.type === 'setup' || l.type === 'onboarding' ? 'SAC ' + O.sac.setup : '');
    const extra = (l.gst ? 'GST ' + l.gst + '%' : '') + (l.discount > 0 ? ' · discount ' + money(l.discount) : '');
    const subs = [sub, extra].filter(Boolean).join(' · ');
    return `<div class="line"><div>${esc(l.label)}${subs ? `<small>${esc(subs)}</small>` : ''}</div><div class="r">${esc(l.qty || 1)}</div><div class="r">${esc(money(l.rate != null ? l.rate : l.net))}</div><div class="r">${esc(money(l.discount || 0))}</div><div class="r">${esc(money(l.net))}</div></div>`;
  }).join('');
  const renRows = prods.map((l) => `<tr><td>${esc(l.label)}</td><td>${l.plan === 'year' ? 'Yearly' : 'Monthly'}</td><td>${esc(dmy(l.renewal))}</td><td class="r">${esc(money(l.net + l.gst_amt))}</td></tr>`).join('');
  const subject = prods.length ? prods.map((l) => l.label).slice(0, 3).join(', ') : 'Services';
  return `
  <h1 class="brand" aria-label="${co}">[${shortName}]</h1>
  <div class="meta">
    <div class="m">[${U(longDate(D.invoice_date))}]<br>[${U(D.business_name || 'Client')}]</div>
    <div class="m">[${esc(D.invoice_no || '')}]<br>[${U(subject)}]</div>
    <h2 class="h1">INVOICE</h2>
  </div>
  <hr>
  <div class="to">
    <div><span class="k">[BILLED TO]</span><br>${esc(D.contact_name || '')}${D.address ? '<br>' + esc(D.address) : ''}</div>
    <div><span class="k">[GSTIN]</span><br>${D.gstin ? esc(D.gstin) : 'Unregistered'}<br><span class="k">[STATE]</span> ${st ? esc(st) + ' (' + esc(D.state_code) + ')' : '—'}</div>
    <div><span class="k">[SUPPLY]</span><br>${t.intra ? 'Within Rajasthan (CGST + SGST)' : 'Inter-state (IGST)'}<br><span class="k">[REVERSE CHARGE]</span> No</div>
  </div>
  <hr>
  <div class="table"><div class="th"><div>SERVICES</div><div class="r">QTY</div><div class="r">PRICE</div><div class="r">DISCOUNT</div><div class="r">TOTAL</div></div>${svcRows}</div>
  <div class="mid">
    <div class="ren"><div class="t">RENEWAL</div><table><tr><th>PRODUCT</th><th>PLAN</th><th>RENEWS ON</th><th class="r">AMOUNT (INCL. GST)</th></tr>${renRows}</table></div>
    <div class="stamp">${stampSvg(dmy(D.paid_at || D.invoice_date))}</div>
    <div class="tots">
      <div class="tr"><span>SUB TOTAL:</span><span>${esc(money(t.subtotal))}</span></div>
      ${t.discount > 0 ? `<div class="tr"><span>DISCOUNT:</span><span>−${esc(money(t.discount))}</span></div>` : ''}
      <div class="tr"><span>TAXABLE VALUE:</span><span>${esc(money(t.taxable))}</span></div>
      ${t.intra ? `<div class="tr"><span>CGST:</span><span>${esc(money(t.cgst))}</span></div><div class="tr"><span>SGST:</span><span>${esc(money(t.sgst))}</span></div>` : `<div class="tr"><span>IGST:</span><span>${esc(money(t.igst))}</span></div>`}
      ${t.round ? `<div class="tr"><span>ROUND OFF:</span><span>${t.round > 0 ? '+' : ''}${esc(money(t.round))}</span></div>` : ''}
      <div class="tr big"><span>TOTAL:</span><span>${esc(money(t.total))}</span></div>
      <div class="tr sp"><span>BALANCE DUE (INR) :</span><span>${esc(money(0))}</span></div>
      <div class="words">${esc(words(Number(t.total || 0)))}</div>
    </div>
  </div>
  <div class="pay">
    <div>
      <h2>PAYMENT</h2><span class="ref">[INV NO. ${esc(D.invoice_no || '')}]<br>[REF: ${esc((D.payment && D.payment.utr) || '-')}]</span>
      <div class="info"><div>[PAID IN FULL${D.paid_at ? ' ON ' + esc(dmy(D.paid_at)) : ''}]</div><div style="margin-top:5px">[UPI: ${esc((O.upi || {}).id || '')}]</div><div style="margin-top:5px">${bank}</div></div>
      <div class="qrrow"><div class="qr" id="qrbox"></div><div class="scan">SCAN QR TO<br>VIEW THIS BILL</div></div>
    </div>
    <div class="terms"><b style="font-size:6.2px">TERMS &amp; CONDITIONS:</b>${O.terms.map(([h, p], i) => `<p>${i + 1}. <b>${esc(h)}.</b> ${esc(p)}</p>`).join('')}</div>
  </div>
  <div class="foot">
    <div>[FROM]<br>[${co}]<br>For ${co}: Authorised signatory</div>
    <div>${esc(CO.address || '')}</div>
    <div>[GSTIN: ${esc(CO.gstin || '')}]</div>
    <div>[${esc(CO.grievanceEmail || '')}]<br>[${esc(CO.phone || '')}]</div>
  </div>`;
}

function fit() {
  const sheet = document.getElementById('sheet'), wrap = document.getElementById('wrap');
  const w = document.documentElement.clientWidth, z = Math.min(1, (w - 8) / 794);
  sheet.style.transform = 'scale(' + z + ')'; sheet.style.marginBottom = (sheet.offsetHeight * (z - 1)) + 'px'; sheet.style.marginLeft = 0;
  wrap.style.justifyContent = z < 1 ? 'flex-start' : 'center'; wrap.style.paddingLeft = z < 1 ? '4px' : '0';
}
(async function () {
  const msg = document.getElementById('msg');
  if (!/^[a-f0-9]{32}$/.test(TOKEN)) { msg.textContent = 'This link is not valid. Please use the link we sent you.'; return; }
  let D = null;
  try { const r = await fetch(CFG.url + '/rpc/public_client_order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: TOKEN }) }); const j = await r.json(); D = j && (j.data !== undefined ? j.data : j); } catch (e) {}
  if (!D || D.status !== 'paid' || !D.invoice_no) { msg.textContent = D ? 'Your bill is ready once we confirm your payment. Please check again soon.' : 'We could not find this bill. Please check the link we sent you.'; return; }
  document.getElementById('sheet').innerHTML = build(D);
  try { const qb = document.getElementById('qrbox'); if (qb && window.qrcode) { const q = qrcode(0, 'M'); q.addData(location.href); q.make(); qb.innerHTML = q.createImgTag(4, 0); } } catch (e) { /* no QR */ }
  msg.hidden = true; document.getElementById('wrap').hidden = false; document.getElementById('bar').hidden = false;
  document.title = 'Invoice ' + D.invoice_no + ' — AUZslab';
  document.getElementById('backLink').href = 'pay.html?t=' + encodeURIComponent(TOKEN);
  document.getElementById('printHint').hidden = false;
  document.getElementById('printBtn').onclick = () => {
    try { window.print(); } catch (e) { alert('Could not open the print box here. Tap the ⋯ or Share icon at the top or bottom of this screen, choose "Open in Safari/Chrome", then try again.'); }
  };
  fit(); window.addEventListener('resize', fit); window.addEventListener('beforeprint', () => { const s = document.getElementById('sheet'); s.style.transform = 'none'; s.style.marginBottom = '0'; }); window.addEventListener('afterprint', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
