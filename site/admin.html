<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css?v=42">
<link rel="stylesheet" href="design-system/ui-kit.css?v=3">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---- admin-only additions: a data table in the same visual language
   as the rest of the site (thick ink borders, mono labels, pill tags)
   -- the shared design system has no table component, everything else
   here reuses .field/.btn/.card/.label/.h-1/.h-2 as-is. ---- */
.admin-table-wrap{overflow-x:auto;border:2px solid var(--ink);border-radius:14px;margin-top:16px}
.admin-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.admin-table th{
  text-align:left;padding:10px 12px;background:var(--bg-raised);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
  border-bottom:2px solid var(--ink);
}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal}
.admin-table tr:last-child td{border-bottom:none}
.admin-table .row-actions{display:flex;gap:6px;flex-wrap:wrap}
.admin-table .row-actions .btn{padding:7px 12px;font-size:9.5px}
.status-pill{
  display:inline-flex;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink);
  font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;
}
.status-new{background:var(--accent);color:#fff;border-color:var(--accent)}
.status-active{background:#1f6b3a;color:#fff;border-color:#1f6b3a}
.status-trial{background:var(--bg-raised);color:var(--ink-dim)}
.status-suspended,.status-cancelled{background:var(--ink);color:#fff}
.renewal-soon{color:var(--accent);font-weight:600}
.renewal-overdue{color:var(--accent);font-weight:700;text-decoration:underline wavy}
.feature-tag{display:inline-block;padding:2px 8px;margin:1px 2px 1px 0;border-radius:999px;border:1px solid var(--line);font-family:var(--font-mono);font-size:9px;color:var(--ink-dim)}
.err{color:var(--accent);font-size:12.5px;margin-top:10px}
.ok-box{
  background:var(--bg-raised);border:2px solid var(--ink);border-radius:18px 8px 18px 8px;
  padding:16px 18px;margin-top:16px;font-size:13px;line-height:1.7;
}
.ok-box b{word-break:break-word}
/* admin section nav, reusing the marketing site's sidebar/drawer shell
   (same CSS, same hamburger/drawer JS in site.js) so this stays visually
   and behaviorally consistent instead of a bespoke nav component */
.admin-nav-btn{
  background:none;border:none;width:100%;cursor:pointer;font-family:inherit;
  text-align:right;padding:13px 4px;
}
.admin-section{display:none}
.admin-section.active{display:block}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="hamburger" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span class="menu-btn-label">Menu</span>
    </button>
    <a href="index.html" class="topbar-logo"><img src="logo.png" alt="AUZslab"></a>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="sidebar" id="sidebarDrawer">
    <a href="index.html" class="sidebar-logo"><img src="logo.png" alt="AUZslab"></a>
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <nav class="sidebar-nav" id="adminNav" aria-label="Admin sections" style="display:none">
      <button class="nav-link admin-nav-btn active" data-section="leads">Leads <span id="notifBadgeLeads"></span></button>
      <button class="nav-link admin-nav-btn" data-section="signupRequests">Signup requests <span id="notifBadgeSignup"></span></button>
      <button class="nav-link admin-nav-btn" data-section="clients">Clients</button>
      <button class="nav-link admin-nav-btn" data-section="onboard">Onboard new</button>
      <a href="design-system/nav-kit.html" target="_blank" rel="noopener" class="nav-link">UI Kit &#8599;</a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost" id="signOutBtn" style="width:100%;justify-content:center;display:none">Sign out</button>
      <div class="sidebar-copy">&copy; 2026 AUZslab</div>
    </div>
  </aside>

  <main class="content">
    <div class="wrap">

      <section class="section" style="padding-top:56px">
        <div class="hero-grid">
        <div>
        <div class="label">AUZlabs internal</div>
        <h1 class="h-1" id="pageTitle">Admin</h1>
        <p class="lede" id="pageLede">Sign in to review leads and onboard new clients.</p>
        </div>
        <div class="hero-art" role="presentation">
          <img class="hero-art-logo" src="logo.png" alt="" aria-hidden="true">
        </div>
        </div>
      </section>

      <section class="section tight" id="loginSection">
        <div class="card" style="max-width:380px">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password">
          </div>
          <button id="signin" class="btn btn-primary form-submit">Sign in</button>
          <div id="loginErr" class="err"></div>
        </div>
      </section>

      <section class="section tight admin-section active" id="leadsSection">
        <div class="label">Leads</div>
        <h2 class="h-2">Get-in-touch submissions</h2>
        <div id="leadsList">Loading&hellip;</div>
      </section>

      <section class="section tight admin-section" id="signupRequestsSection">
        <div class="label">Self-serve signups</div>
        <h2 class="h-2">Cart requests</h2>
        <div id="signupRequestsList">Loading&hellip;</div>
      </section>

      <section class="section tight admin-section" id="clientsSection">
        <div class="label">Your clients</div>
        <h2 class="h-2">Dashboard</h2>
        <div id="clientsList">Loading&hellip;</div>
      </section>

      <section class="section tight admin-section" id="onboardSection">
        <div class="label">New client</div>
        <h2 class="h-2">Onboard a new client</h2>
        <div class="card" style="max-width:420px">
          <form id="form">
            <div class="field">
              <label for="name">Business name</label>
              <input id="name" required placeholder="OG Book Cafe">
            </div>
            <div class="field">
              <label for="slug">Subdomain</label>
              <input id="slug" required placeholder="ogbookcafe" pattern="[a-z0-9-]+">
            </div>
            <div class="field">
              <label for="niche">Niche</label>
              <select id="niche">
                <option value="cafe">Cafe / Restaurant</option>
                <option value="salon">Salon</option>
                <option value="gym">Gym</option>
                <option value="retail">Retail</option>
                <option value="general">General</option>
              </select>
            </div>
            <div class="field">
              <label for="ownerEmail">Owner's email (their first login)</label>
              <input id="ownerEmail" type="email" required>
            </div>
            <button type="submit" class="btn btn-primary form-submit">Create client</button>
            <div id="formErr" class="err"></div>
          </form>
        </div>
        <div id="result"></div>
      </section>

    </div>
  </main>

  <div class="modal-overlay" id="editOverlay">
    <div class="modal" id="editModal">
      <button class="modal-close" id="editClose" aria-label="Close">&times;</button>
      <div class="label" style="margin-bottom:10px">Edit client</div>
      <h3 class="h-2" id="editClientName" style="font-size:20px"></h3>
      <form id="editForm">
        <div class="field">
          <label for="editFee">Monthly fee (INR)</label>
          <input id="editFee" type="number" step="0.01" placeholder="Leave blank to clear">
        </div>
        <div class="field">
          <label for="editRenewal">Renewal date</label>
          <input id="editRenewal" type="date">
        </div>
        <div class="field">
          <label for="editStatus">Status</label>
          <select id="editStatus">
            <option value="trial">Trial</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="field">
          <label for="editNotes">Notes</label>
          <textarea id="editNotes" placeholder="Anything worth remembering about this client"></textarea>
        </div>
        <button type="submit" class="btn btn-primary form-submit">Save</button>
        <div id="editErr" class="err"></div>
      </form>
    </div>
  </div>

</div>

<script src="/sb-client.js?v=2"></script>
<script src="site.js?v=6"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script>
const sb = supabase.createClient(CFG.url, CFG.key);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- section switching ----
document.querySelectorAll('.admin-nav-btn').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.admin-nav-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.admin-section').forEach((s) => s.classList.remove('active'));
    document.getElementById(btn.dataset.section + 'Section').classList.add('active');
    const drawer = document.getElementById('sidebarDrawer');
    const overlay = document.getElementById('drawerOverlay');
    const toggle = document.getElementById('menuToggle');
    if (drawer) drawer.classList.remove('open');
    if (overlay) overlay.classList.remove('open');
    if (toggle) toggle.classList.remove('is-open');
    if (btn.dataset.section === 'leads') markAdminNotifsRead('lead');
    if (btn.dataset.section === 'signupRequests') markAdminNotifsRead('signup_request');
  };
});

// ---- notification badges: new leads / signup requests, read from
// the notifications table (auto-populated by DB triggers) rather
// than recomputed from status fields, so it also covers any future
// admin-facing notification type without new nav wiring. ----
async function refreshAdminNotifBadges() {
  const { data } = await sb.from('notifications').select('id,type').eq('read', false);
  const counts = {};
  (data || []).forEach((n) => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const leadsBadge = document.getElementById('notifBadgeLeads');
  const signupBadge = document.getElementById('notifBadgeSignup');
  if (leadsBadge) leadsBadge.textContent = counts.lead ? ' (' + counts.lead + ')' : '';
  if (signupBadge) signupBadge.textContent = counts.signup_request ? ' (' + counts.signup_request + ')' : '';
}
async function markAdminNotifsRead(type) {
  const { data } = await sb.from('notifications').select('id').eq('read', false).eq('type', type);
  for (const n of (data || [])) await sb.from('notifications').update({ read: true }).eq('id', n.id);
  refreshAdminNotifBadges();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('pageLede').textContent = 'Signed in as ' + session.user.email;
    document.getElementById('adminNav').style.display = 'flex';
    document.getElementById('signOutBtn').style.display = 'flex';
    loadLeads();
    loadSignupRequests();
    loadClients();
    refreshAdminNotifBadges();
    setInterval(refreshAdminNotifBadges, 20000);
  }
}
checkSession();

document.getElementById('signin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginErr').textContent = error.message;
    return;
  }
  checkSession();
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.reload();
};

const STATUS_NEXT = { new: 'contacted', contacted: 'converted' };

async function loadLeads() {
  const listEl = document.getElementById('leadsList');
  const { data, error } = await sb.from('leads').select('*').order('created_at');
  if (error) { listEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { listEl.innerHTML = '<p class="p">No leads yet.</p>'; return; }
  const rows = data.slice().reverse().map((l) => `
    <tr data-id="${l.id}">
      <td><b>${esc(l.name)}</b>${l.business ? '<br>' + esc(l.business) : ''}</td>
      <td>${esc(l.contact)}</td>
      <td>${esc(l.niche || '&mdash;')}</td>
      <td>${esc(l.message || '')}</td>
      <td><span class="status-pill ${l.status === 'new' ? 'status-new' : ''}">${esc(l.status)}</span></td>
      <td class="row-actions">
        <button class="btn btn-ghost" data-use>Use for onboarding</button>
        ${STATUS_NEXT[l.status] ? `<button class="btn btn-ghost" data-advance="${STATUS_NEXT[l.status]}">Mark ${STATUS_NEXT[l.status]}</button>` : ''}
      </td>
    </tr>`).join('');
  listEl.innerHTML = `<div class="admin-table-wrap"><table class="admin-table">
    <tr><th>Name</th><th>Contact</th><th>Niche</th><th>Message</th><th>Status</th><th></th></tr>
    ${rows}
  </table></div>`;

  listEl.querySelectorAll('tr[data-id]').forEach((tr) => {
    const id = tr.dataset.id;
    const lead = data.find((l) => l.id === id);
    const useBtn = tr.querySelector('[data-use]');
    if (useBtn) useBtn.onclick = () => {
      document.querySelector('[data-section="onboard"]').click();
      document.getElementById('name').value = lead.business || lead.name;
      document.getElementById('niche').value = lead.niche || 'general';
      document.getElementById('ownerEmail').value = lead.contact.includes('@') ? lead.contact : '';
    };
    const advBtn = tr.querySelector('[data-advance]');
    if (advBtn) advBtn.onclick = async () => {
      await sb.from('leads').update({ status: advBtn.dataset.advance }).eq('id', id);
      loadLeads();
    };
  });
}

const NICHE_LABEL = { cafe: 'Cafe / Restaurant', salon: 'Salon', gym: 'Gym', retail: 'Retail', general: 'General' };
const FEATURE_LABEL = { pos: 'POS', crm: 'CRM', booking: 'Booking', billing: 'Billing', self_order: 'Self-order', kds: 'Kitchen display', inventory: 'Inventory', qr: 'QR Ordering' };

async function loadSignupRequests() {
  const listEl = document.getElementById('signupRequestsList');
  const { data, error } = await sb.from('signup_requests').select('*').order('created_at');
  if (error) { listEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  const pending = (data || []).filter((r) => r.status === 'pending');
  if (!pending.length) { listEl.innerHTML = '<p class="p">No pending signup requests.</p>'; return; }

  const rows = pending.slice().reverse().map((r) => {
    const services = Object.entries(r.features || {}).filter(([, on]) => on)
      .map(([k]) => `<span class="feature-tag">${esc(FEATURE_LABEL[k] || k)}</span>`).join('') || '&mdash;';
    return `
    <tr data-id="${r.id}">
      <td>
        <b>${esc(r.business_name)}</b><br><span style="color:var(--ink-faint)">${esc(r.slug)}.auzslab.in</span><br>
        <span style="color:var(--ink-faint)">${esc(NICHE_LABEL[r.niche] || r.niche || 'Type not given')}${r.address ? ' &middot; ' + esc(r.address) : ''}</span>
      </td>
      <td>
        <b>${r.contact_name ? esc(r.contact_name) : '&mdash;'}</b><br>
        <span style="color:var(--ink-faint)">${r.phone ? esc(r.phone) : 'No phone given'}</span>
      </td>
      <td>${services}</td>
      <td>${r.notes ? esc(r.notes) : '&mdash;'}</td>
      <td class="row-actions">
        <button class="btn btn-primary" data-approve>Approve</button>
        <button class="btn btn-ghost" data-decline>Decline</button>
      </td>
    </tr>`;
  }).join('');

  listEl.innerHTML = `<div class="admin-table-wrap"><table class="admin-table">
    <tr><th>Business</th><th>Contact</th><th>Requested</th><th>Notes</th><th></th></tr>
    ${rows}
  </table></div>`;

  listEl.querySelectorAll('tr[data-id]').forEach((tr) => {
    const id = tr.dataset.id;
    const req = pending.find((p) => p.id === id);
    tr.querySelector('[data-approve]').onclick = async () => {
      const niche = prompt('Niche for this tenant (cafe / salon / gym / retail / general)', req?.niche || 'general');
      if (niche === null) return;
      const cleanNiche = ['cafe', 'salon', 'gym', 'retail', 'general'].includes(niche.trim()) ? niche.trim() : 'general';
      const { error: appErr } = await sb.rpc('approve_signup_request', { p_request_id: id, p_niche: cleanNiche });
      if (appErr) { alert(appErr.message); return; }
      loadSignupRequests();
      loadClients();
    };
    tr.querySelector('[data-decline]').onclick = async () => {
      if (!confirm('Decline this request?')) return;
      const { error: decErr } = await sb.rpc('decline_signup_request', { p_request_id: id });
      if (decErr) { alert(decErr.message); return; }
      loadSignupRequests();
    };
  });
}

let clientsCache = [];

async function loadClients() {
  const listEl = document.getElementById('clientsList');
  const { data, error } = await sb.rpc('list_clients', {});
  if (error) { listEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  clientsCache = data || [];
  if (!clientsCache.length) { listEl.innerHTML = '<p class="p">No clients yet &mdash; onboard one below.</p>'; return; }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const rows = clientsCache.map((c) => {
    const services = Object.entries(c.features || {}).filter(([, on]) => on)
      .map(([k]) => `<span class="feature-tag">${esc(FEATURE_LABEL[k] || k)}</span>`).join('') || '&mdash;';
    let renewalHtml = '&mdash;';
    if (c.renewal_date) {
      const days = Math.round((new Date(c.renewal_date) - today) / 86400000);
      const cls = days < 0 ? 'renewal-overdue' : days <= 7 ? 'renewal-soon' : '';
      const note = days < 0 ? ` (${-days}d overdue)` : days === 0 ? ' (today)' : days <= 7 ? ` (${days}d)` : '';
      renewalHtml = `<span class="${cls}">${esc(c.renewal_date)}${note}</span>`;
    }
    return `
    <tr data-id="${c.id}">
      <td><b>${esc(c.name)}</b><br><span style="color:var(--ink-faint)">${esc(c.slug)}.auzslab.in</span></td>
      <td>${esc(NICHE_LABEL[c.niche] || c.niche)}</td>
      <td>${services}</td>
      <td>${c.monthly_fee != null ? '&#8377;' + esc(c.monthly_fee) : '&mdash;'}</td>
      <td>${renewalHtml}</td>
      <td><span class="status-pill status-${esc(c.status)}">${esc(c.status)}</span></td>
      <td>${c.notes ? esc(c.notes) : '&mdash;'}</td>
      <td class="row-actions">
        <button class="btn btn-ghost" data-edit>Edit</button>
        <button class="btn btn-ghost" data-reset-pw>Reset password</button>
        <button class="btn btn-ghost" data-message>Message</button>
        <button class="btn btn-ghost" data-delete style="color:var(--accent);border-color:var(--accent)">Delete</button>
      </td>
    </tr>`;
  }).join('');

  listEl.innerHTML = `<div class="admin-table-wrap"><table class="admin-table">
    <tr><th>Client</th><th>Niche</th><th>Services</th><th>Fee</th><th>Renewal</th><th>Status</th><th>Notes</th><th></th></tr>
    ${rows}
  </table></div>`;

  listEl.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.onclick = () => openEditModal(btn.closest('tr').dataset.id);
  });
  listEl.querySelectorAll('[data-reset-pw]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest('tr').dataset.id;
      const c = clientsCache.find((x) => x.id === id);
      if (!confirm(`Reset the owner password for "${c.name}"? Their current password will stop working immediately.`)) return;
      const { data, error } = await sb.rpc('admin_reset_client_password', { p_tenant_id: id });
      if (error) { alert(error.message); return; }
      alert(`New password for ${data.email}:\n\n${data.temp_password}\n\nShare this with them directly (e.g. WhatsApp) -- it won't be shown again.`);
    };
  });
  listEl.querySelectorAll('[data-message]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest('tr').dataset.id;
      const c = clientsCache.find((x) => x.id === id);
      const title = prompt(`Message title for "${c.name}"`);
      if (!title) return;
      const body = prompt('Message body (optional)') || '';
      const { error } = await sb.rpc('send_client_notification', { p_tenant_id: id, p_title: title, p_body: body });
      if (error) { alert(error.message); return; }
      alert('Sent -- they\'ll see it in their account\'s Notifications tab.');
    };
  });
  listEl.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest('tr').dataset.id;
      const c = clientsCache.find((x) => x.id === id);
      const typed = prompt(`This permanently deletes "${c.name}" -- their login, orders, bookings, everything. This cannot be undone.\n\nType the client's exact name to confirm:`);
      if (typed !== c.name) { if (typed !== null) alert('Name did not match -- nothing was deleted.'); return; }
      const { error } = await sb.rpc('delete_client', { p_tenant_id: id });
      if (error) { alert(error.message); return; }
      alert(`"${c.name}" has been deleted.`);
      loadClients();
    };
  });
}

function openEditModal(id) {
  const c = clientsCache.find((x) => x.id === id);
  if (!c) return;
  document.getElementById('editModal').dataset.id = id;
  document.getElementById('editClientName').textContent = c.name;
  document.getElementById('editFee').value = c.monthly_fee != null ? c.monthly_fee : '';
  document.getElementById('editRenewal').value = c.renewal_date || '';
  document.getElementById('editStatus').value = c.status;
  document.getElementById('editNotes').value = c.notes || '';
  document.getElementById('editErr').textContent = '';
  document.getElementById('editOverlay').classList.add('open');
}
document.getElementById('editClose').onclick = () => document.getElementById('editOverlay').classList.remove('open');
document.getElementById('editOverlay').onclick = (e) => { if (e.target.id === 'editOverlay') e.currentTarget.classList.remove('open'); };

document.getElementById('editForm').onsubmit = async (e) => {
  e.preventDefault();
  const id = document.getElementById('editModal').dataset.id;
  const fee = document.getElementById('editFee').value.trim();
  const renewal = document.getElementById('editRenewal').value;
  const status = document.getElementById('editStatus').value; // constrained by <select>, can't be a typo
  const notes = document.getElementById('editNotes').value;
  const errEl = document.getElementById('editErr');
  const { error } = await sb.rpc('update_client', {
    p_tenant_id: id,
    p_monthly_fee: fee ? Number(fee) : null,
    p_renewal_date: renewal || null,
    p_notes: notes,
    p_status: status,
  });
  if (error) { errEl.textContent = error.message; return; }
  document.getElementById('editOverlay').classList.remove('open');
  loadClients();
};

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const slug = document.getElementById('slug').value.trim().toLowerCase();
  const niche = document.getElementById('niche').value;
  const ownerEmail = document.getElementById('ownerEmail').value.trim();
  const errEl = document.getElementById('formErr');
  const resultEl = document.getElementById('result');
  errEl.textContent = '';
  resultEl.innerHTML = '<p class="p">Creating tenant&hellip;</p>';

  const { data: tenantId, error: rpcErr } = await sb.rpc('provision_tenant', {
    p_name: name, p_slug: slug, p_niche: niche
  });
  if (rpcErr) {
    errEl.textContent = rpcErr.message;
    resultEl.innerHTML = '';
    return;
  }

  resultEl.innerHTML = '<p class="p">Tenant created &mdash; creating owner login&hellip;</p>';
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(CFG.url + '/admin/provision-owner', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token
    },
    body: JSON.stringify({ tenant_id: tenantId, email: ownerEmail, name })
  });
  const body = await res.json();
  if (!res.ok) {
    errEl.textContent = body.error || 'owner creation failed';
    resultEl.innerHTML = `<div class="ok-box">Tenant "<b>${esc(name)}</b>" was created (slug: ${esc(slug)}), but the owner login failed &mdash; you can retry just that step, or create the login directly with a POST to /admin/provision-owner.</div>`;
    return;
  }

  resultEl.innerHTML = `
    <div class="ok-box">
      <b>${esc(name)}</b> is live at <b>${esc(slug)}.auzslab.in</b><br><br>
      Share these with the owner directly (e.g. over WhatsApp) so they can sign in and change it:<br>
      Email: <b>${esc(ownerEmail)}</b><br>
      Temporary password: <b>${esc(body.temp_password)}</b>
    </div>`;
  e.target.reset();
  loadClients();
};
</script>
</body>
</html>
