<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Careers — apply to join AUZslab</title>
<meta name="description" content="Apply to join the AUZslab team. Send your name, a short note and your resume — we will review it and get back to you.">
<link rel="canonical" href="https://auzslab.in/careers.html">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main style="max-width:560px;margin:0 auto;padding:60px 20px 100px">
  <a href="index.html" style="display:inline-block;margin-bottom:30px"><img src="logo.png" alt="AUZslab" height="28"></a>
  <h1 style="font-size:28px;margin-bottom:8px">Apply to join AUZslab.</h1>
  <p style="color:var(--l,#666);margin-bottom:28px">Send your name, a short note and (optionally) your resume. We'll review it and get back to you.</p>
  <form id="careersForm" style="display:grid;gap:16px">
    <div><label for="j-name" style="display:block;font-size:13px;margin-bottom:4px">Your name</label><input id="j-name" name="name" type="text" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"></div>
    <div><label for="j-email" style="display:block;font-size:13px;margin-bottom:4px">Your email (becomes your sign-in if approved)</label><input id="j-email" name="email" type="email" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"></div>
    <div><label for="j-phone" style="display:block;font-size:13px;margin-bottom:4px">Phone</label><input id="j-phone" name="phone" type="tel" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"></div>
    <div><label for="j-note" style="display:block;font-size:13px;margin-bottom:4px">Tell us about yourself</label><textarea id="j-note" name="note" rows="4" placeholder="Role you're interested in, experience" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"></textarea></div>
    <div><label for="j-resume" style="display:block;font-size:13px;margin-bottom:4px">Resume (PDF, optional)</label><input id="j-resume" name="resume" type="file" accept="application/pdf"></div>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><input name="hp" tabindex="-1" autocomplete="off"></div>
    <div id="careersError" style="color:#b00020;display:none;font-size:13px"></div>
    <button type="submit" class="go" style="padding:12px;border-radius:8px;background:var(--ink,#111);color:#fff;border:none;font-size:15px;cursor:pointer">Submit application</button>
  </form>
  <div id="successView" style="display:none">
    <b>Got it.</b>
    <p>Thanks, <span id="successContact">you</span>. We'll review your application and get back to you. Once approved, sign in with Google on the <a href="account.html">account page</a> using the same email.</p>
  </div>
</main>
<script>
(function () {
  var form = document.getElementById('careersForm');
  var API = 'https://api.auzslab.in';
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var errBox = document.getElementById('careersError');
    errBox.style.display = 'none';
    var name = form.querySelector('[name="name"]').value.trim();
    var email = form.querySelector('[name="email"]').value.trim();
    var phone = form.querySelector('[name="phone"]').value.trim();
    var note = form.querySelector('[name="note"]').value.trim();
    var hp = (form.querySelector('[name="hp"]') || {}).value || '';
    var file = ((form.querySelector('[name="resume"]') || {}).files || [])[0];
    var goBtn = form.querySelector('.go');
    goBtn.disabled = true;
    fetch(API + '/rpc/submit_job_application', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_name: name, p_email: email, p_phone: phone, p_note: note, p_hp: hp }),
    }).then(function (res) {
      if (!res.ok) return res.json().then(function (j) { throw new Error((j && j.error) || 'submit failed'); });
      return res.json();
    }).then(function (data) {
      var id = data && data.id;
      if (id && file) return fetch(API + '/storage/job-application-resume/' + id, { method: 'POST', body: file }).catch(function () {});
    }).then(function () {
      form.style.display = 'none';
      document.getElementById('successContact').textContent = name || 'you';
      document.getElementById('successView').style.display = 'block';
    }).catch(function (err) {
      errBox.textContent = (err && err.message) || 'Something went wrong. Please try again, or email helloauzslab@gmail.com directly.';
      errBox.style.display = 'block';
      goBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
