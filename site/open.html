<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  window.dataLayer = window.dataLayer || [];

<title>Open your shop — AUZslab</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171717">
<link rel="icon" href="/logo.png">
<style>
:root{--ink:#171717;--accent:#800020;--bg:#f4f1ed;--card:#fff;--line:#e2dcd5;--dim:#6a625b}
@media (prefers-color-scheme:dark){:root{--ink:#f4f1ed;--bg:#171717;--card:#222;--line:#38332f;--dim:#a39b93}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;justify-content:center;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
main{width:100%;max-width:440px;margin:auto 0}
.brand{display:flex;align-items:center;gap:8px;margin:0 4px 18px;font:700 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.brand i{display:inline-block;width:12px;height:12px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{margin:0 0 6px;font-size:28px;line-height:1.15;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--dim);font-size:15px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
.row{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.row:focus-within{border-color:var(--ink)}
.row input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:15px 0 15px 16px}
.row span{display:flex;align-items:center;padding:0 14px 0 4px;color:var(--dim);font-size:15px}
button.main{margin-top:16px;width:100%;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:700 16px inherit;padding:16px;cursor:pointer}
button.main[disabled]{opacity:.55}
.err{min-height:20px;margin-top:10px;color:var(--accent);font-size:14px}
.links{margin:20px 4px 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.links a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;min-height:88px}
.tile small{font-weight:400;color:var(--dim);font-size:12.5px;line-height:1.35}
.tile:active{transform:scale(.98)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>AUZslab</div>

  <section class="card" id="pick">
    <h1>Open your shop</h1>
    <p>Type your shop name, the part before <b>.auzslab.in</b>. You can find it in your welcome message, or ask the shop owner.</p>
    <form id="form" autocomplete="off">
      <label for="slug">Shop name</label>
      <div class="row"><input id="slug" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="yourshop" aria-describedby="err"><span>.auzslab.in</span></div>
      <button class="main" id="go" type="submit">Open</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </section>

  <section class="card hide" id="hub">
    <h1 id="hubTitle">Your apps</h1>
    <p id="hubSub"></p>
    <div class="grid" id="tiles"></div>
  </section>

  <div class="links">
    <a href="pricing.html" id="newShop">New here? See plans</a>
    <a href="index.html">AUZslab website</a>
    <a href="#" id="change" class="hide">Not your shop? Change</a>
  </div>
</main>
<script src="/sb-client.js?v=5"></script>
<script>window.CFG = { url: 'https://api.auzslab.in', key: '' };</script>
<script src="open.js?v=1"></script>
</body>
</html>
