<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a;color:#f4f2ee;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.g{position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px}
.wrap{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));text-align:center}
.logo{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;height:26px;filter:invert(1);opacity:.9}
.big{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.5vw,16px);font-weight:800;letter-spacing:-.05em;line-height:.9;font-size:clamp(96px,30vw,260px)}
.big span{display:block}
.ring{position:relative;width:.78em;height:.78em;border-radius:50%;border:.1em solid #f4f2ee;display:grid;place-items:center}
.eye{display:block;width:.2em;height:.2em;border-radius:50%;background:#800020;box-shadow:0 0 .35em #80002099;transition:transform .12s ease-out}
.big .l{animation:fl 5s ease-in-out infinite}.big .r{animation:fl 5s ease-in-out -2.4s infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.06em) rotate(-3deg)}}
h1{margin:0;font-size:clamp(22px,4.4vw,34px);letter-spacing:-.02em;font-weight:700}
p{margin:0;color:#a8a39b;max-width:34em}
.path{font:13px ui-monospace,Menlo,Consolas,monospace;color:#8f8a84;background:#161616;border:1px solid #262626;border-radius:999px;padding:6px 14px;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;width:min(640px,100%);margin-top:6px}
.t{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px 18px;border-radius:18px;border:1px solid #2a2a2a;background:#121212;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,background .18s}
.t b{font-size:17px}.t small{color:#8f8a84;font-size:13px}
.t:hover,.t:focus-visible{transform:translateY(-3px);border-color:#800020;background:#1a1012;outline:none}
.t.m{background:#800020;border-color:#800020}.t.m small{color:#f1d3da}.t.m:hover{background:#9a0a2c}
.cd{font-size:13px;color:#8f8a84}.cd button{all:unset;cursor:pointer;color:#f4f2ee;text-decoration:underline;margin-left:6px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.big .l,.big .r{animation:none}.eye{transition:none}}
</style>
<body>
<div class="g"></div>
<div class="wrap">
  <a href="/"><img class="logo" src="/logo.png" alt="AUZslab"></a>
  <div class="big" aria-hidden="true"><span class="l">4</span><span class="ring"><i class="eye" id="eye"></i></span><span class="r">4</span></div>
  <h1>This page wandered off.</h1>
  <p>The link may be old or mistyped. Nothing is broken on your side. Pick a way back in:</p>
  <div class="path" id="path"></div>
  <div class="tiles">
    <a class="t m" href="/themes.html"><b>See the themes</b><small>Ready-made storefront looks</small></a>
    <a class="t" href="/"><b>Go to the homepage</b><small>Start from the beginning</small></a>
    <a class="t" href="/contact.html"><b>Talk to us</b><small>We reply quickly</small></a>
  </div>
  <div class="cd" id="cd">Taking you home in <b id="n">15</b>s <button id="stop" type="button">Stay here</button></div>
</div>
<script>
(function(){
  var p=document.getElementById('path');p.textContent=location.host+location.pathname;
  var eye=document.getElementById('eye');
  function look(x,y){var r=eye.parentNode.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy)||1,m=Math.min(r.width*.22,d);eye.style.transform='translate('+(dx/d*m)+'px,'+(dy/d*m)+'px)';}
  addEventListener('pointermove',function(e){look(e.clientX,e.clientY);});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t)look(t.clientX,t.clientY);},{passive:true});
  var n=15,on=true,el=document.getElementById('n');
  var t=setInterval(function(){if(!on)return;n--;el.textContent=n;if(n<=0){clearInterval(t);location.href='/';}},1000);
  document.getElementById('stop').onclick=function(){on=false;clearInterval(t);document.getElementById('cd').textContent='Staying here. Use any button above.';};
})();
</script>
</body>
</html>
