name: Native AUZsLedger (Android)
on:
  workflow_dispatch:
  push:
    paths: ['native/auzsledger/**', '.github/workflows/native-ledger.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native/auzsledger } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Play upload key (only if the secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using the Play upload key"
          else
            echo "No upload key secrets: the bundle is signed with the shared TEST key (not for Play)"
          fi
      - name: Firebase file (only if the secret is set)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; echo "Push alerts: Firebase file added"; else echo "No Firebase secret: push alerts stay off"; fi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with: { name: AUZsLedger-apk, path: native/auzsledger/build/app/outputs/flutter-apk/app-release.apk }
      - uses: actions/upload-artifact@v4
        with: { name: AUZsLedger-aab, path: native/auzsledger/build/app/outputs/bundle/release/app-release.aab }
      - name: Publish APK on a release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AUZsLedger.apk
          cp build/app/outputs/bundle/release/app-release.aab AUZsLedger.aab
          gh release delete native-ledger-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create native-ledger-latest AUZsLedger.apk AUZsLedger.aab --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "AUZsLedger Android (test build)" --notes "Test build of the native AUZsLedger app. Tap AUZsLedger.apk below to download, then open it to install. The .aab is the Google Play bundle: it is only valid for Play when this build ran with the owner upload key secrets, otherwise it is signed with the shared test key."
