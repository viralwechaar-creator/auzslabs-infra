name: Native AUZsPOS (Android)
on:
  workflow_dispatch:
  push:
    paths: ['native/auzspos/**', '.github/workflows/native-pos.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native/auzspos } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: AUZsPOS-apk, path: native/auzspos/build/app/outputs/flutter-apk/app-release.apk }
      - name: Publish APK on a release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AUZsPOS.apk
          gh release delete native-pos-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create native-pos-latest AUZsPOS.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "AUZsPOS Android (test build)" --notes "Test build of the native AUZsPOS app. Tap AUZsPOS.apk below to download, then open it to install."
