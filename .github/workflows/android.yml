name: Android build
# Run from the Actions tab. app = pos, mob, payroll, accounts, scan or all.
# Always builds a test APK. If the four signing secrets exist (see docs/ANDROID_RELEASE.md) it also builds the signed
# release bundle (.aab) that you upload to Google Play.
on:
  workflow_dispatch:
    inputs:
      app: {description: "pos, mob, payroll, accounts, scan or all", default: all}
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - id: p
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then echo 'apps=["pos","mob","payroll","accounts","scan"]' >> $GITHUB_OUTPUT; else echo 'apps=["${{ inputs.app }}"]' >> $GITHUB_OUTPUT; fi
  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: pip install pillow
      - name: Restore upload key (if provided)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; echo "HAVE_KEY=1" >> $GITHUB_ENV; fi
      - working-directory: mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Native push (Firebase, db/119) -- one google-services.json secret. build.mjs writes it only
          # for apps whose package name (mobile/apps.json "id") is registered in that Firebase project;
          # any other app builds without push instead of failing. To give an app push, add its package
          # name as an Android app in Firebase, download google-services.json again and update the secret.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: npm install && node build.mjs ${{ matrix.app }}
      - name: Test APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Signed release bundle
        if: env.HAVE_KEY == '1'
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: auzslab-${{ matrix.app }}
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
      - name: Publish on a release page (no GitHub login needed to download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AUZslab-${{ matrix.app }}.apk
          ASSETS="AUZslab-${{ matrix.app }}.apk"
          if [ -f mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab AUZslab-${{ matrix.app }}.aab
            ASSETS="$ASSETS AUZslab-${{ matrix.app }}.aab"
          fi
          gh release delete wrapper-${{ matrix.app }}-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create wrapper-${{ matrix.app }}-latest $ASSETS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "AUZslab ${{ matrix.app }} (Android, test build)" \
            --notes "Test build of the AUZslab ${{ matrix.app }} app (the wrapper around the real website, not the separate native Flutter app of the same name). Tap AUZslab-${{ matrix.app }}.apk below to download, then open it to install -- your phone will warn about an unknown source the first time, that is expected for a test build. The .aab (if present) is only valid for the Play Store once this build ran with the real owner signing-key secrets; otherwise skip it."
