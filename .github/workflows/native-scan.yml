name: Native AUZsScan (Android)
on:
  workflow_dispatch:
  push:
    paths: ['native/auzsscan/**', '.github/workflows/native-scan.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native/auzsscan } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: AUZsScan-apk, path: native/auzsscan/build/app/outputs/flutter-apk/app-release.apk }
      - name: Publish APK on a release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AUZsScan.apk
          gh release delete native-scan-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create native-scan-latest AUZsScan.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "AUZsScan Android (test build)" --notes "Test build of the native AUZsScan app. Tap AUZsScan.apk below to download, then open it to install."
