name: iOS build (iPhone + iPad)
# Run from the Actions tab on a macOS runner. app = pos (default; the only one with an iOS project today).
# Gives an unsigned simulator build only -- proves the Xcode project actually compiles. This is the only
# check this sandbox can do for an iOS project, since there is no macOS runner or device here.
# No app has a signed .ipa / TestFlight pipeline right now: the hub app (which used to be signed here) was
# removed per owner request. Wiring up a signed build for any app needs its own provisioning profile from
# the owner's Apple Developer account first -- see docs/IOS_RELEASE.md before adding that back.
# Never run on a real iPhone from the build sandbox: the first CI run is the first real check.
on:
  workflow_dispatch:
    inputs:
      app: {description: "pos", default: pos}
jobs:
  ios:
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: pip3 install pillow
      - name: Create the Xcode project
        working-directory: mobile
        run: npm install && node build-ios.mjs ${{ inputs.app }}
      - name: Build for the simulator (no signing needed; proves the project compiles)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
